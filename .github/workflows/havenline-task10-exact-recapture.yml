name: Havenline T10 exact-SHA recapture
on:
  push:
    branches: ['havenline/review-T10-final-closeout-controller']
    paths:
      - '.github/workflows/havenline-task10-exact-recapture.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: havenline-t10-exact-recapture
  cancel-in-progress: true

jobs:
  exact-recapture:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    env:
      CANDIDATE: '8d259d918c35df024d3cbb8c8644f76fa08309c0'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.CANDIDATE }}
          fetch-depth: 0
          lfs: false

      - name: Freeze exact source and prepare evidence directories
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          test "$(git rev-parse origin/codex/havenline-sequential-task-01)" = "$CANDIDATE"
          mkdir -p task10-isolated-evidence/tests task10-isolated-evidence/capture task10-isolated-evidence/device-layout task10-isolated-evidence/native4k task10-isolated-evidence/benchmark
          python3 -m pip install --disable-pip-version-check --no-input numpy==2.3.5 pillow==12.3.0
          python3 tools/havenline/task10/validate_post_t09_adapter.py --require-bound

      - name: Prepare pinned Godot and software render path
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg xvfb mesa-vulkan-drivers
          mkdir -p "$RUNNER_TEMP/engine"
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o "$RUNNER_TEMP/engine/engine.zip"
          (cd "$RUNNER_TEMP/engine"; echo '9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65  engine.zip' | sha512sum -c -; unzip -q engine.zip; chmod +x Godot_v4.7.2-stable_linux.x86_64)
          echo "$RUNNER_TEMP/engine" >> "$GITHUB_PATH"
          CANDIDATE="$CANDIDATE" python3 - <<'PY'
          import json,os
          from pathlib import Path
          fields=['ImageOS','ImageVersion','RUNNER_OS','RUNNER_ARCH']
          record={k:os.environ.get(k,'') for k in fields}
          assert all(record.values()),record
          record.update(candidate_commit=os.environ['CANDIDATE'],godot='4.7.2.stable.official.ed1daf0bf')
          Path('task10-isolated-evidence/runtime-provenance.json').write_text(json.dumps(record,indent=2))
          PY

      - name: Run T10 domain and integration proof
        run: |
          set -euo pipefail
          export GITHUB_SHA="$CANDIDATE"
          timeout 240 Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path HavenlineGodot --import --quit > task10-isolated-evidence/tests/import.log 2>&1
          timeout 300 Godot_v4.7.2-stable_linux.x86_64 --headless --audio-driver Dummy --path HavenlineGodot --script res://tests/test_task10_world_transform.gd > task10-isolated-evidence/tests/domain.log 2>&1
          timeout 300 Godot_v4.7.2-stable_linux.x86_64 --headless --audio-driver Dummy --path HavenlineGodot --script res://tests/test_task10_integration.gd > task10-isolated-evidence/tests/integration.log 2>&1
          if grep -E 'SCRIPT ERROR|Parse Error|ObjectDB instances were leaked' task10-isolated-evidence/tests/*.log; then exit 1; fi
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          cand=os.environ['GITHUB_SHA']
          for src,dst,minimum in [('domain.log','domain-tests.json',130),('integration.log','integration-tests.json',60)]:
              reports=[json.loads(x) for x in Path('task10-isolated-evidence/tests/'+src).read_text().splitlines() if x.startswith('{')]
              assert reports,src
              r=reports[-1]
              assert r.get('passed') is True and not r.get('failures'),r
              assert r.get('check_count',0)>=minimum,r
              r['candidate']=cand;r['integration_allowed']=False;r['task_approved']=False
              Path('task10-isolated-evidence/'+dst).write_text(json.dumps(r,indent=2))
          domain=json.loads(Path('task10-isolated-evidence/domain-tests.json').read_text())
          assert domain.get('stress_targets')==512 and domain.get('stress_transactions')==1024
          assert domain.get('stress_retained_receipts')==512
          assert domain.get('preview_stress_iterations')==5000 and domain.get('reject_stress_iterations')==5000
          assert domain.get('catalog_stress_recipes')==258
          integ=json.loads(Path('task10-isolated-evidence/integration-tests.json').read_text())
          assert integ.get('fixture_simulation_only') is False and integ.get('real_t09_adapter_bound') is True
          assert integ.get('r11_world_response_tested') is True
          assert integ.get('visual_node_budget')==4 and integ.get('visual_build_count')==1 and integ.get('visual_node_count')==4
          PY
          python3 tools/havenline/task10/validate_world_transform.py --candidate "$CANDIDATE" --output task10-isolated-evidence/source-contract.json

      - name: Capture lifecycle evidence
        run: |
          set -euo pipefail
          export VK_ICD_FILENAMES=$(find /usr/share/vulkan/icd.d -name '*lvp*json' | head -1)
          xvfb-run -a -s '-screen 0 1280x720x24' timeout 300 Godot_v4.7.2-stable_linux.x86_64 --path HavenlineGodot --rendering-method mobile --rendering-driver vulkan --audio-driver Dummy --resolution 1280x720 --fixed-fps 30 --write-movie "$(pwd)/task10-isolated-evidence/capture/lifecycle.avi" --script res://tests/capture_task10_world_transform.gd -- --candidate="$CANDIDATE" --out="$(pwd)/task10-isolated-evidence/capture" > task10-isolated-evidence/capture/capture.log 2>&1
          if grep -E 'SCRIPT ERROR|Parse Error|ObjectDB instances were leaked' task10-isolated-evidence/capture/capture.log; then exit 1; fi
          CANDIDATE="$CANDIDATE" python3 - <<'PY'
          import hashlib,json,struct,os
          from pathlib import Path
          root=Path('task10-isolated-evidence/capture');m=json.loads((root/'manifest.json').read_text())
          assert m.get('candidate')==os.environ['CANDIDATE'] and m.get('passed') is True and m.get('record_count')==12,m
          assert m.get('states')==['ready','blocked','preview','committing','complete','replay']
          assert m.get('angles')==['front','three-quarter']
          hashes=set()
          for row in m['records']:
              data=(root/row['file']).read_bytes();w,h=struct.unpack('>II',data[16:24]);assert (w,h)==(1280,720);hashes.add(hashlib.sha256(data).hexdigest())
          assert len(hashes)==12 and m['exact_replay_verified'] and m['motion_frames_per_state']==30
          PY
          ffmpeg -y -i task10-isolated-evidence/capture/lifecycle.avi -c:v libx264 -crf 18 -pix_fmt yuv420p task10-isolated-evidence/capture/lifecycle.mp4
          ffmpeg -y -i task10-isolated-evidence/capture/lifecycle.mp4 -vf "select='not(mod(n,15))'" -vsync vfr task10-isolated-evidence/capture/motion-%03d.png
          ffprobe -v error -show_streams -show_format -of json task10-isolated-evidence/capture/lifecycle.mp4 > task10-isolated-evidence/capture/motion-probe.json
          rm task10-isolated-evidence/capture/lifecycle.avi

      - name: Recapture authoritative device matrix
        run: |
          set -euo pipefail
          export VK_ICD_FILENAMES=$(find /usr/share/vulkan/icd.d -name '*lvp*json' | head -1)
          python3 - <<'PY' > /tmp/t10-device-matrix.tsv
          import json
          from pathlib import Path
          matrix=json.loads(Path('Docs/Production/DEVICE_LAYOUT_MATRIX.json').read_text())
          assert matrix.get('landscape_required') is True and len(matrix.get('states',[]))==6
          for row in matrix['states']:
              w,h=row['logical_size'];print(f"{row['id']}\t{w}\t{h}")
          PY
          while IFS=$'\t' read -r device width height; do
            out="$(pwd)/task10-isolated-evidence/device-layout/$device";mkdir -p "$out"
            set +e
            xvfb-run -a -s "-screen 0 ${width}x${height}x24" timeout 300 Godot_v4.7.2-stable_linux.x86_64 --path HavenlineGodot --rendering-method mobile --rendering-driver vulkan --audio-driver Dummy --resolution "${width}x${height}" --script res://tests/capture_task10_world_transform.gd -- --candidate="$CANDIDATE" --device-check --exhaustive-projections --device-id="$device" --width="$width" --height="$height" --out="$out" > "$out/capture.log" 2>&1
            rc=$?;set -e;echo "$rc" > "$out/process-exit.txt";test "$rc" -eq 0 -o "$rc" -eq 1;test -s "$out/manifest.json"
          done < /tmp/t10-device-matrix.tsv
          CANDIDATE="$CANDIDATE" python3 - <<'PY'
          import hashlib,json,struct,os
          from collections import Counter,defaultdict
          from pathlib import Path
          matrix=json.loads(Path('Docs/Production/DEVICE_LAYOUT_MATRIX.json').read_text());root=Path('task10-isolated-evidence/device-layout')
          rows=[];projection_rows=[];failures=[];by_hash=defaultdict(list);by_device=defaultdict(dict);reasons=Counter()
          states=['ready','blocked','preview','committing','complete','replay'];angles=['front','side','three-quarter','overhead','gameplay','detail']
          for device_row in matrix['states']:
              device=device_row['id'];expected=device_row['logical_size'];d=root/device;m=json.loads((d/'manifest.json').read_text());rc=int((d/'process-exit.txt').read_text())
              assert rc in (0,1) and m.get('candidate')==os.environ['CANDIDATE'] and m.get('logical_size')==expected and m.get('device_id')==device
              assert m.get('states')==states and m.get('record_count')==6 and m.get('projection_angles')==angles and m.get('projection_record_count')==36 and m.get('exhaustive_projections') is True
              for record in m['records']:
                  data=(d/record['file']).read_bytes();w,h=struct.unpack('>II',data[16:24]);assert [w,h]==expected
                  digest=hashlib.sha256(data).hexdigest();row={'device':device,'state':record['state'],'size':[w,h],'sha256':digest};rows.append(row);by_hash[digest].append(row);by_device[device][record['state']]=digest
              for record in m['projection_records']:
                  rr=record['projected_readability'];prow={'device':device,'state':record['state'],'angle':record['angle'],'passed':bool(rr.get('passed',False)),'readability':rr};projection_rows.append(prow)
                  if not prow['passed']:
                      why=[]
                      if rr.get('overlap',False):why.append('overlap')
                      if not rr.get('fully_in_frame',False):why.append('containment')
                      if float(rr.get('clearance_px',-1))+0.01<float(rr.get('required_clearance_px',0)):why.append('clearance')
                      if not rr.get('priority_ok',False):why.append('priority')
                      if not rr.get('placement_found',True):why.append('no_legal_placement')
                      if float(rr.get('label_scale',1.0))+0.0001<float(rr.get('minimum_readability_scale',0.85)):why.append('readability_floor')
                      if not why:why.append('other')
                      for x in why:reasons[x]+=1
                      failures.append({**prow,'failure_reasons':why})
          assert len(rows)==36 and len(projection_rows)==216 and len({(x['device'],x['state'],x['angle']) for x in projection_rows})==216
          for s in matrix['states']:
              d=s['id'];assert by_device[d]['preview']!=by_device[d]['committing']
          report={'device_count':6,'capture_count':36,'projection_count':216,'projection_failure_count':len(failures),'projection_failure_reason_counts':dict(sorted(reasons.items())),'projection_failures':failures,'complete_failure_set_collected':True,'passed':not failures,'integration_allowed':False,'task_approved':False,'rows':rows}
          Path('task10-isolated-evidence/device-layout-evidence.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps({k:v for k,v in report.items() if k not in ('rows','projection_failures')},indent=2))
          if failures:raise SystemExit(f"{len(failures)} projection failures")
          PY

      - name: Recapture native 4K six-state six-angle evidence
        run: |
          set -euo pipefail
          export VK_ICD_FILENAMES=$(find /usr/share/vulkan/icd.d -name '*lvp*json' | head -1)
          xvfb-run -a -s '-screen 0 3840x2160x24' timeout 600 Godot_v4.7.2-stable_linux.x86_64 --path HavenlineGodot --rendering-method mobile --rendering-driver vulkan --audio-driver Dummy --resolution 3840x2160 --script res://tests/capture_task10_world_transform.gd -- --candidate="$CANDIDATE" --production-evidence --width=3840 --height=2160 --out="$(pwd)/task10-isolated-evidence/native4k" > task10-isolated-evidence/native4k/capture.log 2>&1
          if grep -E 'SCRIPT ERROR|Parse Error|ObjectDB instances were leaked' task10-isolated-evidence/native4k/capture.log; then exit 1; fi
          CANDIDATE="$CANDIDATE" python3 - <<'PY'
          import hashlib,json,struct,os
          from pathlib import Path
          root=Path('task10-isolated-evidence/native4k');m=json.loads((root/'manifest.json').read_text());states=['ready','blocked','preview','committing','complete','replay'];angles=['front','side','three-quarter','overhead','gameplay','detail']
          assert m.get('candidate')==os.environ['CANDIDATE'] and m.get('passed') is True and m.get('native_scale_1') is True and m.get('capture_resolution')==[3840,2160]
          assert m.get('record_count')==36 and m.get('states')==states and m.get('angles')==angles
          assert m.get('view_visual_node_count')==4 and m.get('view_visual_build_count')==1 and m.get('real_t09_adapter_bound') is True and m.get('exact_debit_verified') is True
          files=[];hashes=set()
          for row in m['records']:
              p=root/row['file'];data=p.read_bytes();w,h=struct.unpack('>II',data[16:24]);assert (w,h)==(3840,2160)
              digest=hashlib.sha256(data).hexdigest();hashes.add(digest);files.append({'file':row['file'],'state':row['state'],'angle':row['angle'],'size':[w,h],'bytes':len(data),'sha256':digest})
          assert len(files)==36 and len(hashes)==36
          Path('task10-isolated-evidence/native4k-evidence.json').write_text(json.dumps({'task':'T10','candidate':m['candidate'],'native_scale_1':True,'resolution':[3840,2160],'state_count':6,'angle_count':6,'capture_count':36,'unique_capture_count':36,'states':states,'angles':angles,'files':files,'integration_allowed':False,'real_t09_adapter_bound':True,'exact_debit_verified':True,'task_approved':False,'passed':True},indent=2))
          PY

      - name: Measure performance and package fresh critic input
        run: |
          set -euo pipefail
          export GITHUB_SHA="$CANDIDATE"
          export VK_ICD_FILENAMES=$(find /usr/share/vulkan/icd.d -name '*lvp*json' | head -1)
          python3 tools/havenline/task10/benchmark_supervisor.py --candidate "$CANDIDATE" --output task10-isolated-evidence/benchmark
          python3 tools/havenline/task10/validate_progression.py --candidate "$CANDIDATE" --output task10-isolated-evidence/progression.json
          python3 tools/havenline/production/save_state_matrix.py --candidate "$CANDIDATE" --task T10 --adapter "python3 tools/havenline/task10/save_matrix_adapter.py" --out task10-isolated-evidence/save-matrix > task10-isolated-evidence/save-matrix-summary.json
          python3 tools/havenline/task10/build_critic_evidence.py --candidate "$CANDIDATE" --evidence-root task10-isolated-evidence
          python3 tools/havenline/production/critic_harness.py performance --candidate "$CANDIDATE" --record critic-input/performance.json > task10-isolated-evidence/C6.json
          python3 tools/havenline/task10/validate_critic_readiness.py --evidence-root task10-isolated-evidence --candidate "$CANDIDATE" --output task10-isolated-evidence/critic-readiness.json
          python3 - <<'PY'
          import json
          r=json.load(open('task10-isolated-evidence/critic-readiness.json'))
          assert r.get('passed') is True and r.get('isolated_critic_input_ready') is True,r
          PY

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: havenline-task10-exact-recapture-${{ env.CANDIDATE }}
          path: |
            task10-isolated-evidence/
            critic-input/
          if-no-files-found: error
          retention-days: 90
