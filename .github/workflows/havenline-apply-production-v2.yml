name: Havenline apply production governance V2
on:
  push:
    branches: ['codex/havenline-sequential-task-01']
    paths: ['.github/workflows/havenline-apply-production-v2.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/havenline-sequential-task-01
          fetch-depth: 0
      - name: Reassemble and verify locally validated governance payload
        run: |
          set -euo pipefail
          cat tools/havenline/bootstrap_v2_payload_01.b64 tools/havenline/bootstrap_v2_payload_02.b64 tools/havenline/bootstrap_v2_payload_03.b64 > /tmp/havenline-v2.b64
          test "$(wc -c < /tmp/havenline-v2.b64)" -eq 49816
          base64 -d /tmp/havenline-v2.b64 > /tmp/havenline-v2.tar.gz
          echo '41b23ddfa7ecae96c0e0fabc1d607abbf37266c6a99b483efcdd02f6cf657ae7  /tmp/havenline-v2.tar.gz' | sha256sum -c -
          tar -tzf /tmp/havenline-v2.tar.gz | tee /tmp/havenline-v2-members.txt
          ! grep -Ev '^(AGENTS\.md|Docs/Production/|tools/havenline/production/|HavenlineGodot/tests/production_(capture_harness|motion_capture)\.gd$)' /tmp/havenline-v2-members.txt
          tar -xzf /tmp/havenline-v2.tar.gz -C .
      - name: Validate the extracted migration before committing
        run: |
          set -euo pipefail
          python3 -m py_compile tools/havenline/production/*.py
          python3 -m unittest discover -s tools/havenline/production/tests -v
          python3 tools/havenline/production/workstream.py validate-registry
          python3 tools/havenline/production/validate_migration.py
          python3 tools/havenline/production/task_packet.py T03
          test -s Docs/Production/Evidence/T03/TASK_PACKET.md
          git diff --check
      - name: Commit governance migration files only
        run: |
          set -euo pipefail
          rm -f tools/havenline/bootstrap_v2_payload_01.b64 tools/havenline/bootstrap_v2_payload_02.b64 tools/havenline/bootstrap_v2_payload_03.b64
          git config user.name havenline-integration-owner
          git config user.email havenline-integration-owner@users.noreply.github.com
          git add AGENTS.md Docs/Production tools/havenline/production HavenlineGodot/tests/production_capture_harness.gd HavenlineGodot/tests/production_motion_capture.gd
          git add -u tools/havenline/bootstrap_v2_payload_01.b64 tools/havenline/bootstrap_v2_payload_02.b64 tools/havenline/bootstrap_v2_payload_03.b64
          git diff --cached --check
          git diff --cached --name-only
          git diff --cached --quiet && { echo 'No migration changes staged'; exit 1; }
          git commit -m 'Migrate Havenline production governance to controlled parallel V2'
          git push origin HEAD:codex/havenline-sequential-task-01
# One-shot governance/QA migration only. No T04+ runtime feature implementation.
