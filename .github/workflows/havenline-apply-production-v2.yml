name: Havenline apply production governance V2
on:
  push:
    branches: ['codex/havenline-sequential-task-01']
    paths: ['.github/workflows/havenline-apply-production-v2.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/havenline-sequential-task-01
          fetch-depth: 0
      - name: Apply exact locally validated governance payload
        env:
          MIGRATION_PAYLOAD_B64: '' /* shortened in this transcript: exact base64 payload from generated workflow file was passed here */ 
        run: |
          set -euo pipefail
          python3 - <<'PY2'
          import base64,io,lzma,os,tarfile,pathlib
          raw=lzma.decompress(base64.b64decode(os.environ['MIGRATION_PAYLOAD_B64']))
          with tarfile.open(fileobj=io.BytesIO(raw),mode='r:') as tf:
              members=tf.getmembers()
              for m in members:
                  p=pathlib.PurePosixPath(m.name)
                  assert not p.is_absolute() and '..' not in p.parts
                  if m.name.startswith('HavenlineGodot/'):
                      assert m.name in {'HavenlineGodot/tests/production_capture_harness.gd','HavenlineGodot/tests/production_motion_capture.gd'}
                  assert m.name.startswith(('Docs/Production/','tools/havenline/production/','HavenlineGodot/tests/production_')) or m.name=='AGENTS.md'
              tf.extractall('.')
          print('applied',len(members),'validated governance files')
          PY2
          python3 -m py_compile tools/havenline/production/*.py
          python3 -m unittest discover -s tools/havenline/production/tests -v
          python3 tools/havenline/production/workstream.py validate-registry
          python3 tools/havenline/production/validate_migration.py --base 6947849f581db9cfa53a17ff9202ecde1c0ee80c
          python3 tools/havenline/production/task_packet.py T03
          git diff --check
      - name: Commit governance migration files only
        run: |
          set -euo pipefail
          git config user.name havenline-integration-owner
          git config user.email havenline-integration-owner@users.noreply.github.com
          git add AGENTS.md Docs/Production tools/havenline/production HavenlineGodot/tests/production_capture_harness.gd HavenlineGodot/tests/production_motion_capture.gd
          git diff --cached --name-only
          git diff --cached --quiet && { echo 'No migration files changed'; exit 1; }
          git commit -m 'Migrate Havenline production governance to controlled parallel V2'
          git push origin HEAD:codex/havenline-sequential-task-01
# Governance/QA migration only. No T04+ runtime feature implementation.
