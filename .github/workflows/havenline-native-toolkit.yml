name: HAVENLINE Pinned Native Validation Toolkit
on:
  push:
    branches: ['codex/havenline-godot-android']
    paths: ['.github/workflows/havenline-native-toolkit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  toolkit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download and verify pinned native Godot editor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p toolkit
          base='https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable'
          curl -fL --retry 3 "$base/Godot_v4.7.2-stable_linux.x86_64.zip" -o editor.zip
          echo '9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65  editor.zip' | sha512sum -c -
          unzip -q editor.zip -d toolkit
          chmod +x toolkit/Godot_v4.7.2-stable_linux.x86_64
          toolkit/Godot_v4.7.2-stable_linux.x86_64 --version | tee toolkit/VERSION.txt
          (cd toolkit && sha256sum Godot_v4.7.2-stable_linux.x86_64 > SHA256SUMS.txt)
          printf '%s\n' 'Pinned public engine binary for native source tests and software-rendered review. This archive is not a game build, independent critic, or physical-device benchmark.' > toolkit/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: HAVENLINE-pinned-native-toolkit-${{ github.sha }}
          path: toolkit/
          retention-days: 30
          if-no-files-found: error
