name: Havenline T02 full-evidence publisher review
on:
  push:
    branches: ['codex/havenline-sequential-task-01']
    paths: ['.github/workflows/havenline-task02-publisher-review.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  independent-role:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        role: [reference-fidelity, visual-integrity]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      REVIEW_ROLE: ${{ matrix.role }}
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: havenline-T02-bank-evidence-34528232295
          run-id: 34528232295
          github-token: ${{ github.token }}
          path: evidence/
      - run: python3 -m pip install 'gradio_client==1.14.0' pillow
      - name: Inspect all 45 original frames independently with actual source conditions
        run: python3 -u tools/havenline/review_task02_publisher.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: havenline-T02-publisher-${{ matrix.role }}-${{ github.run_id }}
          path: publisher-review/
          retention-days: 30
          if-no-files-found: error
  raw-review-gate:
    needs: independent-role
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: havenline-T02-publisher-*-${{ github.run_id }}
          path: gate-report/reviews/
      - uses: actions/download-artifact@v4
        with:
          name: havenline-T02-bank-evidence-34528232295
          run-id: 34528232295
          github-token: ${{ github.token }}
          path: evidence/
      - name: Require both full independent roles, original image hashes, exact raw scores and blind controls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,html,re,hashlib,math
          source='96f8d396a5015e136c590dc496214a689adb1e43';space='eb7f245e2c0d3b573dd8ed6addca9b7f6af26847'
          roles={'reference-fidelity','visual-integrity'}
          groups={'workfloor','shoreline','snow-contact','tree-visibility','camera-route-early','camera-route-late','water-sequence','night-overview'}
          dims={'reference_fidelity','material_finish','geometry_contact','layout_readability','view_consistency'}
          expected={'A':'human_character','B':'snow_tree','C':'snow_tree','D':'human_character'}
          def sha(p):return hashlib.sha256(p.read_bytes()).hexdigest()
          def parse_response(p):
              raw=json.loads(p.read_text());text=raw[-1][1]
              clean=html.unescape(re.sub(r'<[^>]+>','\n',text));start=clean.find('{');assert start>=0
              value,_=json.JSONDecoder().raw_decode(clean[start:]);return value
          errors=[];allrows=[];seen=set();scores={}
          e=Path('evidence');pro=json.loads((e/'provenance.json').read_text());tests=json.loads((e/'tests.json').read_text())
          assert pro['source']==source and len(pro['captures'])==45
          assert tests['all_passed'] and tests['total_checks']==726 and len(tests['suites'])==13
          for name,h in pro['captures'].items():
              if sha(e/name)!=h:errors.append('Changed source image '+name)
          for path in Path('gate-report/reviews').glob('*/role-summary.json'):
              role_report=json.loads(path.read_text());role=role_report['role'];seen.add(role)
              if role not in roles or role_report['source']!=source:errors.append('Source/role mismatch '+str(path))
              pr=json.loads((path.parent/'provider-provenance.json').read_text())
              if pr['source']!=source or pr['provider_space_revision']!=space or pr.get('independent_model_execution') is not True:errors.append('Provider execution/provenance mismatch '+role)
              try:
                  control=json.loads((path.parent/'control.json').read_text())
                  if control['passed'] is not True or control['answers']!=expected or parse_response(path.parent/'control-raw.json')!=expected:errors.append('Blind control failed '+role)
              except Exception as exc:errors.append('Control unavailable '+role+': '+str(exc))
              rows=role_report['reviews'];covered=set();seen_groups=set()
              if len(rows)!=8:errors.append('Missing groups '+role)
              for row in rows:
                  group=row['group'];seen_groups.add(group);label=role+'/'+group
                  if row.get('source')!=source or row.get('role')!=role or row.get('independent_execution') is not True or row.get('passed') is not True:errors.append('Not passing '+label)
                  review=row.get('review',{});s=review.get('scores',{})
                  if set(s)!=dims or any(type(v) not in (float,int) or not math.isfinite(v) or not 9<=v<=10 for v in s.values()):errors.append('Invalid/below9 scores '+label)
                  elif row.get('lowest_score')!=min(s.values()):errors.append('Wrong minimum '+label)
                  if review.get('defects')!=[] or review.get('coverage_complete') is not True or review.get('confidence') not in ('medium','high'):errors.append('Defect or incomplete evidence '+label)
                  try:
                      if parse_response(path.parent/(group+'-raw.json'))!=review:errors.append('Raw/scored mismatch '+label)
                      request=json.loads((path.parent/(group+'-request.json')).read_text())
                      if sha(path.parent/(group+'-input.png'))!=request['image_sha256'] or request['image_sha256']!=row['execution']['image_sha256']:errors.append('Input binding mismatch '+label)
                  except Exception as exc:errors.append('Missing/malformed execution '+label+': '+str(exc))
                  for item in row['inputs']:
                      covered.add(item['filename'])
                      if pro['captures'].get(item['filename'])!=item['sha256']:errors.append('Wrong frame '+label+'/'+item['filename'])
              if seen_groups!=groups or covered!=set(pro['captures']):errors.append('Incomplete actual frame coverage '+role)
              scores[role]=min((r.get('lowest_score',0) for r in rows),default=None);allrows+=rows
          if seen!=roles or len(allrows)!=16:errors.append('Both complete roles were not returned')
          report={'task':'T02','source':source,'mechanical_and_independent_reviews_passed':not errors,'errors':errors,'role_lowest_scores':scores,'reviews':allrows,'minimum_task_score':9,'target':10,'engine_assertions':726,'required_frames':45,'provider_declared_model':'qwen3-vl-235b-a22b-instruct','public_application_revision':space,'weights_locally_checksum_verified':False,'roles_same_published_model':True,'prior_failed_reviews_preserved':True,'final_actual_pixel_and_disagreement_adjudication_required':True,'task_approved':False,'task3_started':False,'game_complete':False,'physical_phone_tablet4k60_verified':False}
          out=Path('gate-report');out.mkdir(exist_ok=True);(out/'T02-publisher-gate.json').write_text(json.dumps(report,indent=2));print(json.dumps(report,indent=2))
          raise SystemExit(0 if not errors else 1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: havenline-T02-publisher-complete-evidence-${{ github.run_id }}
          path: gate-report/
          retention-days: 30
          if-no-files-found: error
# Uses the publisher's public demo normally, at two sequential review sessions maximum.
# Respect refusal/rate limits. No user token, billing changes, prior grades in prompts,
# modified source images, new artwork, automatic advancement or user-facing APK.
