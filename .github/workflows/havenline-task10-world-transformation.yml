name: Havenline Task 10 world transformation candidate

on:
  push:
    branches: ['havenline/T10-world-transformation', 'codex/havenline-sequential-task-01']
    paths:
      - 'HavenlineGodot/scripts/world_transform.gd'
      - 'HavenlineGodot/scripts/world_transform_view.gd'
      - 'HavenlineGodot/data/world_transform_recipes.json'
      - 'HavenlineGodot/assets/world_transform_v1/**'
      - 'HavenlineGodot/tests/test_task10_*.gd'
      - 'Docs/Production/T10/**'
      - '!Docs/Production/T10/verified-completion.json'
      - '!Docs/Production/T10/Evidence/**'
      - '!Docs/Production/T10/task-state.json'
      - '!Docs/Production/T10/ReviewExports/**'
      - '!Docs/Production/T10/CriticRaw/**'
      - '!Docs/Production/T10/independent-critic-review.json'
      - '!Docs/Production/T10/defect-ledger.json'
      - 'tools/havenline/task10/**'
      - '.github/workflows/havenline-task10-*.yml'
  pull_request:
    branches: ['havenline/T10-world-transformation']
    paths:
      - 'HavenlineGodot/scripts/world_transform.gd'
      - 'HavenlineGodot/scripts/world_transform_view.gd'
      - 'HavenlineGodot/data/world_transform_recipes.json'
      - 'HavenlineGodot/assets/world_transform_v1/**'
      - 'HavenlineGodot/tests/test_task10_*.gd'
      - 'Docs/Production/T10/**'
      - 'tools/havenline/task10/**'
      - '.github/workflows/havenline-task10-*.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: havenline-task10-world-transformation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair-sufficiency:
    name: C0R repair sufficiency pre-build gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Challenge proposed repair before building
        run: |
          set -euo pipefail
          mkdir -p task10-c0r
          python3 tools/havenline/production/repair_sufficiency_critic.py \
            --c0 Docs/Production/T10/C0_ROOT_CAUSE.json \
            --plan Docs/Production/T10/REPAIR_PLAN.json \
            --output task10-c0r/report.json
          repair_base=$(python3 -c "import json; print(json.load(open('Docs/Production/T10/REPAIR_PLAN.json'))['repair_base'])")
          INTEGRATION_BRANCH=codex/havenline-sequential-task-01
          git fetch --no-tags origin "$INTEGRATION_BRANCH"
          INTEGRATION_HEAD=$(git rev-parse "origin/$INTEGRATION_BRANCH")
          export INTEGRATION_BRANCH INTEGRATION_HEAD
          python3 tools/havenline/production/builder_repair_gate.py \
            --c0 Docs/Production/T10/C0_ROOT_CAUSE.json \
            --plan Docs/Production/T10/REPAIR_PLAN.json \
            --base "$repair_base" \
            --head "$GITHUB_SHA" \
            --output task10-c0r/builder-gate.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: havenline-task10-C0R-${{ github.sha }}
          path: task10-c0r
          if-no-files-found: warn
          retention-days: 30

  first-builder-milestone:
    needs: repair-sufficiency
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prepare pinned Godot
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/engine" task10-evidence/tests
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o "$RUNNER_TEMP/engine/engine.zip"
          (cd "$RUNNER_TEMP/engine"; echo '9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65  engine.zip' | sha512sum -c -; unzip -q engine.zip; chmod +x Godot_v4.7.2-stable_linux.x86_64)
          echo "$RUNNER_TEMP/engine" >> "$GITHUB_PATH"
          python3 - <<'PYCODE'
          import json,os
          from pathlib import Path
          fields=['ImageOS','ImageVersion','RUNNER_OS','RUNNER_ARCH']
          record={k:os.environ.get(k,'') for k in fields}
          assert all(record.values()),record
          record.update(candidate_commit=os.environ['GITHUB_SHA'],godot='4.7.2.stable.official.ed1daf0bf')
          Path('task10-evidence/runtime-provenance.json').write_text(json.dumps(record,indent=2))
          PYCODE

      - name: Verify activation or legal preactivation scope and source contract
        env:
          CANDIDATE: ${{ github.sha }}
        run: |
          set -euo pipefail
          integration=$(git rev-parse origin/codex/havenline-sequential-task-01)
          python3 tools/havenline/task10/prepare_activation.py | tee task10-evidence/isolated-governance.json
          python3 - <<'PY' > /tmp/t10-candidate-mode.env
          import json
          r=json.load(open('Docs/Production/WORKSTREAM_REGISTRY.json'))
          row=next((x for x in r.get('workstreams',[]) if x.get('task_id')=='T10'),None)
          if row is None or row.get('status') in ('LOCKED','PREPARED'):
              print('T10_CANDIDATE_MODE=preactivation')
              print('T10_REGISTERED_BASE=')
          elif row.get('status') == 'APPROVED':
              raise SystemExit('T10 is already APPROVED and may not produce another candidate')
          else:
              base=row.get('base_commit')
              if not base:
                  raise SystemExit('registered T10 candidate has no base_commit')
              print('T10_CANDIDATE_MODE=registered')
              print('T10_REGISTERED_BASE='+base)
          PY
          cat /tmp/t10-candidate-mode.env >> "$GITHUB_ENV"
          cat /tmp/t10-candidate-mode.env

          if [ "$(grep '^T10_CANDIDATE_MODE=' /tmp/t10-candidate-mode.env | cut -d= -f2)" = "registered" ]; then
            base=$(grep '^T10_REGISTERED_BASE=' /tmp/t10-candidate-mode.env | cut -d= -f2-)
            if [ "$CANDIDATE" = "$integration" ]; then
              python3 - <<'PYCODE'
          import json
          r=json.load(open('Docs/Production/WORKSTREAM_REGISTRY.json'))
          assert next(x['status'] for x in r['workstreams'] if x['task_id']=='T10') in ['INTEGRATION_READY','INTEGRATING','UNDER_REVIEW','FIX_REQUIRED']
          PYCODE
              python3 tools/havenline/production/validate_integration_scope.py --base "$CANDIDATE^2" --head "$CANDIDATE" --output task10-evidence/candidate-scope.json
              python3 tools/havenline/production/validate_integration_scope.py --base c1768dbba7bacbbc5d0174e6b9b661b6dbdbbc11 --head "$CANDIDATE" --output task10-evidence/recovery-scope.json
            else
              python3 tools/havenline/production/workstream.py validate-candidate T10 --base "$base" --head "$CANDIDATE" --integration-head "$integration" | tee task10-evidence/candidate-scope.json
            fi
          else
            python3 tools/havenline/task10/prepare_reconciliation.py \
              --integration-base "$integration" \
              --isolated-candidate "$CANDIDATE" \
              --output task10-evidence/candidate-scope.json
            python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('task10-evidence/candidate-scope.json').read_text())
          assert report['passed'] is True, report
          assert report['path_reconciliation_clean'] is True, report
          assert not report['unauthorized_isolated_paths'], report
          assert report['integration_allowed'] is False, report
          assert report['task_approved'] is False, report
          # Once all dependencies are closed, T10 must be formally activated and
          # registered rather than continuing indefinitely in preactivation mode.
          assert report['dependencies_fully_approved'] is False, 'dependency closure requires T10 activation/registration'
          PY
          fi

          python3 tools/havenline/task10/validate_world_transform.py --candidate "$CANDIDATE" --output task10-evidence/source-contract.json
          python3 tools/havenline/production/validate_migration.py > task10-evidence/governance.json
          python3 -m unittest discover -s tools/havenline/production/tests -p 'test_*.py' > task10-evidence/tests/production-tools.log 2>&1
          python3 -m unittest discover -s tools/havenline/task10/tests -p 'test_*.py' > task10-evidence/tests/task10-tooling.log 2>&1

      - name: Import and run impacted regression
        run: |
          set -euo pipefail
          python3 -m pip install numpy==2.3.5
          python3 tools/havenline/bake_outpost_audio.py > task10-evidence/tests/audio-fixture.json
          timeout 240 Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path HavenlineGodot --import --quit > task10-evidence/tests/import.log 2>&1
          timeout 120 Godot_v4.7.2-stable_linux.x86_64 --headless --path HavenlineGodot --script res://tools/bake_crew_motion.gd > task10-evidence/tests/motion-fixture.log 2>&1
          python3 tools/havenline/task10/validate_progression.py --candidate "$GITHUB_SHA" --output task10-evidence/progression.json
          python3 tools/havenline/production/save_state_matrix.py --candidate "$GITHUB_SHA" --task T10 --adapter "python3 tools/havenline/task10/save_matrix_adapter.py" --out task10-evidence/save-matrix > task10-evidence/save-matrix-summary.json

          integration=$(git rev-parse origin/codex/havenline-sequential-task-01)
          if [ "$GITHUB_SHA" = "$integration" ]; then integration=$(git rev-parse "$GITHUB_SHA^2"); fi
          python3 tools/havenline/production/regression_runner.py --base "$integration" --head "$GITHUB_SHA" --godot "$(command -v Godot_v4.7.2-stable_linux.x86_64)" --out task10-evidence/impact-regression.json

          suites=(
            test_motion_and_performance
            test_task10_world_transform
            test_task10_integration
          )
          # The isolated/preactivation branch deliberately predates T09 runtime.
          # Once T10 is formally activated on the exact post-T09 integration base,
          # registered mode must include the real T09 suites in this regression.
          if [ "$T10_CANDIDATE_MODE" = "registered" ]; then
            suites+=(test_task09_harvesting test_task09_integration)
          fi
          printf '%s\n' "${suites[@]}" > task10-evidence/tests/required-suites.txt

          for suite in "${suites[@]}"; do
            test -s "HavenlineGodot/tests/$suite.gd"
            timeout 300 Godot_v4.7.2-stable_linux.x86_64 --headless --audio-driver Dummy --path HavenlineGodot --script "res://tests/$suite.gd" > "task10-evidence/tests/$suite.log" 2>&1
          done
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:|ObjectDB instances were leaked' task10-evidence/tests/*.log; then exit 1; fi
          python3 - <<'PY'
          from pathlib import Path
          import json,os
          rows=[]
          required=Path('task10-evidence/tests/required-suites.txt').read_text().splitlines()
          for suite in required:
              path=Path('task10-evidence/tests')/(suite+'.log')
              reports=[json.loads(line) for line in path.read_text().splitlines() if line.startswith('{')]
              assert reports,path
              report=reports[-1]
              assert report.get('passed') is True and not report.get('failures'),(path,report.get('failures'))
              checks=report.get('checks',[])
              rows.append({'suite':suite,'checks':len(checks) if isinstance(checks,list) else int(checks),'passed':True})
          expected=3 if os.environ['T10_CANDIDATE_MODE']=='preactivation' else 5
          assert len(rows)==expected,(len(rows),expected,required)
          output={'task':'T10-first-builder-milestone','source':os.environ['GITHUB_SHA'],'candidate_mode':os.environ['T10_CANDIDATE_MODE'],'suite_count':len(rows),'total_checks':sum(row['checks'] for row in rows),'suites':rows,'all_passed':True,'task_approved':False}
          Path('task10-evidence/tests.json').write_text(json.dumps(output,indent=2)); print(json.dumps(output))
          PY

      - name: Preserve regression logs on success or failure
        if: always()
        run: |
          mkdir -p task10-evidence
          if [ -d Docs/Production/Evidence/Regression/logs ]; then
            cp -a Docs/Production/Evidence/Regression/logs task10-evidence/impact-logs
          fi

      - name: Assert critic contract is unchanged
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee task10-evidence/critic-contract.json
          import json
          from pathlib import Path
          matrix=json.loads(Path('Docs/Production/CRITIC_MATRIX.json').read_text())
          required=['C1','C2','C3','C4','C6','C7']
          assert matrix['task_applicability']['T10']==required
          print(json.dumps({'task':'T10','required_critics':required,'minimum_operator':'>','threshold':9.0,'target':10.0,'task_approved':False},indent=2))
          PY

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: havenline-task10-first-milestone-${{ github.sha }}
          path: task10-evidence
          if-no-files-found: error
          retention-days: 14

  c0-diagnose:
    name: C0 diagnosis after failed T10 gates
    needs: [first-builder-milestone]
    if: ${{ always() && (needs.first-builder-milestone.result == 'failure') }}
    uses: ./.github/workflows/havenline-c0-root-cause.yml
    with:
      task_id: T10
      failed_run_id: ${{ github.run_id }}
      failed_candidate: ${{ github.sha }}
      task_branch: havenline/T10-world-transformation
