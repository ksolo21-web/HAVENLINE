name: Havenline T01 review runtime preparation
on:
  push:
    branches: ['codex/havenline-sequential-task-01']
    paths: ['.github/workflows/havenline-task01-review-runtime.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  critic-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - name: Restore verified model cache
        uses: actions/cache@v4
        id: cache
        with:
          path: ~/.cache/havenline-t01-vision
          key: havenline-qwen3vl8b-f982a075-b10809-v1
      - name: Download with bounded parallel connections and verify publisher bytes
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y aria2
          mkdir -p "$HOME/.cache/havenline-t01-vision"
          cd "$HOME/.cache/havenline-t01-vision"
          get() { 
            file="$1"; sha="$2"; url="$3";
            if test -f "$file" && echo "$sha  $file" | sha256sum -c - >/dev/null 2>&1; then return; fi
            aria2c --console-log-level=warn --summary-interval=20 -x 12 -s 12 -k 4M --max-tries=3 --retry-wait=3 --connect-timeout=20 --timeout=60 --file-allocation=none --allow-overwrite=true --auto-file-renaming=false -o "$file" "$url"
            echo "$sha  $file" | sha256sum -c -
          }
          get Qwen3VL-8B-Instruct-Q4_K_M.gguf 67d1659bfe71b89d50b45a4ad1a9e5b997e5bb16ce5da66a6a6167abd569e9e2 'https://huggingface.co/Qwen/Qwen3-VL-8B-Instruct-GGUF/resolve/f982a07559d4a2f6c8744d840bf6fccab30eea96/Qwen3VL-8B-Instruct-Q4_K_M.gguf?download=true' &
          p1=$!
          get mmproj-Qwen3VL-8B-Instruct-F16.gguf ca524100ebf825c9a870db1c580d03879e0da0ab2541697e2458e64891cf9d38 'https://huggingface.co/Qwen/Qwen3-VL-8B-Instruct-GGUF/resolve/f982a07559d4a2f6c8744d840bf6fccab30eea96/mmproj-Qwen3VL-8B-Instruct-F16.gguf?download=true' &
          p2=$!
          get runtime.tar.gz 5e34434ddc6d03cd1584f403201aff0d4bd1a5793a72ff7e286532dfd1e4b941 'https://github.com/ggml-org/llama.cpp/releases/download/b10809/llama-b10809-bin-ubuntu-x64.tar.gz'
          wait "$p1"; wait "$p2"
          mkdir -p runtime; tar -xzf runtime.tar.gz -C runtime
          find runtime -name llama-server -exec chmod +x {} \;
          sha256sum *.gguf runtime.tar.gz > verified-sha256.txt
      - uses: actions/cache/save@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/havenline-t01-vision
          key: havenline-qwen3vl8b-f982a075-b10809-v1
  local-render-dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Recover system packages for local software Vulkan inspection
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          mkdir -p render-dependencies
          cd render-dependencies
          apt-get download mesa-vulkan-drivers libllvm20 libdrm2 libdrm-amdgpu1
          sha256sum *.deb > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: havenline-T01-software-render-dependencies
          path: render-dependencies/
          retention-days: 2
          if-no-files-found: error
# No user/model secrets, paid inference, APKs, scores, or task advancement.
