name: Havenline Task 2 map-spanning river implementation
on:
  push:
    branches: ['codex/havenline-sequential-task-01']
    paths: ['.github/workflows/havenline-task02-river-implementation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mechanical:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned Godot 4.7.2
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb mesa-vulkan-drivers
          mkdir -p "$RUNNER_TEMP/engine" river-evidence/tests
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o "$RUNNER_TEMP/engine/engine.zip"
          (cd "$RUNNER_TEMP/engine"; echo '9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65  engine.zip' | sha512sum -c -; unzip -q engine.zip; chmod +x Godot_v4.7.2-stable_linux.x86_64)
          echo "$RUNNER_TEMP/engine" >> "$GITHUB_PATH"
      - name: Import project and run river plus core regressions
        run: |
          set -euo pipefail
          python3 tools/havenline/bake_outpost_audio.py > river-evidence/tests/audio-fixture.json
          timeout 180 Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path HavenlineGodot --import --quit > river-evidence/tests/import.log 2>&1
          timeout 120 Godot_v4.7.2-stable_linux.x86_64 --headless --path HavenlineGodot --script res://tools/bake_crew_motion.gd > river-evidence/tests/motion-fixture.log 2>&1
          for suite in test_simulation test_crew_and_persistence test_population test_outpost test_outpost_runtime test_adaptive_devices test_reference_forest test_reference_forest_acceptance test_task02_river; do
            timeout 140 Godot_v4.7.2-stable_linux.x86_64 --headless --audio-driver Dummy --path HavenlineGodot --script "res://tests/$suite.gd" > "river-evidence/tests/$suite.log" 2>&1
          done
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:|ObjectDB instances were leaked' river-evidence/tests/*.log; then exit 1; fi
          python3 - <<'PY'
          from pathlib import Path
          import json
          rows=[]
          for p in sorted(Path('river-evidence/tests').glob('test_*.log')):
              found=[json.loads(x) for x in p.read_text().splitlines() if x.startswith('{')]
              assert found,p
              row=found[-1];assert row.get('passed') is True and not row.get('failures'),(p,row)
              rows.append({'suite':p.stem,'checks':len(row.get('checks',[])) if isinstance(row.get('checks'),list) else row.get('checks'),'passed':True})
          Path('river-evidence/mechanical.json').write_text(json.dumps({'source':'${{ github.sha }}','suites':rows,'all_passed':True,'task_approved':False,'physical_4k60_verified':False},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: havenline-task02-river-mechanical-${{ github.run_id }}
          path: river-evidence/
          retention-days: 30
          if-no-files-found: error
# Retry 3 restores the established audio/motion prerequisites omitted by retry 2.
# Earlier failures remain preserved. No critic score or task approval here.
