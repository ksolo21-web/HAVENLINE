name: Havenline T10 rendered-clearance full-domain proof

on:
  push:
    branches: ['havenline/governance-T10-rendered-clearance-full-domain-recovery']

permissions:
  contents: read
  actions: read

concurrency:
  group: havenline-task10-rendered-clearance-probe
  cancel-in-progress: false

jobs:
  compare-rendered-clearance:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      FAILED_SOURCE: 30a7e0cc40d44aea2b21229bc39f312da13865e0
      FAILED_VIEW_SHA256: 6d737567f224be8d221b18e4d0ace6c6ef10de0102d27901c9f9e8d37e6659ac
      INTEGRATION_BRANCH: codex/havenline-sequential-task-01
      AUTHORIZATION_PATH: Docs/Production/ChangeRequests/T10-rendered-clearance-full-domain-one-shot.json
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          lfs: false

      - name: Enforce exact canonical one-shot admission
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/havenline/governance-T10-rendered-clearance-full-domain-recovery
          test "$GITHUB_RUN_ATTEMPT" = 1
          git fetch --no-tags origin "$INTEGRATION_BRANCH"
          python3 - <<'PY'
          import hashlib,json,os,subprocess,urllib.parse,urllib.request
          from pathlib import Path
          retained=Path('rendered-domain/admission')
          retained.mkdir(parents=True,exist_ok=True)
          branch=os.environ['INTEGRATION_BRANCH']
          path=os.environ['AUTHORIZATION_PATH']
          raw=subprocess.check_output(['git','show',f'origin/{branch}:{path}'])
          (retained/'canonical-authorization.json').write_bytes(raw)
          auth=json.loads(raw)
          workflow_path='.github/workflows/havenline-rendered-clearance-t10-full-domain-recovery.yml'
          actual={
            'commit':os.environ['GITHUB_SHA'],
            'tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),
            'workflow_path':workflow_path,
            'workflow_sha256':hashlib.sha256(Path(workflow_path).read_bytes()).hexdigest(),
            'ref':os.environ['GITHUB_REF'],
            'event':os.environ['GITHUB_EVENT_NAME'],
            'failed_source':os.environ['FAILED_SOURCE'],
            'failed_view_sha256':os.environ['FAILED_VIEW_SHA256'],
          }
          assert auth['task_id']=='T10'
          assert auth['authorization_kind']=='T10_RENDERED_CLEARANCE_FULL_DOMAIN_ONE_SHOT'
          assert auth['disposition']=='AUTHORIZED_FOR_ONE_DIAGNOSTIC_EXECUTION'
          assert auth['diagnostic_execution_authorized'] is True
          assert auth['max_runs']==1
          assert auth['v2_result']=={
            'run_id':35478189624,'artifact_id':10594858274,
            'zip_sha256':'234626b1bae1d89cdb94ca6e1c069cc95612cbb80725c08948026e6f25fed8ce',
          }
          assert auth['domain_cases']==650 and auth['task_approved'] is False
          assert auth['probe']==actual,(auth.get('probe'),actual)

          run_branch=urllib.parse.quote('havenline/governance-T10-rendered-clearance-full-domain-recovery',safe='')
          head_sha=urllib.parse.quote(os.environ['GITHUB_SHA'],safe='')
          url=(f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}"
               f"/actions/runs?branch={run_branch}&event=push&head_sha={head_sha}&per_page=100")
          request=urllib.request.Request(url,headers={
            'Accept':'application/vnd.github+json',
            'Authorization':f"Bearer {os.environ['GH_TOKEN']}",
            'X-GitHub-Api-Version':'2022-11-28',
            'User-Agent':'havenline-t10-rendered-clearance-admission',
          })
          with urllib.request.urlopen(request,timeout=30) as response:
            api_bytes=response.read()
          (retained/'workflow-runs-api.json').write_bytes(api_bytes)
          payload=json.loads(api_bytes)
          assert isinstance(payload.get('total_count'),int),payload
          runs=payload.get('workflow_runs')
          assert isinstance(runs,list),payload
          assert payload['total_count']<=100,payload['total_count']
          assert len(runs)==payload['total_count'],(len(runs),payload['total_count'])
          matching=[run for run in runs
                    if run.get('path')==workflow_path
                    and run.get('head_sha')==os.environ['GITHUB_SHA']
                    and run.get('head_branch')=='havenline/governance-T10-rendered-clearance-full-domain-recovery'
                    and run.get('event')=='push']
          current=[run for run in matching if str(run.get('id'))==os.environ['GITHUB_RUN_ID']]
          prior=[run.get('id') for run in matching if str(run.get('id'))!=os.environ['GITHUB_RUN_ID']]
          assert len(current)==1,current
          assert current[0].get('run_attempt')==1,current[0]
          assert len(matching)==1 and not prior,f'one-shot diagnostic already attempted: {prior}'
          summary={'admitted':True,'commit':actual['commit'],'tree':actual['tree'],
                   'authorization_sha256':hashlib.sha256(raw).hexdigest(),
                   'workflow_runs_api_sha256':hashlib.sha256(api_bytes).hexdigest(),
                   'matching_runs':1,'prior_attempts':0,'task_approved':False}
          (retained/'admission-summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          print(json.dumps(summary,sort_keys=True))
          PY

      - name: Check proof tooling and pinned clean parser
        run: |
          set -euo pipefail
          python3 -m pip install pillow==12.3.0 numpy==2.3.5
          python3 -m unittest tools.havenline.task10.tests.test_verify_rendered_clearance_domain
          sudo apt-get update -qq
          sudo apt-get install -y xvfb mesa-vulkan-drivers
          mkdir -p "$RUNNER_TEMP/engine"
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o "$RUNNER_TEMP/engine/engine.zip"
          (cd "$RUNNER_TEMP/engine"; echo '9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65  engine.zip' | sha512sum -c -; unzip -q engine.zip; chmod +x Godot_v4.7.2-stable_linux.x86_64)
          echo "$RUNNER_TEMP/engine" >> "$GITHUB_PATH"
          test ! -e HavenlineGodot/.godot
          timeout 30 "$RUNNER_TEMP/engine/Godot_v4.7.2-stable_linux.x86_64" --headless --path HavenlineGodot --script res://tests/capture_task10_world_transform.gd --check-only > rendered-domain/check-only.log 2>&1
          if grep -E 'SCRIPT ERROR|Parse Error' rendered-domain/check-only.log; then exit 1; fi

      - name: Collect complete 650-case rendered domain
        run: |
          set -euo pipefail
          export VK_ICD_FILENAMES=$(find /usr/share/vulkan/icd.d -name '*lvp*json' | head -1)
          engine=Godot_v4.7.2-stable_linux.x86_64
          timeout 240 "$engine" --headless --editor --path HavenlineGodot --import --quit > rendered-domain/import.log 2>&1
          if grep -E 'SCRIPT ERROR|Parse Error|ObjectDB instances were leaked' rendered-domain/import.log; then exit 1; fi
          python3 tools/havenline/task10/run_rendered_clearance_domain.py \
            --repo "$GITHUB_WORKSPACE" --output "$GITHUB_WORKSPACE/rendered-domain/cases" \
            --source "$GITHUB_SHA" --engine "$engine" \
            --workflow .github/workflows/havenline-rendered-clearance-t10-full-domain-recovery.yml

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: havenline-task10-rendered-domain-${{ github.sha }}
          path: rendered-domain
          if-no-files-found: error
          retention-days: 30
