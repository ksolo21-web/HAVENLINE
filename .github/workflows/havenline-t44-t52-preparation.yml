name: Havenline T44-T52 Connected Region Preparation

on:
  pull_request:
    paths:
      - 'Docs/Production/T44/**'
      - 'Docs/Production/T45/**'
      - 'Docs/Production/T46/**'
      - 'Docs/Production/T47/**'
      - 'Docs/Production/T48/**'
      - 'Docs/Production/T49/**'
      - 'Docs/Production/T50/**'
      - 'Docs/Production/T51/**'
      - 'Docs/Production/T52/**'
      - 'Docs/Production/T44_T52_PARALLEL_PREP_MANIFEST.json'
      - 'tools/havenline/t44_t52/**'
      - '.github/workflows/havenline-t44-t52-preparation.yml'
  workflow_dispatch:

jobs:
  validate-region-preparation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile activation preflight
        run: python -m py_compile tools/havenline/t44_t52/prepare_activation.py
      - name: Validate T44-T52 preparation
        run: python tools/havenline/t44_t52/prepare_activation.py --all
