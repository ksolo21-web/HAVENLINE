name: Havenline final stale ref cleanup

on:
  push:
    branches:
      - codex/havenline-sequential-task-01
    paths:
      - .github/workflows/havenline-final-stale-ref-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Revalidate and delete fully merged T03 hardening ref
        run: |
          set -euo pipefail
          BRANCH='havenline/t03-gate-hardening-20260911'
          SHA='a3038269631a7116af16d99a29ee46198a05c2a8'
          git fetch --no-tags origin codex/havenline-sequential-task-01
          current=$(git ls-remote --heads origin "$BRANCH" | cut -f1)
          if [ -z "$current" ]; then
            echo "already absent"
            exit 0
          fi
          test "$current" = "$SHA"
          git merge-base --is-ancestor "$SHA" origin/codex/havenline-sequential-task-01
          git push origin --delete "$BRANCH"
          ! git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1
