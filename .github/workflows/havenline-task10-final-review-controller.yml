name: Havenline T10 final six-critic controller
on:
  push:
    branches: ['havenline/review-T10-final-closeout-controller']
    paths:
      - '.github/workflows/havenline-task10-final-review-controller.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: havenline-t10-focused-retry-${{ github.sha }}
  cancel-in-progress: true

env:
  CANDIDATE: 'eba0107def258824549fb10d81785290d0c81d97'
  SOURCE_RUN: '35600328627'
  BASE_REVIEW_RUN: '35600362867'

jobs:
  base-ready:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Wait for original affected-critic run and preserve unaffected successes
        run: |
          set -euo pipefail
          for i in $(seq 1 240); do
            status=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$BASE_REVIEW_RUN" --jq '.status')
            [ "$status" = completed ] && break
            sleep 15
          done
          test "$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$BASE_REVIEW_RUN" --jq '.status')" = completed
          gh api --paginate "/repos/$GITHUB_REPOSITORY/actions/runs/$BASE_REVIEW_RUN/jobs?per_page=100" > /tmp/jobs-pages.json
          python3 - <<'PY'
          import json,os
          pages=json.load(open('/tmp/jobs-pages.json'))
          jobs=pages.get('jobs',[]) if isinstance(pages,dict) else [j for p in pages for j in p.get('jobs',[])]
          by={j['name']:j for j in jobs}
          required=[
            'visual-slice (C1, 1)','visual-slice (C1, 2)','visual-slice (C1, 3)',
            'visual-slice (C2, 1)','visual-slice (C2, 2)',
            'c3','c4','preserve-c6-c7',
          ]
          missing=[n for n in required if n not in by]
          assert not missing,missing
          bad={n:by[n]['conclusion'] for n in required if by[n]['conclusion']!='success'}
          assert not bad,bad
          print(json.dumps({'preserved_successes':required},indent=2))
          PY

  normalize-c1-0:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: t10-final-visual-C1-0-${{ env.CANDIDATE }}
          path: prior-c1-0
          github-token: ${{ github.token }}
          run-id: ${{ env.BASE_REVIEW_RUN }}
      - name: Normalize explicit semantic empty-defect marker without rescoring
        run: |
          set -euo pipefail
          mkdir -p normalized-c1-0
          python3 - <<'PY'
          import json,pathlib,os
          rows=list(pathlib.Path('prior-c1-0').rglob('slice-result.json'))
          assert len(rows)==1,rows
          src=rows[0];r=json.load(open(src))
          assert r['candidate']==os.environ['CANDIDATE'] and r['critic_id']=='C1' and r['slice']==0,r
          assert r['review']['coverage_complete'] is True
          assert r['review']['confidence'] in ('medium','high')
          assert all(float(v)>9.0 for v in r['review']['scores'].values()),r['review']['scores']
          markers={'none','none identified','none identified.','no defects','no defects.','no defect','no defect.'}
          defects=r['review'].get('defects',[])
          assert defects and all(isinstance(x,str) and x.strip().lower() in markers for x in defects),defects
          r['review']['defects']=[]
          r['passed']=True
          r['errors']=[]
          r['normalization']={
            'type':'semantic_empty_defect_marker',
            'original_defects':defects,
            'scores_unchanged':True,
            'review_not_rerun':True,
          }
          out=pathlib.Path('normalized-c1-0/slice-result.json')
          out.write_text(json.dumps(r,indent=2)+'\n')
          print(json.dumps(r,indent=2))
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: t10-normalized-C1-0-${{ env.CANDIDATE }}
          path: normalized-c1-0/
          if-no-files-found: error
          retention-days: 90

  retry-c2:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        slice: [0, 3]
    env:
      HAVENLINE_INDEPENDENT_REVIEW_JOB: '1'
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: havenline-task10-critic-input-${{ env.CANDIDATE }}
          path: critic-input
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN }}
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ~/.cache/havenline-t01-qwen35
          key: havenline-t01-qwen35-9b-q5-20260908-v1
      - name: Bind exact candidate and clarified C2 reviewer
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/t10-final-candidate" "$CANDIDATE"
          if [ ! -s "$HOME/.cache/havenline-t01-qwen35/manifest.json" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y aria2
          fi
          python3 tools/havenline/production/prepare_specialist_runtime.py > reviewer-runtime.json
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python3 -m pip install --disable-pip-version-check --no-input pillow==12.3.0
          python3 tools/havenline/production/specialist_evidence_manifest.py validate critic-input/C2-manifest.json
      - name: Retry only disputed C2 slice
        run: |
          set -euo pipefail
          python3 -u tools/havenline/task10/review_final_visual_slice.py             --critic C2 --slice "${{ matrix.slice }}"             --candidate "$CANDIDATE" --repo "$RUNNER_TEMP/t10-final-candidate"             --evidence critic-input --out "retry/C2-${{ matrix.slice }}"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: t10-retry-visual-C2-${{ matrix.slice }}-${{ env.CANDIDATE }}
          path: retry/
          if-no-files-found: error
          retention-days: 90

  aggregate-c1-c2:
    needs: [base-ready, normalize-c1-0, retry-c2]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: havenline-task10-critic-input-${{ env.CANDIDATE }}
          path: critic-input
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: t10-normalized-C1-0-${{ env.CANDIDATE }}
          path: slices/C1/0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: t10-final-visual-C1-1-${{ env.CANDIDATE }}
          path: slices/C1/1
          github-token: ${{ github.token }}
          run-id: ${{ env.BASE_REVIEW_RUN }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: t10-final-visual-C1-2-${{ env.CANDIDATE }}
          path: slices/C1/2
          github-token: ${{ github.token }}
          run-id: ${{ env.BASE_REVIEW_RUN }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: t10-final-visual-C1-3-${{ env.CANDIDATE }}
          path: slices/C1/3
          github-token: ${{ github.token }}
          run-id: ${{ env.BASE_REVIEW_RUN }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: t10-retry-visual-C2-0-${{ env.CANDIDATE }}
          path: slices/C2/0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: t10-final-visual-C2-1-${{ env.CANDIDATE }}
          path: slices/C2/1
          github-token: ${{ github.token }}
          run-id: ${{ env.BASE_REVIEW_RUN }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: t10-final-visual-C2-2-${{ env.CANDIDATE }}
          path: slices/C2/2
          github-token: ${{ github.token }}
          run-id: ${{ env.BASE_REVIEW_RUN }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: t10-retry-visual-C2-3-${{ env.CANDIDATE }}
          path: slices/C2/3
      - name: Aggregate corrected visual critics
        run: |
          set -euo pipefail
          for cid in C1 C2; do
            python3 tools/havenline/task10/aggregate_final_visual_slices.py               --critic "$cid" --candidate "$CANDIDATE"               --manifest "critic-input/$cid-manifest.json"               --inputs "slices/$cid" --out "visual-final/$cid"               --run-id "$GITHUB_RUN_ID"
            python3 tools/havenline/task10/review_visual.py               --critic "$cid" --candidate "$CANDIDATE"               --manifest "critic-input/$cid-manifest.json"               --record "visual-final/$cid/critic-record.json"               --output "visual-final/$cid/validated.json"
          done
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: havenline-task10-C1-final-${{ env.CANDIDATE }}
          path: visual-final/C1/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: havenline-task10-C2-final-${{ env.CANDIDATE }}
          path: visual-final/C2/
          if-no-files-found: error
          retention-days: 90

  six-critic-aggregate:
    needs: [base-ready, aggregate-c1-c2]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: havenline-task10-C1-final-${{ env.CANDIDATE }}
          path: normalized/C1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: havenline-task10-C2-final-${{ env.CANDIDATE }}
          path: normalized/C2
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: havenline-task10-C3-final-${{ env.CANDIDATE }}
          path: normalized/C3
          github-token: ${{ github.token }}
          run-id: ${{ env.BASE_REVIEW_RUN }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: havenline-task10-C4-final-${{ env.CANDIDATE }}
          path: normalized/C4
          github-token: ${{ github.token }}
          run-id: ${{ env.BASE_REVIEW_RUN }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: havenline-task10-preserved-C6-C7-${{ env.CANDIDATE }}
          path: preserved
          github-token: ${{ github.token }}
          run-id: ${{ env.BASE_REVIEW_RUN }}
      - name: Assemble strict final six-critic record
        run: |
          set -euo pipefail
          mkdir -p normalized/C6 normalized/C7 six-critic
          cp preserved/C6/critic-record.json normalized/C6/critic-record.json
          cp preserved/C6/raw-output.json normalized/C6/raw-output.json
          cp preserved/C7/critic-record.json normalized/C7/critic-record.json
          cp preserved/C7/raw-output.json normalized/C7/raw-output.json
          cp preserved/preservation-proof.json six-critic/preservation-proof.json
          python3 - <<'PY'
          import json,os,pathlib
          ids=['C1','C2','C3','C4','C6','C7'];mins=[];provenance={}
          candidate=os.environ['CANDIDATE']
          for cid in ids:
            rows=list(pathlib.Path('normalized',cid).rglob('critic-record.json'))
            assert len(rows)==1,(cid,rows)
            r=json.load(open(rows[0]))
            assert r.get('candidate_hash')==candidate,(cid,r.get('candidate_hash'))
            assert r.get('passed') is True and r.get('coverage_complete') is True,(cid,r)
            assert r.get('defects')==[],(cid,r.get('defects'))
            scores={k:float(v) for k,v in r.get('scores',{}).items()}
            assert scores and all(v>9.0 for v in scores.values()),(cid,scores)
            mins.extend(scores.values())
            if cid in ('C6','C7'):
              assert r.get('preserved_pass') is True and r.get('fresh_rerun') is False
              provenance[cid]={'mode':'preserved','source_candidate':r['preserved_from_candidate'],'source_run':r['preserved_from_run']}
            else:
              provenance[cid]={'mode':'fresh','candidate':candidate}
          proof=json.load(open('six-critic/preservation-proof.json'))
          assert proof.get('passed') is True and proof.get('candidate')==candidate
          summary={
            'task_id':'T10','candidate_commit':candidate,'required_critics':ids,
            'fresh_critics':['C1','C2','C3','C4'],'preserved_critics':['C6','C7'],
            'critic_provenance':provenance,'minimum_score':min(mins),
            'all_dimensions_strictly_above_9':True,'defects':[],
            'coverage_complete':True,'preservation_proof_passed':True,
            'passed':True,'task_approved':False,
          }
          pathlib.Path('six-critic-summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          pathlib.Path('six-critic/critic-aggregate.json').write_text(json.dumps(summary,indent=2)+'\n')
          print(json.dumps(summary))
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: havenline-task10-six-critic-final-${{ env.CANDIDATE }}
          path: |
            six-critic/
            six-critic-summary.json
            normalized/
          if-no-files-found: error
          retention-days: 90
