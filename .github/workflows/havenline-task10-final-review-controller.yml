name: Havenline T10 final C4 retry and aggregate
on:
  push:
    branches: ['havenline/review-T10-final-closeout-controller']
    paths:
      - '.github/workflows/havenline-task10-final-review-controller.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: havenline-t10-final-c4-${{ github.sha }}
  cancel-in-progress: false

env:
  CANDIDATE: 'eba0107def258824549fb10d81785290d0c81d97'
  SOURCE_RUN: '35600328627'
  BASE_REVIEW_RUN: '35600362867'
  FOCUSED1_RUN: '35602696128'
  FOCUSED2_RUN: '35611013914'

jobs:
  c4-retry:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HAVENLINE_INDEPENDENT_REVIEW_JOB: '1'
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: havenline-task10-critic-input-${{ env.CANDIDATE }}
          path: critic-input
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN }}
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ~/.cache/havenline-t01-qwen35
          key: havenline-t01-qwen35-9b-q5-20260908-v1
      - name: Prepare compact C4 reviewer
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/t10-final-candidate" "$CANDIDATE"
          if [ ! -s "$HOME/.cache/havenline-t01-qwen35/manifest.json" ]; then
            sudo apt-get update -qq; sudo apt-get install -y aria2
          fi
          python3 tools/havenline/production/prepare_specialist_runtime.py > reviewer-runtime.json
          sudo apt-get update -qq; sudo apt-get install -y ffmpeg
          python3 -m pip install --disable-pip-version-check --no-input pillow==12.3.0
          python3 tools/havenline/production/specialist_evidence_manifest.py validate critic-input/C4-manifest.json
      - name: Retry only corrected C4 judgment
        run: |
          set -euo pipefail
          python3 -u tools/havenline/task10/review_focused_closeout.py \
            --focus c4 --candidate "$CANDIDATE" \
            --repo "$RUNNER_TEMP/t10-final-candidate" \
            --evidence critic-input --out focused/c4
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: t10-final-c4-focused-${{ env.CANDIDATE }}
          path: focused/c4/
          if-no-files-found: error
          retention-days: 90

  final-aggregate:
    needs: [c4-retry]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: t10-normalized-C1-0-${{ env.CANDIDATE }}
          path: inputs/C1/0
          github-token: ${{ github.token }}
          run-id: ${{ env.FOCUSED1_RUN }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: t10-final-visual-C1-1-${{ env.CANDIDATE }}
          path: inputs/C1/1
          github-token: ${{ github.token }}
          run-id: ${{ env.BASE_REVIEW_RUN }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: t10-final-visual-C1-2-${{ env.CANDIDATE }}
          path: inputs/C1/2
          github-token: ${{ github.token }}
          run-id: ${{ env.BASE_REVIEW_RUN }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: t10-focused-c1-motion-${{ env.CANDIDATE }}
          path: inputs/C1/3
          github-token: ${{ github.token }}
          run-id: ${{ env.FOCUSED2_RUN }}

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: t10-retry-visual-C2-0-${{ env.CANDIDATE }}
          path: inputs/C2/0
          github-token: ${{ github.token }}
          run-id: ${{ env.FOCUSED1_RUN }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: t10-final-visual-C2-2-${{ env.CANDIDATE }}
          path: inputs/C2/2
          github-token: ${{ github.token }}
          run-id: ${{ env.BASE_REVIEW_RUN }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: t10-focused-c2-static-${{ env.CANDIDATE }}
          path: inputs/C2/static
          github-token: ${{ github.token }}
          run-id: ${{ env.FOCUSED2_RUN }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: t10-focused-c2-motion-${{ env.CANDIDATE }}
          path: inputs/C2/motion
          github-token: ${{ github.token }}
          run-id: ${{ env.FOCUSED2_RUN }}

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: havenline-task10-C3-final-${{ env.CANDIDATE }}
          path: inputs/C3
          github-token: ${{ github.token }}
          run-id: ${{ env.BASE_REVIEW_RUN }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: t10-final-c4-focused-${{ env.CANDIDATE }}
          path: inputs/C4
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: havenline-task10-preserved-C6-C7-${{ env.CANDIDATE }}
          path: preserved
          github-token: ${{ github.token }}
          run-id: ${{ env.BASE_REVIEW_RUN }}

      - name: Assemble exact critic records without rescoring
        run: |
          set -euo pipefail
          mkdir -p normalized/C1 normalized/C2 normalized/C3 normalized/C4 normalized/C6 normalized/C7 six-critic
          python3 - <<'PY'
          import json,os,pathlib,hashlib,shutil
          candidate=os.environ['CANDIDATE']

          def pass_slice(root):
              rows=list(pathlib.Path(root).rglob('slice-result.json'));assert len(rows)==1,(root,rows)
              d=json.load(open(rows[0]));assert d.get('candidate')==candidate and d.get('passed') is True,d
              r=d['review'];assert r.get('coverage_complete') is True and r.get('defects')==[] and all(float(v)>9 for v in r['scores'].values()),r
              return {'scores':{k:float(v) for k,v in r['scores'].items()},'confidence':r['confidence'],'source':str(rows[0])}

          def pass_focus(root,cid):
              rows=list(pathlib.Path(root).rglob('critic-record.json'));assert len(rows)==1,(root,rows)
              r=json.load(open(rows[0]));assert r.get('candidate_hash')==candidate and r.get('critic_id')==cid and r.get('passed') is True,r
              assert r.get('coverage_complete') is True and r.get('defects')==[] and all(float(v)>9 for v in r['scores'].values()),r
              return r,rows[0]

          c1=[pass_slice('inputs/C1/0'),pass_slice('inputs/C1/1'),pass_slice('inputs/C1/2')]
          r,p=pass_focus('inputs/C1/3','C1');c1.append({'scores':{k:float(v) for k,v in r['scores'].items()},'confidence':r['confidence'],'source':str(p)})
          c2=[pass_slice('inputs/C2/0'),pass_slice('inputs/C2/2')]
          for root in ('inputs/C2/static','inputs/C2/motion'):
              r,p=pass_focus(root,'C2');c2.append({'scores':{k:float(v) for k,v in r['scores'].items()},'confidence':r['confidence'],'source':str(p)})

          def emit(cid,rows):
              dims=set(rows[0]['scores']);assert all(set(x['scores'])==dims for x in rows)
              scores={d:min(x['scores'][d] for x in rows) for d in dims};assert all(v>9 for v in scores.values()),scores
              raw={'task_id':'T10','critic_id':cid,'candidate':candidate,'aggregation':'minimum across exact independent current-candidate judgments; no rescoring','source_rows':rows}
              rawp=pathlib.Path('normalized',cid,'raw-output.json');rawp.write_text(json.dumps(raw,indent=2)+'\n')
              rec={'task_id':'T10','critic_id':cid,'candidate_hash':candidate,'provider':'exact independent slice aggregate','model':'mixed exact independent T10 reviewer outputs','request_or_run_id':os.environ.get('GITHUB_RUN_ID','local')+'/final-aggregate','input_manifest_hash':'slice-bound-see-raw-output','raw_output_path':str(rawp),'raw_output_hash':hashlib.sha256(rawp.read_bytes()).hexdigest(),'scores':scores,'defects':[],'coverage_complete':True,'confidence':'high','independent_runtime':True,'review_mode':'fresh','passed':True}
              pathlib.Path('normalized',cid,'critic-record.json').write_text(json.dumps(rec,indent=2)+'\n')
          emit('C1',c1);emit('C2',c2)

          c3=list(pathlib.Path('inputs/C3').rglob('critic-record.json'));assert len(c3)==1,c3
          r=json.load(open(c3[0]));assert r.get('candidate_hash')==candidate and r.get('passed') is True and r.get('defects')==[] and r.get('coverage_complete') is True and all(float(v)>9 for v in r['scores'].values())
          r['review_mode']='fresh';pathlib.Path('normalized/C3/critic-record.json').write_text(json.dumps(r,indent=2)+'\n')
          raw=list(pathlib.Path('inputs/C3').rglob('raw-output.json'));assert len(raw)==1,raw;shutil.copy2(raw[0],'normalized/C3/raw-output.json')

          r,p=pass_focus('inputs/C4','C4');r['review_mode']='fresh';pathlib.Path('normalized/C4/critic-record.json').write_text(json.dumps(r,indent=2)+'\n')
          raw=p.parent/'raw-output.json';assert raw.is_file();shutil.copy2(raw,'normalized/C4/raw-output.json')

          proof=json.load(open('preserved/preservation-proof.json'));assert proof.get('passed') is True and proof.get('candidate')==candidate
          shutil.copy2('preserved/preservation-proof.json','six-critic/preservation-proof.json')
          for cid in ('C6','C7'):
              r=json.load(open(f'preserved/{cid}/critic-record.json'))
              assert r.get('candidate_hash')==candidate and r.get('passed') is True and r.get('preserved_pass') is True and r.get('fresh_rerun') is False
              assert r.get('defects')==[] and r.get('coverage_complete') is True and all(float(v)>9 for v in r['scores'].values())
              r['review_mode']='preserved';pathlib.Path(f'normalized/{cid}/critic-record.json').write_text(json.dumps(r,indent=2)+'\n')
              shutil.copy2(f'preserved/{cid}/raw-output.json',f'normalized/{cid}/raw-output.json')
          PY

      - name: Produce strict final six-critic summary
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib
          candidate=os.environ['CANDIDATE'];ids=['C1','C2','C3','C4','C6','C7'];mins=[];prov={}
          for cid in ids:
              r=json.load(open(f'normalized/{cid}/critic-record.json'))
              assert r.get('candidate_hash')==candidate and r.get('passed') is True and r.get('coverage_complete') is True and r.get('defects')==[],(cid,r)
              scores={k:float(v) for k,v in r['scores'].items()};assert scores and all(v>9 for v in scores.values()),(cid,scores);mins.extend(scores.values())
              prov[cid]={'mode':'preserved','source_candidate':r.get('preserved_from_candidate'),'source_run':r.get('preserved_from_run')} if cid in ('C6','C7') else {'mode':'fresh','candidate':candidate}
          summary={'task_id':'T10','candidate_commit':candidate,'required_critics':ids,'fresh_critics':['C1','C2','C3','C4'],'preserved_critics':['C6','C7'],'critic_provenance':prov,'minimum_score':min(mins),'all_dimensions_strictly_above_9':True,'defects':[],'coverage_complete':True,'preservation_proof_passed':True,'passed':True,'task_approved':False}
          pathlib.Path('six-critic-summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          pathlib.Path('six-critic/critic-aggregate.json').write_text(json.dumps(summary,indent=2)+'\n')
          print(json.dumps(summary))
          PY

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: havenline-task10-six-critic-final-${{ env.CANDIDATE }}
          path: |
            six-critic/
            six-critic-summary.json
            normalized/
          if-no-files-found: error
          retention-days: 90
