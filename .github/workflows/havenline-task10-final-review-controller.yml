name: Havenline T10 final six-critic controller
on:
  push:
    branches: ['havenline/review-T10-final-closeout-controller']
permissions:
  contents: read
  actions: read
concurrency:
  group: havenline-t10-final-six-critic
  cancel-in-progress: true
jobs:
  evidence-ready:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      artifact_name: ${{ steps.wait.outputs.artifact_name }}
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: '35546330367'
      CANDIDATE: 'b37b3d5e471c5699b97597f508ad8e7b28ce70ee'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: false
      - id: wait
        name: Wait for exact critic-input artifact
        run: |
          set -euo pipefail
          wanted="havenline-task10-critic-input-$CANDIDATE"
          for i in $(seq 1 180); do
            gh api "/repos/ksolo21-web/HAVENLINE/actions/runs/$SOURCE_RUN/artifacts" > artifacts.json
            id=$(python3 - <<'PY'
          import json,os
          d=json.load(open('artifacts.json'))
          w='havenline-task10-critic-input-'+os.environ['CANDIDATE']
          rows=[x for x in d['artifacts'] if x['name']==w and not x['expired']]
          print(rows[0]['id'] if len(rows)==1 else '')
          PY
            )
            if [ -n "$id" ]; then
              echo "artifact_name=$wanted" >> "$GITHUB_OUTPUT"
              echo "artifact_id=$id" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            conclusion=$(gh api "/repos/ksolo21-web/HAVENLINE/actions/runs/$SOURCE_RUN" --jq '.conclusion // ""')
            if [ "$conclusion" = failure ] || [ "$conclusion" = cancelled ]; then
              echo "source run terminated before critic input" >&2; exit 1
            fi
            sleep 15
          done
          echo "critic input did not appear" >&2; exit 1

  visual-slice:
    needs: evidence-ready
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        critic: [C1, C2]
        slice: [0, 1, 2, 3]
    env:
      CANDIDATE: 'b37b3d5e471c5699b97597f508ad8e7b28ce70ee'
      SOURCE_RUN: '35546330367'
      EVIDENCE_ARTIFACT: ${{ needs.evidence-ready.outputs.artifact_name }}
      HAVENLINE_INDEPENDENT_REVIEW_JOB: '1'
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: ${{ env.EVIDENCE_ARTIFACT }}
          path: critic-input
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN }}
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ~/.cache/havenline-t01-qwen35
          key: havenline-t01-qwen35-9b-q5-20260908-v1
      - name: Bind exact candidate and reviewer runtime
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/t10-final-candidate" "$CANDIDATE"
          for p in Docs/Production/CRITIC_MATRIX.json Docs/Production/CRITIC_EXECUTION.json tools/havenline/task10/review_visual.py; do
            cmp "$RUNNER_TEMP/t10-final-candidate/$p" "$p"
          done
          if [ ! -s "$HOME/.cache/havenline-t01-qwen35/manifest.json" ]; then
            sudo apt-get update -qq; sudo apt-get install -y aria2
          fi
          python3 tools/havenline/production/prepare_specialist_runtime.py > reviewer-runtime.json
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python3 -m pip install --disable-pip-version-check --no-input pillow==12.3.0
          python3 tools/havenline/production/specialist_evidence_manifest.py validate "critic-input/${{ matrix.critic }}-manifest.json"
      - name: Execute independent visual slice
        run: |
          set -euo pipefail
          python3 -u tools/havenline/task10/review_final_visual_slice.py             --critic "${{ matrix.critic }}" --slice "${{ matrix.slice }}"             --candidate "$CANDIDATE" --repo "$RUNNER_TEMP/t10-final-candidate"             --evidence critic-input --out "slice/${{ matrix.critic }}-${{ matrix.slice }}"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: t10-final-visual-${{ matrix.critic }}-${{ matrix.slice }}-${{ env.CANDIDATE }}
          path: slice/
          if-no-files-found: error
          retention-days: 30

  aggregate-visual:
    needs: [evidence-ready, visual-slice]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        critic: [C1, C2]
    env:
      CANDIDATE: 'b37b3d5e471c5699b97597f508ad8e7b28ce70ee'
      SOURCE_RUN: '35546330367'
      EVIDENCE_ARTIFACT: ${{ needs.evidence-ready.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: t10-final-visual-${{ matrix.critic }}-*-${{ env.CANDIDATE }}
          path: visual-input
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: ${{ env.EVIDENCE_ARTIFACT }}
          path: critic-input
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN }}
      - name: Aggregate by minimum score and validate record
        run: |
          set -euo pipefail
          python3 tools/havenline/task10/aggregate_final_visual_slices.py             --critic "${{ matrix.critic }}" --candidate "$CANDIDATE"             --manifest "critic-input/${{ matrix.critic }}-manifest.json"             --inputs visual-input --out "visual-final/${{ matrix.critic }}"             --run-id "$GITHUB_RUN_ID"
          python3 tools/havenline/task10/review_visual.py             --critic "${{ matrix.critic }}" --candidate "$CANDIDATE"             --manifest "critic-input/${{ matrix.critic }}-manifest.json"             --record "visual-final/${{ matrix.critic }}/critic-record.json"             --output "visual-final/${{ matrix.critic }}/validated.json"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: havenline-task10-${{ matrix.critic }}-final-${{ env.CANDIDATE }}
          path: visual-final/${{ matrix.critic }}/
          if-no-files-found: error
          retention-days: 30

  semantic-specialist:
    needs: evidence-ready
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    strategy:
      fail-fast: false
      matrix:
        critic: [C3, C7]
    env:
      CANDIDATE: 'b37b3d5e471c5699b97597f508ad8e7b28ce70ee'
      SOURCE_RUN: '35546330367'
      EVIDENCE_ARTIFACT: ${{ needs.evidence-ready.outputs.artifact_name }}
      HAVENLINE_INDEPENDENT_REVIEW_JOB: '1'
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: ${{ env.EVIDENCE_ARTIFACT }}
          path: critic-input
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN }}
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ~/.cache/havenline-t01-qwen35
          key: havenline-t01-qwen35-9b-q5-20260908-v1
      - name: Bind exact candidate and pinned reviewer
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/t10-final-candidate" "$CANDIDATE"
          for p in Docs/Production/CRITIC_MATRIX.json Docs/Production/CRITIC_EXECUTION.json tools/havenline/production/specialist_critic_runner.py tools/havenline/production/specialist_evidence_manifest.py tools/havenline/production/critic_harness.py; do
            cmp "$RUNNER_TEMP/t10-final-candidate/$p" "$p"
          done
          if [ ! -s "$HOME/.cache/havenline-t01-qwen35/manifest.json" ]; then
            sudo apt-get update -qq; sudo apt-get install -y aria2
          fi
          python3 tools/havenline/production/prepare_specialist_runtime.py > reviewer-runtime.json
          python3 -m pip install --disable-pip-version-check --no-input pillow==12.3.0
          python3 tools/havenline/production/specialist_evidence_manifest.py validate "critic-input/${{ matrix.critic }}-manifest.json"
      - name: Execute fresh independent specialist
        run: |
          set -euo pipefail
          python3 -u tools/havenline/production/specialist_critic_runner.py \
            --critic "${{ matrix.critic }}" --candidate "$CANDIDATE" \
            --manifest "critic-input/${{ matrix.critic }}-manifest.json" \
            --out "specialist-final/${{ matrix.critic }}"
          cp reviewer-runtime.json "specialist-final/${{ matrix.critic }}/runtime-preparation.json"
      - name: Enforce strict greater-than-nine specialist gate
        if: always()
        run: |
          test -f "specialist-final/${{ matrix.critic }}/critic-record.json"
          python3 tools/havenline/production/critic_harness.py validate-raw \
            --critic "${{ matrix.critic }}" --candidate "$CANDIDATE" \
            --raw "specialist-final/${{ matrix.critic }}/critic-record.json"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: havenline-task10-${{ matrix.critic }}-final-${{ env.CANDIDATE }}
          path: specialist-final/${{ matrix.critic }}/
          if-no-files-found: error
          retention-days: 90

  c4:
    needs: evidence-ready
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    env:
      CANDIDATE: 'b37b3d5e471c5699b97597f508ad8e7b28ce70ee'
      SOURCE_RUN: '35546330367'
      EVIDENCE_ARTIFACT: ${{ needs.evidence-ready.outputs.artifact_name }}
      HAVENLINE_INDEPENDENT_REVIEW_JOB: '1'
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: ${{ env.EVIDENCE_ARTIFACT }}
          path: critic-input
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN }}
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ~/.cache/havenline-t01-qwen35
          key: havenline-t01-qwen35-9b-q5-20260908-v1
      - name: Bind exact candidate and prepare readable C4 evidence
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/t10-final-candidate" "$CANDIDATE"
          for p in Docs/Production/CRITIC_MATRIX.json Docs/Production/CRITIC_EXECUTION.json tools/havenline/production/specialist_critic_runner.py tools/havenline/production/specialist_evidence_manifest.py tools/havenline/production/critic_harness.py; do
            cmp "$RUNNER_TEMP/t10-final-candidate/$p" "$p"
          done
          if [ ! -s "$HOME/.cache/havenline-t01-qwen35/manifest.json" ]; then
            sudo apt-get update -qq; sudo apt-get install -y aria2
          fi
          python3 tools/havenline/production/prepare_specialist_runtime.py > reviewer-runtime.json
          python3 -m pip install --disable-pip-version-check --no-input pillow==12.3.0
          python3 - <<'PY'
          import json
          from pathlib import Path
          src=Path('critic-input/C4-manifest.json')
          m=json.loads(src.read_text())
          assert m['candidate_commit']=='b37b3d5e471c5699b97597f508ad8e7b28ce70ee' and m['critic_id']=='C4'
          groups=[]
          for g in m['groups']:
            if g['id']!='motion-0':
              groups.append(g);continue
            visuals=[i for i in g['items'] if i.get('kind') in ('image','motion_frame')]
            support=[i for i in g['items'] if i.get('kind') not in ('image','motion_frame')]
            assert len(visuals)==6 and support and support[-1]['path']=='critic-input/review-output-contract.txt'
            for gid,chunk in (
              ('motion-0-ready-transition',visuals[:3]),
              ('motion-0-blocked-fullres',visuals[3:5]),
              ('motion-0-preview-transition',visuals[5:]),
            ):
              groups.append({'id':gid,'items':chunk+support})
          assert len(groups)==len(m['groups'])+2
          m['groups']=groups
          Path('critic-input/C4-final-manifest.json').write_text(json.dumps(m,indent=2)+'\n')
          PY
          python3 tools/havenline/production/specialist_evidence_manifest.py validate critic-input/C4-final-manifest.json
      - name: Execute fresh independent C4 at readable resolution
        run: |
          set -euo pipefail
          python3 -u tools/havenline/production/specialist_critic_runner.py \
            --critic C4 --candidate "$CANDIDATE" \
            --manifest critic-input/C4-final-manifest.json --out c4-final
          cp reviewer-runtime.json c4-final/runtime-preparation.json
      - name: Enforce strict greater-than-nine C4 gate
        if: always()
        run: |
          test -f c4-final/critic-record.json
          python3 tools/havenline/production/critic_harness.py validate-raw \
            --critic C4 --candidate "$CANDIDATE" --raw c4-final/critic-record.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: havenline-task10-C4-final-${{ env.CANDIDATE }}
          path: |
            c4-final/
            critic-input/C4-final-manifest.json
            reviewer-runtime.json
          if-no-files-found: error
          retention-days: 90

  c6:
    needs: evidence-ready
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CANDIDATE: 'b37b3d5e471c5699b97597f508ad8e7b28ce70ee'
      SOURCE_RUN: '35546330367'
      EVIDENCE_ARTIFACT: ${{ needs.evidence-ready.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: ${{ env.EVIDENCE_ARTIFACT }}
          path: critic-input
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN }}
      - name: Score strict quantitative C6 and validate canonical performance gate
        run: |
          set -euo pipefail
          test "$(git ls-remote --exit-code origin refs/heads/codex/havenline-sequential-task-01 | cut -f1)" = "$CANDIDATE"
          python3 tools/havenline/task10/score_final_c6.py             --candidate "$CANDIDATE"             --performance critic-input/performance.json             --manifest critic-input/C6-manifest.json             --budgets Docs/Production/PERFORMANCE_BUDGETS.json             --out c6-final
          python3 tools/havenline/task10/review_performance.py             --candidate "$CANDIDATE"             --performance critic-input/performance.json             --manifest critic-input/C6-manifest.json             --record c6-final/critic-record.json             --output c6-final/validated.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: havenline-task10-C6-final-${{ env.CANDIDATE }}
          path: c6-final/
          if-no-files-found: error
          retention-days: 30

  six-critic-aggregate:
    needs: [evidence-ready, aggregate-visual, semantic-specialist, c4, c6]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CANDIDATE: 'b37b3d5e471c5699b97597f508ad8e7b28ce70ee'
      SOURCE_RUN: '35546330367'
      EVIDENCE_ARTIFACT: ${{ needs.evidence-ready.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: havenline-task10-C?-final-${{ env.CANDIDATE }}
          path: current-final
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: ${{ env.EVIDENCE_ARTIFACT }}
          path: critic-input
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN }}
      - name: Normalize the six fresh exact-source critic records
        run: |
          set -euo pipefail
          mkdir -p normalized
          for cid in C1 C2 C3 C4 C6 C7; do
            rec=$(find current-final -path "*$cid*" -name critic-record.json -print -quit); test -n "$rec"
            mkdir -p "normalized/$cid"
            cp "$rec" "normalized/$cid/critic-record.json"
            rawname=$(CID="$cid" python3 - <<'PY'
          import json,os
          from pathlib import Path
          cid=os.environ['CID'];print(Path(json.load(open(f'normalized/{cid}/critic-record.json'))['raw_output_path']).name)
          PY
            )
            raw=$(find current-final -path "*$cid*" -name "$rawname" -print -quit); test -n "$raw"
            cp "$raw" "normalized/$cid/$rawname"
          done
          final_manifest=$(find current-final -path '*C4*' -name C4-final-manifest.json -print -quit); test -n "$final_manifest"
          cp "$final_manifest" critic-input/C4-manifest.json
      - name: Aggregate exact six fresh critics without rescoring
        run: |
          set -euo pipefail
          rm -rf six-critic
          python3 tools/havenline/task10/aggregate_critics.py \
            --candidate "$CANDIDATE" \
            --records-root normalized \
            --inputs-root critic-input \
            --out six-critic
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.load(open('six-critic/critic-aggregate.json'))
          assert report['passed'] is True,report
          ids=['C1','C2','C3','C4','C6','C7'];mins=[]
          for cid in ids:
            r=json.load(open(f'normalized/{cid}/critic-record.json'))
            assert r['passed'] is True and r['defects']==[] and r['coverage_complete'] is True,r
            assert all(float(v)>9.0 for v in r['scores'].values()),r
            mins.extend(float(v) for v in r['scores'].values())
          summary={'task_id':'T10','candidate_commit':report['candidate_commit'],'required_critics':ids,'minimum_score':min(mins),'all_dimensions_strictly_above_9':True,'defects':[],'coverage_complete':True,'passed':True,'task_approved':False}
          Path('six-critic-summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          print(json.dumps(summary))
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: havenline-task10-six-critic-final-${{ env.CANDIDATE }}
          path: |
            six-critic/
            six-critic-summary.json
            normalized/
          if-no-files-found: error
          retention-days: 90
