name: Havenline T10 final bookkeeping repair review
on:
  push:
    branches: ['havenline/review-T10-bookkeeping-controller']
permissions:
  contents: read
concurrency:
  group: havenline-t10-final-bookkeeping-review
  cancel-in-progress: false
jobs:
  exact-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: false
      - name: Reproduce exact bookkeeping source
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/t10-bookkeeping-source" fc9010daebf6b4d520333279486a1b6bea164e7c
          python3 tools/havenline/task10/review_final_bookkeeping.py --mode preflight --repo "$RUNNER_TEMP/t10-bookkeeping-source" --out bookkeeping-preflight
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: t10-final-bookkeeping-preflight-${{ github.sha }}
          path: bookkeeping-preflight/
          if-no-files-found: error
          retention-days: 30

  independent-bookkeeping-review:
    needs: exact-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      HAVENLINE_INDEPENDENT_REVIEW_JOB: '1'
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: false
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ~/.cache/havenline-t01-qwen35
          key: havenline-t01-qwen35-9b-q5-20260908-v1
      - name: Prepare pinned reviewer runtime
        run: |
          set -euo pipefail
          if [ ! -s "$HOME/.cache/havenline-t01-qwen35/manifest.json" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y aria2
          fi
          python3 tools/havenline/production/prepare_specialist_runtime.py > reviewer-runtime.json
          git worktree add --detach "$RUNNER_TEMP/t10-bookkeeping-source" fc9010daebf6b4d520333279486a1b6bea164e7c
      - name: Independently review exact two-file delta
        run: |
          set -euo pipefail
          python3 tools/havenline/task10/review_final_bookkeeping.py --mode review --repo "$RUNNER_TEMP/t10-bookkeeping-source" --out bookkeeping-critic
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: t10-final-bookkeeping-review-${{ github.sha }}
          path: |
            bookkeeping-critic/
            reviewer-runtime.json
          if-no-files-found: error
          retention-days: 30
