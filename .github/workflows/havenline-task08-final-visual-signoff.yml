name: Havenline T08 final visual signoff capture
on:
  push:
    branches: ['codex/havenline-sequential-task-01']
    paths:
      - '.github/workflows/havenline-task08-final-visual-signoff.yml'
      - 'Docs/Production/T08/VISUAL_REPAIR_SCOPE.json'
      - 'Docs/Production/APPROVAL_INVALIDATIONS.json'
      - 'HavenlineGodot/tests/capture_task08_final_visual.gd'
permissions:
  contents: read
concurrency:
  group: havenline-t08-final-visual-signoff
  cancel-in-progress: false
env:
  T08_CANDIDATE: 9efb11e0262ae65de32f664d4627902d565f1148
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Prove shipping runtime is exact repaired candidate
        run: |
          set -euo pipefail
          git diff --exit-code "$T08_CANDIDATE" HEAD --             HavenlineGodot/scripts/transfer_feedback.gd             HavenlineGodot/scripts/carry_stack.gd             HavenlineGodot/scripts/storage_stockpile.gd             HavenlineGodot/assets/transfer_feedback_v2/
      - name: Prepare pinned Godot and capture tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb mesa-vulkan-drivers ffmpeg
          python3 -m pip install --disable-pip-version-check pillow
          mkdir -p "$RUNNER_TEMP/engine" t08-final-visual/route-proofs t08-final-visual/sequence t08-final-visual/stills
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o "$RUNNER_TEMP/engine/engine.zip"
          (cd "$RUNNER_TEMP/engine"; echo '9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65  engine.zip' | sha512sum -c -; unzip -q engine.zip; chmod +x Godot_v4.7.2-stable_linux.x86_64)
          echo "$RUNNER_TEMP/engine" >> "$GITHUB_PATH"
      - name: Require zero primitive findings
        run: python3 tools/havenline/production/shipping_visual_gate.py audit-task T08 --candidate "$T08_CANDIDATE" --require-clean --output t08-final-visual/primitive-audit.json
      - name: Import exact repaired source
        run: |
          set -euo pipefail
          python3 tools/havenline/bake_outpost_audio.py > t08-final-visual/audio-fixture.json
          timeout 240 Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path HavenlineGodot --import --quit > t08-final-visual/import.log 2>&1
          timeout 120 Godot_v4.7.2-stable_linux.x86_64 --headless --path HavenlineGodot --script res://tools/bake_crew_motion.gd > t08-final-visual/motion-fixture.log 2>&1
      - name: Capture exact-source native-4K motion in bounded route shards
        run: |
          set -euo pipefail
          export VK_ICD_FILENAMES=$(find /usr/share/vulkan/icd.d -name '*lvp*json' | head -1)
          test -n "$VK_ICD_FILENAMES"
          for route in 0 2 5; do
            out="t08-final-visual/route-$route"
            mkdir -p "$out"
            xvfb-run -a -s '-screen 0 3840x2160x24' timeout 600 Godot_v4.7.2-stable_linux.x86_64 --path HavenlineGodot --rendering-method mobile --rendering-driver vulkan --audio-driver Dummy --resolution 3840x2160 --script res://tests/capture_task08_final_visual.gd -- --candidate="$T08_CANDIDATE" --state=route-proofs --device=final_visual_4k --view=three-quarter --route-index="$route" --native-4k --integrated --out="$(pwd)/$out" > "$out.log" 2>&1
          done
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:' t08-final-visual/*.log; then exit 1; fi
      - name: Build 4K60 review package
        run: |
          set -euo pipefail
          for route in 0 2 5; do
            ffmpeg -hide_banner -loglevel error -framerate 60 -i "t08-final-visual/route-$route/frames/frame-%05d.jpg" -c:v libx264 -preset ultrafast -crf 17 -pix_fmt yuv420p -r 60 "t08-final-visual/route-$route-4k60.mp4"
          done
          printf "file 'route-0-4k60.mp4'\nfile 'route-2-4k60.mp4'\nfile 'route-5-4k60.mp4'\n" > t08-final-visual/concat.txt
          ffmpeg -hide_banner -loglevel error -f concat -safe 0 -i t08-final-visual/concat.txt -c copy -movflags +faststart t08-final-visual/T08-final-visual-4k60.mp4
          mkdir -p t08-final-visual/stills
          cp t08-final-visual/route-0/route-0-frame-024.png t08-final-visual/stills/01-furnace-transfer.png
          cp t08-final-visual/route-0/route-0-frame-050.png t08-final-visual/stills/02-furnace-arrival.png
          cp t08-final-visual/route-2/route-2-frame-050.png t08-final-visual/stills/03-defense-arrival.png
          cp t08-final-visual/route-5/route-5-frame-050.png t08-final-visual/stills/04-repair-arrival.png
          ffprobe -v error -show_entries stream=width,height,avg_frame_rate,nb_frames -show_entries format=duration -of json t08-final-visual/T08-final-visual-4k60.mp4 > t08-final-visual/video-probe.json
          python3 tools/havenline/task08/validate_final_visual.py --root t08-final-visual --candidate "$T08_CANDIDATE"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: havenline-T08-final-visual-9efb11e0262ae65de32f664d4627902d565f1148
          path: |
            t08-final-visual/stills/
            t08-final-visual/T08-final-visual-4k60.mp4
            t08-final-visual/review-manifest.json
            t08-final-visual/primitive-audit.json
            t08-final-visual/video-probe.json
            t08-final-visual/route-0/capture.json
            t08-final-visual/route-2/capture.json
            t08-final-visual/route-5/capture.json
          retention-days: 30
          if-no-files-found: error
