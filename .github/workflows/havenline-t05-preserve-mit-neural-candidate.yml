name: T05 Archive stronger three-view R36 neural candidate IN GIT, unapproved
on:
  push:
    branches: [havenline/T05-r18-visual-corrections-20261025]
    paths: [.github/workflows/havenline-t05-preserve-mit-neural-candidate.yml]
permissions:
  contents: write
  actions: read
jobs:
  publish-review-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      DEST: Docs/Production/T05/NeuralTrials/R36
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Fetch exact successful source-reconstruction artifact
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/t05-evidence"
          gh run download 40774718455 -R "$GITHUB_REPOSITORY" \
            -n havenline-T05-three-owner-views-NEURAL-UNAPPROVED-40774718455 \
            -D "$RUNNER_TEMP/t05-evidence"
      - name: Verify all originals and all three improvements before versioning
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          e=Path(os.environ['RUNNER_TEMP'])/'t05-evidence'
          q=json.loads((e/'inputs/receipt.json').read_text())
          assert len(q['source'])==3 and not q['camera_poses_calibrated']
          for x in q['source']:
              p=Path('Docs/Art/SourceReferences/T05')/x['original']
              assert hashlib.sha256(p.read_bytes()).hexdigest()==x['sha256']
          b=json.loads((e/'evaluations/seed/audit.json').read_text())
          r=json.loads((e/'evaluations/refined/audit.json').read_text())
          assert r['mean_iou']>b['mean_iou']
          assert all(x['view']==y['view'] and y['approximate_silhouette_iou']>x['approximate_silhouette_iou'] for x,y in zip(b['views'],r['views']))
          print('PASS: 3 real source images; 3 uncalibrated silhouette improvements; NO ART APPROVAL')
          PY
      - name: Install lightweight free mesh serialization dependency
        run: python -m pip install 'numpy>=1.26,<3' 'trimesh>=4,<5'
      - name: Commit permanent candidate evidence, not shipping assets
        run: |
          set -euo pipefail
          mkdir -p "$DEST"
          cp -a "$RUNNER_TEMP/t05-evidence/inputs" "$DEST/"
          cp -a "$RUNNER_TEMP/t05-evidence/meshes" "$DEST/"
          cp -a "$RUNNER_TEMP/t05-evidence/evaluations" "$DEST/"
          python tools/havenline/task05/orient_triposr_for_godot.py \
            --input "$DEST/meshes/three_view_refined.glb" \
            --output "$DEST/meshes/three_view_refined_Godot_Yup.glb"
          python - <<'PY'
          import os,json
          from pathlib import Path
          d=Path(os.environ['DEST'])
          r=json.loads((d/'evaluations/refined/audit.json').read_text())
          (d/'STATUS.json').write_text(json.dumps({
            'task':'T05','trial':'R36','reference_images':3,
            'source_github_run_id':40774718455,
            'silhouette_mean_iou_approximate':r['mean_iou'],
            'calibrated_cameras':False,'actual_neural_geometry_generated':True,
            'visual_critic_pass':False,'owner_approved':False,
            'shipping_asset_changed':False},indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DEST"
          git diff --cached --check
          git commit -m 'T05: archive generated 3-view neural R35 GLB and measured source critic FAIL without shipping changes'
          git push origin HEAD:"$GITHUB_REF_NAME"
