name: Havenline T03 supplied-reference art evidence
on:
  push:
    branches: ['havenline/T03-reference-art-20260926']
    paths: ['Docs/Production/T03/REFERENCE_ART_SOURCE_FREEZE.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: havenline-task03-reference-art-${{ github.ref }}
  cancel-in-progress: false
jobs:
  reference-art-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 42
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify committed authored models and unchanged 11H gameplay authority
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check numpy pillow
          mkdir -p t03-reference-art/tests t03-reference-art/gallery t03-reference-art/native4k
          python3 tools/havenline/task03_reference_assets.py --verify > t03-reference-art/source-integrity.json
          python3 tools/havenline/production/shipping_visual_gate.py audit-task T03 --candidate "$GITHUB_SHA" --require-clean --output t03-reference-art/primitive-audit.json
      - name: Prepare exact pinned Godot and Vulkan runtime
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-vulkan-drivers
          mkdir -p "$RUNNER_TEMP/engine"
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o "$RUNNER_TEMP/engine/engine.zip"
          (cd "$RUNNER_TEMP/engine"; echo '9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65  engine.zip' | sha512sum -c -; unzip -q engine.zip; chmod +x Godot_v4.7.2-stable_linux.x86_64)
          echo "$RUNNER_TEMP/engine" >> "$GITHUB_PATH"
      - name: Import exact source and run protected T01-T03 regression
        run: |
          set -euo pipefail
          python3 tools/havenline/bake_outpost_audio.py > t03-reference-art/audio-fixture.json
          timeout 180 Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path HavenlineGodot --import --quit > t03-reference-art/tests/import.log 2>&1
          timeout 120 Godot_v4.7.2-stable_linux.x86_64 --headless --path HavenlineGodot --script res://tools/bake_crew_motion.gd > t03-reference-art/tests/motion-fixture.log 2>&1
          for suite in test_simulation test_crew_and_persistence test_motion_and_performance test_population test_outpost test_outpost_runtime test_environment test_render_budget test_adaptive_devices test_reference_forest test_reference_forest_acceptance test_task02_terrain test_task02_surface_stress test_lake_east_west test_task02_river test_task03_boundary; do
            echo "Running $suite; timeout 180s"
            timeout 180 Godot_v4.7.2-stable_linux.x86_64 --headless --audio-driver Dummy --path HavenlineGodot --script "res://tests/$suite.gd" > "t03-reference-art/tests/$suite.log" 2>&1
          done
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:|ObjectDB instances were leaked' t03-reference-art/tests/*.log; then exit 1; fi
          python3 - <<'PY'
          from pathlib import Path
          import json,os
          rows=[]
          for p in sorted(Path('t03-reference-art/tests').glob('test_*.log')):
              reports=[json.loads(x) for x in p.read_text().splitlines() if x.startswith('{')]
              assert reports,p
              r=reports[-1];assert r.get('passed') is True and not r.get('failures'),(p,r)
              checks=r.get('checks',[])
              rows.append({'suite':p.stem,'checks':len(checks) if isinstance(checks,list) else int(checks),'passed':True})
          assert len(rows)==16
          out={'source':os.environ['GITHUB_SHA'],'suites':rows,'suite_count':16,'total_checks':sum(x['checks'] for x in rows),'all_passed':True,'task_approved':False}
          Path('t03-reference-art/tests.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out))
          PY
      - name: Capture exact source in all existing T03 views
        run: |
          set -euo pipefail
          export VK_ICD_FILENAMES=$(find /usr/share/vulkan/icd.d -name '*lvp*json' | head -1)
          test -n "$VK_ICD_FILENAMES"
          xvfb-run -a -s '-screen 0 1280x720x24' timeout 600 Godot_v4.7.2-stable_linux.x86_64 --path HavenlineGodot --rendering-method mobile --rendering-driver vulkan --audio-driver Dummy --resolution 1280x720 --script res://tests/capture_task03_boundary.gd -- --out="$PWD/t03-reference-art/gallery" > t03-reference-art/gallery.log 2>&1
          xvfb-run -a -s '-screen 0 3840x2160x24' timeout 600 Godot_v4.7.2-stable_linux.x86_64 --path HavenlineGodot --rendering-method mobile --rendering-driver vulkan --audio-driver Dummy --resolution 3840x2160 --script res://tests/capture_task03_boundary.gd -- --native-4k --out="$PWD/t03-reference-art/native4k" > t03-reference-art/native4k.log 2>&1
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:' t03-reference-art/gallery.log t03-reference-art/native4k.log; then exit 1; fi
      - name: Verify exact-source image and authority package
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib,json,os
          root=Path('t03-reference-art');hashes={}
          for folder,count,res in [('gallery',47,(1280,720)),('native4k',11,(3840,2160))]:
              pngs=sorted((root/folder).glob('*.png'));assert len(pngs)==count
              cap=json.loads((root/folder/'capture.json').read_text())
              assert cap['task']=='T03-boundary-v2' and cap['renderer']=='mobile'
              assert len(cap['captures'])==count and cap['boundary']['gate_count']==6
              assert cap['boundary']['primitive_fence_meshes_created'] is False
              assert cap['boundary']['imported_standard_materials_active'] is False
              for p in pngs:
                  with Image.open(p) as im:assert im.size==res;im.verify()
                  hashes[str(p.relative_to(root))]=hashlib.sha256(p.read_bytes()).hexdigest()
          tests=json.loads((root/'tests.json').read_text());source=json.loads((root/'source-integrity.json').read_text());audit=json.loads((root/'primitive-audit.json').read_text())
          assert tests['all_passed'] and source['passed'] and audit['passed'] and audit['finding_count']==0
          out={'task_id':'T03','candidate_sha':os.environ['GITHUB_SHA'],'run_id':int(os.environ['GITHUB_RUN_ID']),'source_bound':True,'renderer':'mobile','render_scale':1.0,'images':hashes,'total_stills':58,'tests':tests,'primitive_audit':audit,'source_integrity':source,'machine_gate_passed':True,'critics_executed':False,'user_visual_approval':False,'task_approved':False,'physical_4k60_certified':False}
          (root/'evidence.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps({k:v for k,v in out.items() if k!='images'}))
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: havenline-task03-reference-art-${{ github.sha }}
          path: t03-reference-art
          if-no-files-found: error
          retention-days: 14
