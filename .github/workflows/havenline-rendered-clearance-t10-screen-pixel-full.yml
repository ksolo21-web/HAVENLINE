name: Havenline T10 screen-pixel complete raster proof
on:
  push:
    branches: ['havenline/governance-T10-screen-pixel-full']
permissions:
  contents: read
  actions: read
concurrency:
  group: havenline-task10-rendered-clearance-probe
  cancel-in-progress: false
jobs:
  rendered-canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          lfs: false
      - name: Exact canonical one-shot admission
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin codex/havenline-sequential-task-01:refs/remotes/origin/codex/havenline-sequential-task-01
          python3 tools/havenline/task10/admit_screen_pixel_full.py
      - name: Cheap proof tooling and pinned parser
        run: |
          set -euo pipefail
          python3 -m pip install pillow==12.3.0 numpy==2.3.5
          python3 -m unittest tools.havenline.task10.tests.test_admit_screen_pixel_full tools.havenline.task10.tests.test_verify_screen_pixel_clearance
          sudo apt-get update -qq
          sudo apt-get install -y xvfb mesa-vulkan-drivers
          mkdir -p "$RUNNER_TEMP/engine"
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o "$RUNNER_TEMP/engine/engine.zip"
          (cd "$RUNNER_TEMP/engine"; echo '9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65  engine.zip' | sha512sum -c -; unzip -q engine.zip; chmod +x Godot_v4.7.2-stable_linux.x86_64)
          test ! -e HavenlineGodot/.godot
          timeout 30 "$RUNNER_TEMP/engine/Godot_v4.7.2-stable_linux.x86_64" --headless --path HavenlineGodot --script res://tests/capture_task10_world_transform.gd --check-only > screen-full/check-only.log 2>&1
          if grep -E 'SCRIPT ERROR|Parse Error' screen-full/check-only.log; then exit 1; fi
          timeout 240 "$RUNNER_TEMP/engine/Godot_v4.7.2-stable_linux.x86_64" --headless --editor --path HavenlineGodot --import --quit > screen-full/import.log 2>&1
          if grep -E 'SCRIPT ERROR|Parse Error|ObjectDB instances were leaked' screen-full/import.log; then exit 1; fi
      - name: Prove every feedback branch and transition headlessly
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import subprocess,json,hashlib,os
          from pathlib import Path
          out=Path('screen-full')
          script='tools/havenline/task10/preflight_feedback_layout.gd'
          command=[os.environ['RUNNER_TEMP']+'/engine/Godot_v4.7.2-stable_linux.x86_64','--headless','--path','HavenlineGodot','--script',str(Path(script).resolve()),'--','--out='+str((out/'feedback-layout.json').resolve())]
          with (out/'feedback-layout.log').open('w') as log:
              result=subprocess.run(command,stdout=log,stderr=subprocess.STDOUT,timeout=240)
          binding={'source':os.environ['GITHUB_SHA'],'command':command,'exit_code':result.returncode,'script_sha256':hashlib.sha256(Path(script).read_bytes()).hexdigest(),'log_sha256':hashlib.sha256((out/'feedback-layout.log').read_bytes()).hexdigest(),'task_approved':False}
          proof_path=out/'feedback-layout.json'
          if proof_path.exists():binding['proof_sha256']=hashlib.sha256(proof_path.read_bytes()).hexdigest()
          (out/'headless-proof-binding.json').write_text(json.dumps(binding,indent=2)+'\n')
          assert result.returncode==0,binding
          proof=json.loads(proof_path.read_text())
          assert proof.get('passed') is True and proof.get('case_count')==1728
          assert len(proof.get('extra_cases',[]))==111 and all(x.get('passed') is True for x in proof['extra_cases'])
          assert len(proof.get('transition_cases',[]))==3 and all(x.get('passed') is True for x in proof['transition_cases'])
          assert not proof.get('errors')
          assert not any(x in (out/'feedback-layout.log').read_text() for x in ('SCRIPT ERROR','Parse Error','ObjectDB instances were leaked'))
          PYTHON
      - name: Collect all 684 rendered full-domain cases
        run: |
          set -euo pipefail
          icd=$(find /usr/share/vulkan/icd.d -name '*lvp*json' -print -quit)
          test -n "$icd"
          python3 tools/havenline/task10/run_screen_pixel_canary.py \
            --repo "$GITHUB_WORKSPACE" --output "$GITHUB_WORKSPACE/screen-full/cases" \
            --source "$GITHUB_SHA" --engine "$RUNNER_TEMP/engine/Godot_v4.7.2-stable_linux.x86_64" \
            --engine-archive "$RUNNER_TEMP/engine/engine.zip" --xvfb /usr/bin/Xvfb \
            --library-path /usr/lib/x86_64-linux-gnu --vulkan-icd "$icd" \
            --execution-kind HOSTED_FULL_RASTER_PROOF --domain full684
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: havenline-task10-screen-pixel-full-${{ github.sha }}
          path: screen-full
          if-no-files-found: error
          retention-days: 30
