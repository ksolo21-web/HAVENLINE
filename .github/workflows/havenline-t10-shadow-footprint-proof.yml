name: Havenline T10 shadow-footprint repair proof

on:
  push:
    branches: ['havenline/T10-rendered-footprint-shadow-repair']

permissions:
  contents: read

concurrency:
  group: havenline-t10-shadow-footprint-proof
  cancel-in-progress: false

jobs:
  full-raster-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: false

      - name: Prepare pinned proof runtime
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/engine" t10-shadow-proof
          python3 -m pip install pillow==12.3.0 numpy==2.3.5
          sudo apt-get update -qq
          sudo apt-get install -y xvfb mesa-vulkan-drivers
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o "$RUNNER_TEMP/engine/engine.zip"
          (cd "$RUNNER_TEMP/engine"; echo '9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65  engine.zip' | sha512sum -c -; unzip -q engine.zip; chmod +x Godot_v4.7.2-stable_linux.x86_64)

      - name: Parse, import, and focused regressions
        run: |
          set -euo pipefail
          ENGINE="$RUNNER_TEMP/engine/Godot_v4.7.2-stable_linux.x86_64"
          timeout 30 "$ENGINE" --headless --path HavenlineGodot --script res://tests/capture_task10_world_transform.gd --check-only > t10-shadow-proof/check-only.log 2>&1
          timeout 240 "$ENGINE" --headless --editor --path HavenlineGodot --import --quit > t10-shadow-proof/import.log 2>&1
          for suite in test_task10_world_transform test_task10_integration; do
            timeout 300 "$ENGINE" --headless --audio-driver Dummy --path HavenlineGodot --script "res://tests/$suite.gd" > "t10-shadow-proof/$suite.log" 2>&1
          done
          if grep -E 'SCRIPT ERROR|Parse Error|ObjectDB instances were leaked' t10-shadow-proof/*.log; then exit 1; fi
          python3 -m unittest tools.havenline.task10.tests.test_verify_screen_pixel_clearance

      - name: Full analytic layout domain
        run: |
          set -euo pipefail
          ENGINE="$RUNNER_TEMP/engine/Godot_v4.7.2-stable_linux.x86_64"
          timeout 300 "$ENGINE" --headless --path HavenlineGodot --script "$(pwd)/tools/havenline/task10/preflight_feedback_layout.gd" -- --out="$(pwd)/t10-shadow-proof/feedback-layout.json" > t10-shadow-proof/feedback-layout.log 2>&1
          python3 - <<'PY'
          import json
          p=json.load(open('t10-shadow-proof/feedback-layout.json'))
          assert p.get('passed') is True,p
          assert p.get('case_count')==1728,p.get('case_count')
          assert len(p.get('extra_cases',[]))==111 and all(x.get('passed') is True for x in p['extra_cases'])
          assert len(p.get('transition_cases',[]))==3 and all(x.get('passed') is True for x in p['transition_cases'])
          assert not p.get('errors')
          PY

      - name: Full 684-case rendered screen-pixel proof
        run: |
          set -euo pipefail
          ENGINE="$RUNNER_TEMP/engine/Godot_v4.7.2-stable_linux.x86_64"
          icd=$(find /usr/share/vulkan/icd.d -name '*lvp*json' -print -quit)
          test -n "$icd"
          python3 tools/havenline/task10/run_screen_pixel_canary.py \
            --repo "$GITHUB_WORKSPACE" \
            --output "$GITHUB_WORKSPACE/t10-shadow-proof/cases" \
            --source "$GITHUB_SHA" \
            --engine "$ENGINE" \
            --engine-archive "$RUNNER_TEMP/engine/engine.zip" \
            --xvfb /usr/bin/Xvfb \
            --library-path /usr/lib/x86_64-linux-gnu \
            --vulkan-icd "$icd" \
            --execution-kind HOSTED_FULL_RASTER_PROOF \
            --domain full684

      - name: Assert proof closure
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          s=json.loads(Path('t10-shadow-proof/cases/summary.json').read_text())
          assert s['source']==os.environ['GITHUB_SHA'],s
          assert s['domain']=='full684',s
          assert s['expected_cases']==684 and s['case_count']==684,s
          assert s['domain_complete'] is True and s['passed'] is True,s
          assert all(x.get('failure_count')==0 and x.get('passed') is True for x in s['profiles']),s
          Path('t10-shadow-proof/closure.json').write_text(json.dumps({
            'task':'T10','source':os.environ['GITHUB_SHA'],'full_rendered_cases':684,
            'analytic_cases':1728,'extreme_cases':111,'transition_cases':3,
            'passed':True,'task_approved':False
          },indent=2)+'\n')
          PY

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: havenline-t10-shadow-footprint-proof-${{ github.sha }}
          path: t10-shadow-proof
          if-no-files-found: error
          retention-days: 30
