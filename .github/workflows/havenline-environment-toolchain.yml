name: Havenline environment toolchain
on:
  push:
    branches: ['codex/havenline-godot-android']
    paths: ['.github/workflows/havenline-environment-toolchain.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned engine without exposing any credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p engine-artifact
          cd engine-artifact
          curl -fL --retry 2 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o engine.zip
          echo '9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65  engine.zip' | sha512sum -c -
          sha256sum engine.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: havenline-pinned-environment-engine
          path: engine-artifact/
          retention-days: 7
          if-no-files-found: error
