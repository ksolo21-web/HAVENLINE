name: T05 free CPU image-to-mesh capability (synthetic data only)

on:
  push:
    branches:
      - havenline/T05-r18-visual-corrections-20261025
    paths:
      - .github/workflows/havenline-t05-free-image-mesh-cpu.yml
      - tools/havenline/task05/visual_hull_cpu.py
      - tools/havenline/task05/test_visual_hull_cpu.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: t05-free-cpu-synthetic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-image-derived-mesh:
    name: Free GitHub CPU runner; synthetic image to watertight GLB
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source code; no owner artwork in public repository
        uses: actions/checkout@v4
      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install free open-source CPU geometry reconstruction dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            "numpy>=1.26,<3" "Pillow>=10,<13" \
            "opencv-python-headless>=4.8,<5" "scipy>=1.11,<2" \
            "scikit-image>=0.22,<1" "trimesh>=4,<5"
      - name: Record available runner resources without private data
        run: |
          python - <<'PY'
          import os,shutil,subprocess,json
          print(json.dumps({
              "cpu_count":os.cpu_count(),
              "disk_free_gb":round(shutil.disk_usage(".").free/1e9,2),
              "gpu_detected":subprocess.call(["bash","-lc","command -v nvidia-smi >/dev/null 2>&1"])==0,
              "reference_images_loaded":False,
              "this_is_not_a_high_fidelity_T05_pass":True
          },indent=2))
          PY
      - name: Test real image-to-geometry code on GENERATED silhouette inputs
        run: |
          cd tools/havenline/task05
          python -m compileall -q visual_hull_cpu.py test_visual_hull_cpu.py
          python test_visual_hull_cpu.py
      - name: Assert no private reference images are tracked or created
        run: |
          test ! -e tools/havenline/task05/32451.jpg
          test ! -e tools/havenline/task05/32450.jpg
          test ! -e tools/havenline/task05/32441.png
          echo "PASS: synthetic-only, no private assets uploaded or archived"
