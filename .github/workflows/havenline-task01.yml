name: Havenline sequential T01 forest review
on:
  push:
    branches: ['codex/havenline-sequential-task-01']
    paths: ['.github/workflows/havenline-task01.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    permissions:
      contents: write
    outputs:
      source: ${{ steps.commit.outputs.source }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Prepare pinned engine and actual software Vulkan renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb mesa-vulkan-drivers
          python3 -m pip install numpy scipy pillow
          mkdir -p "$RUNNER_TEMP/engine" task01-evidence
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o "$RUNNER_TEMP/engine/engine.zip"
          (cd "$RUNNER_TEMP/engine"; echo '9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65  engine.zip' | sha512sum -c -; unzip -q engine.zip; chmod +x Godot_v4.7.2-stable_linux.x86_64)
          echo "$RUNNER_TEMP/engine" >> "$GITHUB_PATH"
      - name: Apply T01 and preserve original models
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,hashlib,json,base64
          root=pathlib.Path('HavenlineGodot/assets');out=pathlib.Path('task01-evidence')
          models={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*.glb') if 'reference_forest' not in str(p)}
          (out/'protected-before.json').write_text(json.dumps(models,indent=2))
          b=base64.b64decode(pathlib.Path('Docs/Production/T01/reference-crops.webp.b64').read_text())
          assert hashlib.sha256(b).hexdigest()=='0602b485dfd8ae9e06a9cb60f77fd902537b1b4cb9a84ab45ed57d7c54033b10'
          (out/'reference-crops.webp').write_bytes(b)
          (out/'reference-provenance.json').write_text(json.dumps({'sources':[{'video':'A','sha256':'62f7cfe644de3826cfdd6d91bc23c0ab8d9e4fde3e175c90f762e604547bb0ca','seek_seconds':5,'crop_xyxy':[0,390,220,690]},{'video':'B','sha256':'4c9051cbea6df0efa3e7288b13b6d17da46e857274869b0b43d2f96ff6cc79d2','seek_seconds':2,'crop_xyxy':[0,600,500,1080]}],'derived_image':'reference-crops.webp','size':[250,158],'operation':'actual source crops, resized side-by-side and compressed; no game art synthesized','limitation':'small comparison crops do not establish fine source detail'},indent=2))
          PY
          if ! grep -q 'const ReferenceForest = preload' HavenlineGodot/scripts/main.gd; then python3 tools/havenline/install_task01.py; fi
          python3 tools/havenline/bake_reference_forest.py | tee task01-evidence/bake.json
          python3 tools/havenline/bake_outpost_audio.py > task01-evidence/audio-bake.json
          timeout 180 Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path HavenlineGodot --import --quit > task01-evidence/import.log 2>&1
          timeout 120 Godot_v4.7.2-stable_linux.x86_64 --headless --path HavenlineGodot --script res://tools/bake_crew_motion.gd > task01-evidence/motion-fixtures.log 2>&1
      - name: Execute all existing and active-task regressions
        run: |
          set -euo pipefail
          for suite in test_simulation test_crew_and_persistence test_motion_and_performance test_population test_outpost test_outpost_runtime test_environment test_render_budget test_adaptive_devices test_reference_forest; do
            timeout 90 Godot_v4.7.2-stable_linux.x86_64 --headless --audio-driver Dummy --path HavenlineGodot --script "res://tests/$suite.gd" > "task01-evidence/$suite.log" 2>&1
          done
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:|ObjectDB instances were leaked' task01-evidence/*.log; then exit 1; fi
          python3 - <<'PY'
          import pathlib,hashlib,json
          e=pathlib.Path('task01-evidence');before=json.loads((e/'protected-before.json').read_text())
          assert all(hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()==h for p,h in before.items())
          reports=[]
          for p in sorted(e.glob('test_*.log')):
              lines=[json.loads(x) for x in p.read_text().splitlines() if x.startswith('{')]
              if not lines:raise ValueError('Missing actual test results '+str(p))
              result=lines[-1];assert result.get('passed',not result.get('failures',[])),p
              checks=result.get('checks',[]);count=len(checks) if isinstance(checks,list) else int(checks)
              reports.append({'file':p.name,'count':count,'passed':True})
          (e/'tests.json').write_text(json.dumps({'suites':reports,'total_checks':sum(r['count'] for r in reports),'all_passed':True,'protected_original_models':len(before),'original_models_unchanged':True,'art_approved':False,'physical_4k60_verified':False},indent=2))
          PY
      - name: Preserve exact tested T01 runtime and assets without touching later tasks
        id: commit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add HavenlineGodot/scripts/main.gd HavenlineGodot/assets/reference_forest/*.glb HavenlineGodot/assets/reference_forest/manifest.json
          if ! git diff --cached --quiet; then
            test "$(git ls-remote origin refs/heads/codex/havenline-sequential-task-01 | cut -f1)" = "$GITHUB_SHA"
            git commit -m 'T01 candidate: integrate tested reference conifers and spatial forest batches; no task approval'
            git push origin HEAD:refs/heads/codex/havenline-sequential-task-01
          fi
          source=$(git rev-parse HEAD)
          echo "source=$source" >> "$GITHUB_OUTPUT"
          echo "$source" > task01-evidence/SOURCE.txt
      - name: Capture actual Mobile views, camera sequence and native 4K integration
        run: |
          set -euo pipefail
          export VK_ICD_FILENAMES=$(find /usr/share/vulkan/icd.d -name '*lvp*json' | head -1)
          test -n "$VK_ICD_FILENAMES"
          mkdir -p task01-evidence/gallery task01-evidence/native4k
          xvfb-run -a -s '-screen 0 1280x720x24' timeout 300 Godot_v4.7.2-stable_linux.x86_64 --path HavenlineGodot --rendering-method mobile --rendering-driver vulkan --audio-driver Dummy --resolution 1280x720 --script res://tests/capture_task01.gd -- --out="$(pwd)/task01-evidence/gallery" > task01-evidence/mobile-gallery.log 2>&1
          xvfb-run -a -s '-screen 0 3840x2160x24' timeout 240 Godot_v4.7.2-stable_linux.x86_64 --path HavenlineGodot --rendering-method mobile --rendering-driver vulkan --audio-driver Dummy --resolution 3840x2160 --fixed-fps 60 -- --capture="$(pwd)/task01-evidence/native4k" > task01-evidence/native4k.log 2>&1
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:' task01-evidence/mobile-gallery.log task01-evidence/native4k.log; then exit 1; fi
          python3 - <<'PY'
          import pathlib,json,hashlib
          from PIL import Image
          e=pathlib.Path('task01-evidence');r=json.loads((e/'gallery/capture.json').read_text());assert r['renderer']=='mobile'
          a=json.loads((e/'native4k/render-evidence.json').read_text());assert a['renderer']=='mobile' and a['render_scale']==1
          assert a['internal_render'][0]>=3840 and a['internal_render'][1]>=2160
          assert Image.open(e/'native4k/native-scene.png').size[0]>=3840
          captures={str(p.relative_to(e)):hashlib.sha256(p.read_bytes()).hexdigest() for p in e.rglob('*.png')}
          (e/'provenance.json').write_text(json.dumps({'task':'T01','source':(e/'SOURCE.txt').read_text().strip(),'captures':captures,'renderer':'mobile','capture_device':r['device'],'native4k_dimensions':a['internal_render'],'capture_count':len(captures),'camera_pose_frames':24,'fixed_step_capture_is_not_fps_evidence':True,'physical_4k60_verified':False,'task_approved':False},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: havenline-T01-build-${{ github.run_id }}
          path: task01-evidence/
          retention-days: 30
          if-no-files-found: error
  independent-critic:
    needs: build-capture
    strategy:
      fail-fast: false
      matrix:
        role: [reference-fidelity, visual-integrity]
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      REVIEW_ROLE: ${{ matrix.role }}
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build-capture.outputs.source }}
      - uses: actions/download-artifact@v4
        with:
          name: havenline-T01-build-${{ github.run_id }}
          path: task01-evidence/
      - run: python3 -m pip install pillow
      - name: Execute the independent pixel reviewer, not builder self-review
        run: python3 -u tools/havenline/review_task01.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: havenline-T01-critic-${{ matrix.role }}-${{ github.run_id }}
          path: critic-results-v2/
          retention-days: 30
          if-no-files-found: error
  task-gate:
    needs: [build-capture, independent-critic]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      EXPECTED_SOURCE: ${{ needs.build-capture.outputs.source }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: havenline-T01-critic-*-${{ github.run_id }}
          path: reviews/
      - name: Keep Task 2 locked unless all active-task evidence and independent reviews pass
        run: |
          mkdir -p gate-report
          python3 - <<'PY'
          import pathlib,json,os
          roles=['reference-fidelity','visual-integrity'];reviews=[];errors=[]
          for role in roles:
              files=list(pathlib.Path('reviews').glob('*'+role+'*/task-review.json'))
              if len(files)!=1:errors.append('Missing independent '+role);continue
              r=json.loads(files[0].read_text());reviews.append(r)
              if r.get('source')!=os.environ['EXPECTED_SOURCE']:errors.append('Wrong source '+role)
              if not r.get('independent_execution'):errors.append('No actual critic execution '+role)
              if not r.get('passed'):errors.append('Critic not passing '+role)
          # These reviewers are advisory: their findings and complete runtime
          # coverage must be checked against original pixels before advancement.
          errors.append('Builder evidence verification and cumulative task sign-off still required; no automatic advancement')
          report={'task':'T01','source':os.environ['EXPECTED_SOURCE'],'minimum_score':9,'target':10,'reviews':reviews,'blockers':errors,'passed':False,'next_task':'T02','next_task_locked':True,'game_complete':False,'physical_phone_tablet_4k60_verified':False}
          pathlib.Path('gate-report/T01.json').write_text(json.dumps(report,indent=2));print(json.dumps(report,indent=2))
          raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: havenline-T01-gate-${{ github.run_id }}
          path: gate-report/
          retention-days: 30
          if-no-files-found: error
# No APK export, no user-test request, and no implementation of T02 or later tasks.
