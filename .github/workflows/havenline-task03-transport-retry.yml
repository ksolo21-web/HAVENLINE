name: Havenline Task 3 incomplete critic retry
on:
  push:
    branches: ['codex/havenline-sequential-task-01']
    paths: ['.github/workflows/havenline-task03-transport-retry.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retry-visual-incomplete:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      EXPECTED_SOURCE: 8dc19649160597f2926ad5bacbccc26ad01ab48f
      REVIEW_ROLE: visual-integrity
      RETRY_GROUPS: side-gates,detail-contact,conditions
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: havenline-task03-evidence-34601284867
          path: task03-evidence/
          github-token: ${{ github.token }}
          repository: ksolo21-web/HAVENLINE
          run-id: 34601284867
      - run: python3 -m pip install 'gradio_client==1.14.0' pillow
      - name: Review only groups that previously returned no verdict
        run: python3 -u tools/havenline/review_task03_transport_retry.py
      - name: Require all three transport-retry verdicts to be complete and 9+
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('task03-review-retry/role-summary.json');o=json.loads(p.read_text())
          assert o['role']=='visual-integrity' and o['source']=='8dc19649160597f2926ad5bacbccc26ad01ab48f'
          assert {r['group'] for r in o['reviews']}=={'side-gates','detail-contact','conditions'}
          assert o['passed'] is True
          for r in o['reviews']:
            assert r['independent_execution'] is True and r['passed'] is True
            assert r['review']['defects']==[] and r['review']['coverage_complete'] is True and r['review']['confidence']!='low'
            assert min(r['review']['scores'].values())>=9.0
          print(json.dumps({'passed':True,'groups':[r['group'] for r in o['reviews']],'completed_scores_retried':False}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: havenline-task03-visual-incomplete-retry-${{ github.run_id }}
          path: task03-review-retry/
          retention-days: 30
          if-no-files-found: error
# Retry 2 changes only the wrapper SHA-256 guard; the three missing groups are still the only scored work.
# This workflow does not rerun any completed visual-integrity score and does not alter game source.
