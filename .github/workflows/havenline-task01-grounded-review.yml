name: Havenline T01 grounded independent image review
on:
  push:
    branches: ['codex/havenline-sequential-task-01']
    paths: ['.github/workflows/havenline-task01-grounded-review.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  independent-critics:
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        role: [reference-fidelity, visual-integrity]
        shard: [0, 1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    env:
      REVIEW_ROLE: ${{ matrix.role }}
      REVIEW_SHARD: ${{ matrix.shard }}
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - run: git fetch --no-tags --depth=1 origin 8632c5b2c2a70ec1eb88db08bef8ca18b707e1a6
      - uses: actions/download-artifact@v4
        with:
          name: havenline-T01-recovered-evidence-34222185319
          run-id: 34222185319
          github-token: ${{ github.token }}
          path: task01-evidence/
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/havenline-t01-vision
          key: havenline-qwen3vl8b-f982a075-b10809-v1
          fail-on-cache-miss: true
      - run: python3 -m pip install pillow
      - name: Inspect actual images with adequate image-token detail and factual checks
        run: python3 -u tools/havenline/review_task01_grounded.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: havenline-T01-grounded-${{ matrix.role }}-${{ matrix.shard }}-${{ github.run_id }}
          path: critic-results/
          retention-days: 30
          if-no-files-found: error
  task-model-gate:
    needs: independent-critics
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: havenline-T01-grounded-*-${{ github.run_id }}
          path: reviews/
      - uses: actions/download-artifact@v4
        with:
          name: havenline-T01-recovered-evidence-34222185319
          run-id: 34222185319
          github-token: ${{ github.token }}
          path: evidence/
      - name: Validate source, all groups, raw scores, factual grounding and mechanical checks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,math
          source='8632c5b2c2a70ec1eb88db08bef8ca18b707e1a6';expected={'variant-1','variant-2','variant-3','forest','clearance','camera-motion'}
          keys={'silhouette','materials','reference_fidelity','integration','geometric_integrity'}
          expected_facts={'baseline_tree_blocks_central_player':False,'disabled_tree_blocks_central_player':True,'enabled_tree_blocks_central_player':False,'depleted_resource_tree_visible':False}
          errors=[];reviews=[];scores={}
          m=json.loads(Path('evidence/mechanical-review.json').read_text())
          if m['source']!=source or not m['passed']:errors.append('Mechanical/source checks not passing')
          for role in ('reference-fidelity','visual-integrity'):
              rows=[];shards=[]
              for path in Path('reviews').glob('*'+role+'*/shard-review.json'):
                  r=json.loads(path.read_text());shards.append(r['shard'])
                  if r['source']!=source or r['role']!=role:errors.append('Wrong source/role '+str(path))
                  for row in r.get('reviews',[]):
                      rows.append(row);label=role+'/'+row.get('group','missing')
                      value=row.get('review',{});s=value.get('scores',{})
                      if row.get('source')!=source or row.get('independent_execution') is not True or row.get('passed') is not True:errors.append('Not passing '+label)
                      if set(s)!=keys or any(type(v) not in (float,int) or not math.isfinite(v) or not 9<=v<=10 for v in s.values()):errors.append('Invalid/below-nine scores '+label)
                      if value.get('defects')!=[] or value.get('coverage_complete') is not True or value.get('confidence') not in ('medium','high'):errors.append('Defects, incomplete or low-confidence '+label)
                      try:
                          raw=json.loads((path.parent/(row['group']+'-raw.json')).read_text());choice=raw['choices'][0]
                          if choice['finish_reason']!='stop' or json.loads(choice['message']['content'])!=value:errors.append('Raw/scored response mismatch '+label)
                      except Exception as exc:errors.append('Missing/invalid raw '+label+': '+str(exc))
                      if row.get('group')=='clearance' and (row.get('factual_image_recognition_passed') is not True or value.get('evidence_facts')!=expected_facts):errors.append('Incorrect recognition of actual clearance states '+label)
              if set(shards)!={0,1,2} or len(shards)!=3 or len(rows)!=6 or {r.get('group') for r in rows}!=expected:errors.append('Incomplete/duplicate coverage '+role)
              scores[role]=min((r.get('lowest_score',0) for r in rows),default=None);reviews+=rows
          result={'task':'T01','source':source,'minimum_dimension_score':9,'target':10,'mechanical_and_critics_passed':not errors,'role_lowest_scores':scores,'reviews':reviews,'errors':errors,'prior_contradictory_reviews_preserved':True,'reviewer_configuration_repaired':True,'actual_final_pixel_verification_required':True,'task_approved':False,'task2_started':False,'full_game_approved':False,'physical_phone_tablet_4k60_verified':False}
          out=Path('gate-report');out.mkdir(exist_ok=True);(out/'T01-grounded-model-gate.json').write_text(json.dumps(result,indent=2)+'\n');print(json.dumps(result,indent=2))
          raise SystemExit(0 if not errors else 1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: havenline-T01-grounded-gate-${{ github.run_id }}
          path: gate-report/
          retention-days: 30
          if-no-files-found: error
# No geometry/evidence alterations, no lower score, no automatic progression, no APK.
