name: HAVENLINE global real-asset compatibility audit — unapproved T05 cooker
on:
  push:
    branches: ['havenline/global-asset-pipeline-integration-20261026']
    paths:
      - 'tools/havenline/asset_pipeline/capture_isolated_asset.gd'
      - '.github/workflows/havenline-global-t05-real-cooker-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: global-real-cooker-review-${{ github.sha }}
  cancel-in-progress: false
jobs:
  isolated-unapproved-real-art-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          lfs: false
      - name: Retrieve immutable R07 benchmark from separate T05 work, not shipping branch
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          run-id: 40346552132
          name: T05-Blender-cooker-candidate-dcb188147f2cde41dd4c02875e12c22131a99bcc
          path: global-real-cooker-review/source-r07
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify unapproved cooker source and material inventory
        run: |
          set -euo pipefail
          mkdir -p global-real-cooker-review/godot/assets global-real-cooker-review/evidence "$RUNNER_TEMP/hl-godot"
          glb=global-real-cooker-review/source-r07/t05-blender-evidence/T05_cooker_BLENDER_CANDIDATE.glb
          echo "ff9f548c2d16d1f5972b4da2f3162978e65e3caef20ec998ec222e9497cb3a0b  $glb" | sha256sum -c -
          cp "$glb" global-real-cooker-review/godot/assets/cooker_R07_UNAPPROVED.glb
          cp tools/havenline/asset_pipeline/capture_isolated_asset.gd global-real-cooker-review/godot/capture.gd
          cat > global-real-cooker-review/godot/project.godot <<'EOF'
          config_version=5
          [application]
          config/name="Havenline T05 Unapproved Cooker Isolated Review"
          [rendering]
          renderer/rendering_method="gl_compatibility"
          EOF
          python3 - <<'PY'
          import json,pathlib,struct
          p=pathlib.Path("global-real-cooker-review/godot/assets/cooker_R07_UNAPPROVED.glb")
          raw=p.read_bytes()
          length=struct.unpack_from("<I",raw,12)[0]
          g=json.loads(raw[20:20+length])
          material_names=[x.get("name") for x in g.get("materials",[])]
          assert len(material_names)==9 and len(set(material_names))==9
          assert len(g.get("images",[]))==4
          prims=[v for m in g.get("meshes",[]) for v in m.get("primitives",[])]
          assert len(prims)==9
          assert not any("normalTexture" in m or "occlusionTexture" in m for m in g.get("materials",[]))
          report={"status":"R07_NOT_VISUAL_APPROVED","reference":"18567.png",
                  "glb_sha256":"ff9f548c2d16d1f5972b4da2f3162978e65e3caef20ec998ec222e9497cb3a0b",
                  "materials":material_names,"primitive_count":len(prims),
                  "embedded_source_images":len(g.get("images",[])),
                  "normal_maps_embedded":False,"ao_maps_embedded":False,
                  "global_v1_baker_compatible":False}
          pathlib.Path("global-real-cooker-review/source-preflight.json").write_text(json.dumps(report,indent=2)+chr(10))
          print(json.dumps(report))
          PY
      - name: Install official Godot 4.7.2 without any Blender dependency
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable"
          curl -fL --retry 2 --connect-timeout 20 --max-time 240 "$base/Godot_v4.7.2-stable_linux.x86_64.zip" -o "$RUNNER_TEMP/hl-godot/godot.zip"
          unzip -q "$RUNNER_TEMP/hl-godot/godot.zip" -d "$RUNNER_TEMP/hl-godot"
          chmod +x "$RUNNER_TEMP/hl-godot/Godot_v4.7.2-stable_linux.x86_64"
          "$RUNNER_TEMP/hl-godot/Godot_v4.7.2-stable_linux.x86_64" --version
      - name: Capture real but unapproved T05 cooker in seven actual 4K Godot angles
        timeout-minutes: 14
        run: |
          set -euo pipefail
          editor="$RUNNER_TEMP/hl-godot/Godot_v4.7.2-stable_linux.x86_64"
          project="$PWD/global-real-cooker-review/godot"
          timeout 120 "$editor" --headless --editor --path "$project" --import --quit 2>&1 | tee global-real-cooker-review/godot-import.log
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo timeout 120 apt-get install -y --no-install-recommends xvfb
          fi
          timeout 660 xvfb-run -a "$editor" --path "$project" --rendering-method gl_compatibility --audio-driver Dummy --script res://capture.gd -- --glb=res://assets/cooker_R07_UNAPPROVED.glb --width=3840 --height=2160 --out="$PWD/global-real-cooker-review/evidence" --asset-id=cooker_R07_UNAPPROVED 2>&1 | tee global-real-cooker-review/godot-capture.log
          grep -q GLOBAL_ASSET_IMPORT_PROOF global-real-cooker-review/godot-capture.log
      - name: Independently check 4K frames, source hash and no inferred visual approval
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/hl-real-qa"
          "$RUNNER_TEMP/hl-real-qa/bin/pip" install --disable-pip-version-check pillow
          "$RUNNER_TEMP/hl-real-qa/bin/python" - <<'PY'
          import hashlib,json,pathlib
          from PIL import Image
          root=pathlib.Path("global-real-cooker-review")
          p=json.loads((root/"evidence/isolated-import.json").read_text())
          assert p["candidate_glb_sha256"]=="ff9f548c2d16d1f5972b4da2f3162978e65e3caef20ec998ec222e9497cb3a0b"
          assert p["shipping_scene_loaded"] is False and p["owner_reference_fidelity_approved"] is False
          assert p["actual_physical_android_tested"] is False
          assert p["native_capture_width"]==3840 and p["native_capture_height"]==2160
          shots=p["renders"]
          assert len(shots)==7 and len({v["view"] for v in shots})==7
          evidence=[]
          for v in shots:
              f=root/"evidence"/v["file"]
              with Image.open(f) as im:
                  assert im.format=="PNG" and im.size==(3840,2160)
                  diversity=len(set(im.convert("RGB").resize((160,90)).getdata()))
                  assert diversity>=25,f"Blank or frozen view {v['view']}"
              evidence.append({"view":v["view"],"sha256":hashlib.sha256(f.read_bytes()).hexdigest(),"sampled_rgb_colors":diversity})
          assert len({v["sha256"] for v in evidence})==7
          result={"status":"ISOLATED_REAL_COOKER_4K_TECHNICAL_REVIEW_NOT_STYLE_APPROVAL",
                  "source_id":"T05-R07-unapproved","reference":"18567.png",
                  "source_glb_sha256":p["candidate_glb_sha256"],
                  "renderer":p["renderer"],"capture_dimensions":[3840,2160],
                  "screenshots":evidence,"shipping_scene_loaded":False,
                  "reference_style_approved":False,"android_performance_tested":False}
          (root/"real-cooker-4k-audit.json").write_text(json.dumps(result,indent=2)+chr(10))
          print(json.dumps(result,indent=2))
          PY
      - name: Preserve unapproved real-asset evidence and logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: havenline-real-T05-R07-4k-technical-audit-${{ github.sha }}
          path: |
            global-real-cooker-review/source-preflight.json
            global-real-cooker-review/evidence/
            global-real-cooker-review/real-cooker-4k-audit.json
            global-real-cooker-review/godot-import.log
            global-real-cooker-review/godot-capture.log
          if-no-files-found: warn
          retention-days: 30
