name: Havenline lake Mobile precision correction check
on:
  push:
    branches: ['codex/havenline-sequential-task-01']
    paths: ['.github/workflows/havenline-lake-debanding.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - run: python3 -m pip install pyyaml
      - name: Render identical lake with Mobile material and viewport debanding
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import yaml,subprocess
          p=Path('HavenlineGodot/tests/probe_lake_fog_precision.gd');s=p.read_text()
          a=s.index('\tvar variants=');b=s.index('\tvar file=',a)
          s=s[:a]+'''\tRenderingServer.material_set_use_debanding(true)
          \tawait stable_snap("material-debanding")
          \tgame.scene_view.use_debanding=true
          \tawait stable_snap("material-and-viewport-debanding")
          \tRenderingServer.material_set_use_debanding(false)
          \tawait stable_snap("viewport-debanding-only")
          '''+s[b:]
          p.write_text(s)
          w=yaml.safe_load(Path('.github/workflows/havenline-lake-shading-diagnostic.yml').read_text())
          runs=[s['run'] for s in w['jobs']['diagnose']['steps'] if 'run' in s];assert len(runs)==1
          run=runs[0].replace('res://tests/probe_lake_shading.gd','res://tests/probe_lake_fog_precision.gd').replace('timeout 180','timeout 240')
          Path('diagnosis').mkdir(exist_ok=True);Path('diagnosis/executed.sh').write_text(run)
          subprocess.run(['bash','-euo','pipefail','-c',run],check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: havenline-lake-debanding-${{ github.run_id }}
          path: diagnosis/
          retention-days: 30
          if-no-files-found: error
# Real Mobile output; identical geometry, camera and light levels. No art approval.
