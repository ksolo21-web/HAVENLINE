name: Havenline public vision runtime metadata
on:
  push:
    branches: ['codex/havenline-sequential-task-01']
    paths: ['.github/workflows/havenline-review-runtime-discovery.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Discover publisher-operated public multimodal demos without sending images or inference
        run: |
          mkdir -p runtime-metadata
          python3 - <<'PY'
          import urllib.request,urllib.parse,json,concurrent.futures
          from pathlib import Path
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Havenline-runtime-capability-check'})
              with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          out={'task':'T02','purpose':'Metadata-only check for a faster independent visual reviewer; current CPU reviews continue','inference_requested':False,'images_uploaded':False,'paid_usage_enabled':False,'task_approved':False,'spaces':[],'errors':[]}
          try:
              spaces=get('https://huggingface.co/api/spaces?author=Qwen&limit=100')
              ids=[x['id'] for x in spaces if not x.get('private',False) and ('VL' in x['id'] or '3.5' in x['id'] or 'Omni' in x['id'])]
              out['matching_public_spaces']=ids
              def inspect(id):
                  try:
                      data=get('https://huggingface.co/api/spaces/'+id)
                      record={'id':id,'private':data.get('private'),'runtime':data.get('runtime'),'host':data.get('host'),'sdk':data.get('sdk'),'sha':data.get('sha')}
                      host=data.get('host')
                      if host and data.get('private') is False:
                          if not host.startswith('https://'):host='https://'+host
                          if urllib.parse.urlparse(host).hostname.endswith('.hf.space'):
                              try:
                                  c=get(host+'/config')
                                  record['config']={'version':c.get('version'),'enable_queue':c.get('enable_queue'),'auth_required':c.get('auth_required'),'api_prefix':c.get('api_prefix'),'dependencies':[{'id':d.get('id'),'api_name':d.get('api_name'),'inputs':d.get('inputs'),'outputs':d.get('outputs'),'backend_fn':d.get('backend_fn')} for d in c.get('dependencies',[])],'components':[{'id':x.get('id'),'type':x.get('type'),'label':x.get('props',{}).get('label')} for x in c.get('components',[])]}
                              except Exception as e:record['config_error']=str(e)
                      return record
                  except Exception as e:return {'id':id,'error':str(e)}
              with concurrent.futures.ThreadPoolExecutor(max_workers=5) as pool:out['spaces']=list(pool.map(inspect,ids[:15]))
          except Exception as e:out['errors'].append(str(e))
          Path('runtime-metadata/capabilities.json').write_text(json.dumps(out,indent=2));print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: havenline-public-vision-metadata-${{ github.run_id }}
          path: runtime-metadata/
          retention-days: 14
          if-no-files-found: error
# No account credentials, model inference, image upload, billing change or game mutation.
