name: Havenline source-bound 8B visual critic
on:
  push:
    branches: ['codex/havenline-visual-critic']
    paths: ['.github/workflows/havenline-vision-critic-v2.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-actual-captures:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      EXPECTED_SOURCE: '25d314424ea4b98d82fe8c13a08f4c21bfc8bec0'
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image decoder
        run: python3 -m pip install 'pillow==11.3.0'
      - name: Review exact revised screenshots with a separate vision model
        run: python3 -u tools/havenline/run_environment_vision_critic.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: havenline-independent-critic-v2
          path: critic-results-v2/
          retention-days: 30
          if-no-files-found: warn
