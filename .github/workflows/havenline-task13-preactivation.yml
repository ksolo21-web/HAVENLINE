name: Havenline T13 Preactivation Readiness

on:
  pull_request:
    branches:
      - codex/havenline-sequential-task-01
    paths:
      - 'Docs/Production/T13/**'
      - 'tools/havenline/task13/**'
      - '.github/workflows/havenline-task13-preactivation.yml'
  push:
    paths:
      - 'Docs/Production/T13/**'
      - 'tools/havenline/task13/**'
      - '.github/workflows/havenline-task13-preactivation.yml'

jobs:
  t13-preactivation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile T13 preactivation tools
        run: |
          python3 -m py_compile tools/havenline/task13/prepare_activation.py
          python3 -m py_compile tools/havenline/task13/validate_preactivation.py

      - name: Validate T13 package and current contracts
        run: python3 tools/havenline/task13/validate_preactivation.py

      - name: Validate T13 preparation state
        run: python3 tools/havenline/task13/prepare_activation.py --task T13

      - name: Prove dependency lock remains fail-closed
        shell: bash
        run: |
          set +e
          python3 tools/havenline/task13/prepare_activation.py --task T13 --activate --base "$(git rev-parse HEAD)"
          rc=$?
          set -e
          T12_APPROVED=$(python3 - <<'PY'
import json
from pathlib import Path
root=Path("Docs/Production")
g=json.loads((root/"DEPENDENCY_GRAPH.json").read_text())
t=json.loads((root/"task-gates.json").read_text())
print("1" if g.get("tasks",{}).get("T12",{}).get("status")=="APPROVED" and "T12" in t.get("approved_tasks",[]) else "0")
PY
)
          if [ "$T12_APPROVED" = "1" ]; then
            if [ "$rc" -ne 0 ]; then
              echo "T12 is approved; T13 activation preflight should no longer fail on dependency state."
              exit 1
            fi
          else
            if [ "$rc" -eq 0 ]; then
              echo "T12 is not approved; T13 activation preflight must fail closed."
              exit 1
            fi
          fi
