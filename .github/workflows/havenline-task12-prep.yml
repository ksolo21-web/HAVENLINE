name: Havenline T12 preparation gate

on:
  push:
    branches:
      - havenline/governance-t12-prep
    paths:
      - 'Docs/Production/T12/**'
      - 'tools/havenline/task12/**'
      - '.github/workflows/havenline-task12-prep.yml'
  pull_request:
    paths:
      - 'Docs/Production/T12/**'
      - 'tools/havenline/task12/**'
      - '.github/workflows/havenline-task12-prep.yml'

jobs:
  validate-t12-preparation:
    name: Validate T12 dependency-safe preparation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile T12 preparation tools
        run: |
          python -m py_compile tools/havenline/task12/prepare_activation.py
          python -m py_compile tools/havenline/task12/validate_progression_contract.py
          python -m py_compile tools/havenline/task12/validate_level_matrix.py
          python -m py_compile tools/havenline/task12/verify_binding_resolution.py
          python -m py_compile tools/havenline/task12/validate_runtime_interface.py
          python -m py_compile tools/havenline/task12/validate_traceability.py
          python -m py_compile tools/havenline/task12/validate_downstream_contract.py
          python -m py_compile tools/havenline/task12/validate_data_schema.py
          python -m py_compile tools/havenline/task12/reference_progression_oracle.py
          python -m py_compile tools/havenline/task12/compare_engine_parity.py
          python -m py_compile tools/havenline/task12/validate_candidate_evidence.py
          python -m py_compile tools/havenline/task12/initialize_candidate_evidence.py
          python -m py_compile tools/havenline/task12/validate_critic_review_records.py
          python -m py_compile tools/havenline/task12/validate_evidence_index.py
          python -m py_compile tools/havenline/task12/final_candidate_gate.py
          python -m py_compile tools/havenline/task12/fuzz_progression_contract.py
          python -m py_compile tools/havenline/task12/benchmark_prebuild_validators.py
          python -m py_compile tools/havenline/task12/validator_bundle.py
          python -m py_compile tools/havenline/task12/materialize_progression_data.py
          python -m py_compile tools/havenline/task12/validate_authoring_blueprint.py
          python -m py_compile tools/havenline/task12/validate_fact_slot_binding_index.py
          python -m py_compile tools/havenline/task12/reference_progression_engine.py
          python -m py_compile tools/havenline/task12/validate_reference_runtime_semantics.py

      - name: Validate T12 JSON artifacts
        run: |
          python -m json.tool Docs/Production/T12/ACTIVATION_CHECKLIST.json >/dev/null
          python -m json.tool Docs/Production/T12/PREBUILD_CONTRACT.json >/dev/null
          python -m json.tool Docs/Production/T12/UPSTREAM_BINDINGS.json >/dev/null
          python -m json.tool Docs/Production/T12/LEVEL_1_100_MATRIX.json >/dev/null
          python -m json.tool Docs/Production/T12/BINDING_RESOLUTION_TEMPLATE.json >/dev/null
          python -m json.tool Docs/Production/T12/RUNTIME_INTERFACE_CONTRACT.json >/dev/null
          python -m json.tool Docs/Production/T12/ACCEPTANCE_TRACEABILITY.json >/dev/null
          python -m json.tool Docs/Production/T12/DOWNSTREAM_CONSUMER_CONTRACT.json >/dev/null
          python -m json.tool Docs/Production/T12/PROGRESSION_DATA_SCHEMA.json >/dev/null
          python -m json.tool Docs/Production/T12/PREBUILD_PERFORMANCE_BUDGET.json >/dev/null
          python -m json.tool Docs/Production/T12/ENGINE_TEST_VECTORS.json >/dev/null
          python -m json.tool Docs/Production/T12/ENGINE_PARITY_OUTPUT_SCHEMA.json >/dev/null
          python -m json.tool Docs/Production/T12/CANDIDATE_EVIDENCE_TEMPLATE.json >/dev/null
          python -m json.tool Docs/Production/T12/CRITIC_REVIEW_RECORD_TEMPLATE.json >/dev/null
          python -m json.tool Docs/Production/T12/EVIDENCE_INDEX_TEMPLATE.json >/dev/null
          python -m json.tool Docs/Production/T12/defect-ledger.json >/dev/null
          python -m json.tool Docs/Production/T12/AUTHORING_BLUEPRINT.json >/dev/null
          python -m json.tool Docs/Production/T12/BINDING_SLOT_CATALOG.json >/dev/null
          python -m json.tool Docs/Production/T12/FACT_SLOT_BINDING_INDEX_TEMPLATE.json >/dev/null
          python -m json.tool Docs/Production/T12/FULL_ENGINE_VECTOR_CORPUS.json >/dev/null
          python -m json.tool Docs/Production/T12/REFERENCE_RUNTIME_SEMANTICS.json >/dev/null

      - name: Validate T12 preparation contract
        run: python tools/havenline/task12/prepare_activation.py

      - name: Validate concrete non-shipping Level 1-100 matrix
        run: python tools/havenline/task12/validate_level_matrix.py

      - name: Verify upstream resolution remains blank before activation
        run: python tools/havenline/task12/verify_binding_resolution.py

      - name: Validate 100-level authoring blueprint and fact slots
        run: python tools/havenline/task12/validate_authoring_blueprint.py

      - name: Validate 99-slot binding-index template
        run: python tools/havenline/task12/validate_fact_slot_binding_index.py

      - name: Dry-run materialize full shipping-shaped progression data
        run: python tools/havenline/task12/materialize_progression_data.py

      - name: Validate full 398-vector Level 1-100 oracle corpus
        run: python tools/havenline/task12/reference_progression_oracle.py --input Docs/Production/T12/FULL_ENGINE_VECTOR_CORPUS.json

      - name: Validate reference runtime transition semantics
        run: python tools/havenline/task12/validate_reference_runtime_semantics.py

      - name: Validate prepared T12 runtime interface and authority boundaries
        run: python tools/havenline/task12/validate_runtime_interface.py

      - name: Validate R01-R16 acceptance traceability coverage
        run: python tools/havenline/task12/validate_traceability.py

      - name: Validate downstream consumer boundaries
        run: python tools/havenline/task12/validate_downstream_contract.py

      - name: Validate future shipping-data schema contract
        run: python tools/havenline/task12/validate_data_schema.py

      - name: Validate non-shipping engine parity vectors
        run: python tools/havenline/task12/reference_progression_oracle.py

      - name: Validate future candidate evidence packet template
        run: python tools/havenline/task12/validate_candidate_evidence.py

      - name: Validate per-dimension critic review template
        run: python tools/havenline/task12/validate_critic_review_records.py

      - name: Validate complete evidence digest index template
        run: python tools/havenline/task12/validate_evidence_index.py

      - name: Fuzz T12 progression contract fail-closed behavior
        run: python tools/havenline/task12/fuzz_progression_contract.py

      - name: Benchmark complete T12 prebuild validation surface
        run: python tools/havenline/task12/benchmark_prebuild_validators.py

      - name: Run T12 progression/preparation unit tests
        run: python -m unittest discover -s tools/havenline/task12/tests -p 'test_*.py' -v

      - name: Prove activation stays closed before T11 closeout and binding resolution
        shell: bash
        run: |
          set +e
          python tools/havenline/task12/prepare_activation.py --activate --base "$(git rev-parse HEAD)" > /tmp/t12-activation.json 2>&1
          status=$?
          cat /tmp/t12-activation.json
          if [ "$status" -eq 0 ]; then
            echo "ERROR: T12 activation unexpectedly passed before all dependencies are approved/integrated."
            exit 1
          fi
          grep -Eq 'T11|binding reconciliation|dependency' /tmp/t12-activation.json

      - name: Confirm shipping T12 runtime is still absent
        run: |
          test ! -e HavenlineGodot/scripts/progression_architecture.gd
          test ! -e HavenlineGodot/data/progression_levels_v1.json
          test ! -e HavenlineGodot/data/progression_milestones_v1.json
          test ! -e HavenlineGodot/data/progression_bindings_v1.json
