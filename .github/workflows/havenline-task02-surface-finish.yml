name: Havenline T02 reference-colored surfaces and verified dry routes
on:
  push:
    branches: ['codex/havenline-sequential-task-01']
    paths: ['.github/workflows/havenline-task02-surface-finish.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - run: python3 -m pip install pyyaml
      - name: Verify the uniform reference finish and capture the actual new revision
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import yaml,subprocess,json
          workflow=yaml.safe_load(Path('.github/workflows/havenline-task02.yml').read_text())
          runs=[s['run'] for s in workflow['jobs']['terrain-build']['steps'] if 'run' in s]
          assert len(runs)==5
          runs[0]+='\nexport PATH="$RUNNER_TEMP/engine:$PATH"\n'
          # The connection was already applied and tested in c2ad2b1. Never
          # reapply its historical installer over the newer reviewed material.
          runs[2]=runs[2].replace('test_task02_terrain;','test_task02_terrain test_task02_surface_stress;').replace('len(rows)==12','len(rows)==13').replace('705','723')
          runs[4]=runs[4].replace("(3 if name=='native4k' else 24)","(6 if name=='native4k' else 24)").replace("'tests':705","'tests':723")
          script='\n'.join(runs)
          e=Path('task02-evidence');e.mkdir(exist_ok=True);(e/'executed-build.sh').write_text(script)
          subprocess.run(['bash','-euo','pipefail','-c',script],check=True)
          for name in ('reference-ground.webp','reference-ground-provenance.json'):
              (e/name).write_bytes((Path('Docs/Production/T02')/name).read_bytes())
          note={'task':'T02','revision':'uniform-reference-finish','prior_source':'c2ad2b101d863d238342adfa32204faf7d227c07','prior_review_run':34506698944,'changes':['Remove actual sine-based workfloor mottling and edge dirt','Use a clean brighter blue-white snow material without procedural color mottling','Preserve the repaired shoreline, water surface, widened connection and verified dry route','Retain all 33 GLBs, shipping camera and approved forest shader/placement'],'tests':723,'task_approved':False,'physical_4k60_verified':False}
          (e/'revision.json').write_text(json.dumps(note,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: havenline-T02-finished-surface-evidence-${{ github.run_id }}
          path: task02-evidence/
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: havenline-T02-finished-surface-source-${{ github.run_id }}
          path: source-snapshot/
          retention-days: 30
          if-no-files-found: error
# Fix actual critic-identified materials; do not change the score, model or task scope.
# No T03, production APK handoff or physical-FPS claim.
