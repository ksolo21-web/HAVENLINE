name: Havenline T03 iteration-7 focused visual critics
on:
  push:
    branches: ['codex/havenline-sequential-task-01']
    paths:
      - '.github/workflows/havenline-task03-iteration7-focused-critics.yml'
      - 'tools/havenline/production/review_t03_iteration7_visual_group.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  CANDIDATE: '7f596a136ac1216297257fc78aa598e96e7efd95'
  EVIDENCE_RUN: '35867086277'
  EVIDENCE_ARTIFACT: 'havenline-t03-reference-repair-35867086277'

jobs:
  review:
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        critic: [C1, C2]
        group: [palisade, north-work-gates, river-gates, lanes, conditions]
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove reviewer tooling did not change exact candidate runtime
        run: git diff --exit-code "$CANDIDATE" HEAD -- HavenlineGodot
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.EVIDENCE_RUN }}
          name: ${{ env.EVIDENCE_ARTIFACT }}
          path: task03-evidence
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/havenline-t01-qwen35
          key: havenline-t01-qwen35-9b-q5-20260908-v1
          fail-on-cache-miss: true
      - run: python3 -m pip install pillow
      - name: Execute focused source-bound visual critic
        env:
          EXPECTED_SOURCE: ${{ env.CANDIDATE }}
          CRITIC_ID: ${{ matrix.critic }}
          GROUP_NAME: ${{ matrix.group }}
          EVIDENCE_ROOT: task03-evidence
          OUT_DIR: task03-${{ matrix.critic }}-${{ matrix.group }}
        run: python3 -u tools/havenline/production/review_t03_iteration7_visual_group.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: havenline-t03-iteration7-${{ matrix.critic }}-${{ matrix.group }}-${{ github.run_id }}
          path: task03-${{ matrix.critic }}-${{ matrix.group }}/
          retention-days: 30
          if-no-files-found: error

  aggregate:
    needs: review
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: havenline-t03-iteration7-*-${{ github.run_id }}
          path: reviews
      - name: Aggregate C1 and C2 without averaging or cross-domain invalidation
        env:
          CANDIDATE: ${{ env.CANDIDATE }}
        run: |
          python3 - <<'PY'
          import json,math,os,pathlib
          root=pathlib.Path('reviews');out=pathlib.Path('aggregate');out.mkdir()
          candidate=os.environ['CANDIDATE']
          groups={'palisade','north-work-gates','river-gates','lanes','conditions'}
          final={}
          for cid,dims in {
            'C1':['reference_fidelity','visual_language','cross_view_consistency'],
            'C2':['geometry_contact','clipping_seams','intentional_gap_integrity','cross_view_integrity']
          }.items():
            rows=[]
            for p in root.rglob('critic-record.json'):
              d=json.loads(p.read_text())
              if d.get('critic_id')==cid:rows.append(d)
            errors=[]
            got={r.get('group') for r in rows}
            if len(rows)!=5:errors.append(f'{cid} expected 5 group records got {len(rows)}')
            if got!=groups:errors.append(f'{cid} group coverage {sorted(got)}')
            for r in rows:
              if r.get('candidate_hash')!=candidate:errors.append(f"{cid}/{r.get('group')} candidate mismatch")
              if r.get('passed') is not True:errors.append(f"{cid}/{r.get('group')} failed")
              if r.get('defects')!=[]:errors.append(f"{cid}/{r.get('group')} unresolved defect")
              if r.get('coverage_complete') is not True:errors.append(f"{cid}/{r.get('group')} incomplete")
              if r.get('target_visible') is not True:errors.append(f"{cid}/{r.get('group')} target not identified")
            scores={k:min((r.get('scores',{}).get(k,0) for r in rows),default=0) for k in dims}
            defects=[f"{r.get('group')}: {x}" for r in rows for x in r.get('defects',[])]
            if cid=='C1':
              if scores['reference_fidelity']!=10.0:errors.append('C1 reference_fidelity !=10')
              if scores['visual_language']!=10.0:errors.append('C1 visual_language !=10')
              if scores['cross_view_consistency']<=9.0:errors.append('C1 cross_view_consistency <=9')
            elif any(not isinstance(v,(int,float)) or isinstance(v,bool) or not math.isfinite(v) or v<=9.0 for v in scores.values()):
              errors.append('C2 dimension <=9')
            record={'task_id':'T03','critic_id':cid,'candidate_hash':candidate,'groups':rows,'scores':scores,'defects':defects,'coverage_complete':len(rows)==5 and all(r.get('coverage_complete') is True for r in rows),'no_score_averaging':True,'passed':not errors,'errors':errors}
            (out/(cid+'-critic-record.json')).write_text(json.dumps(record,indent=2)+'\n');final[cid]=record
          summary={'task_id':'T03','candidate':candidate,'c6_preserved_from_iteration6':True,'c6_source_metrics_unchanged_by_iteration7':True,'passed':all(v['passed'] for v in final.values()),'critics':{k:{'scores':v['scores'],'defects':v['defects'],'errors':v['errors'],'passed':v['passed']} for k,v in final.items()},'user_visual_signoff_required':True,'task_approved':False}
          (out/'summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          print(json.dumps(summary,indent=2))
          raise SystemExit(0 if summary['passed'] else 1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: havenline-t03-iteration7-visual-aggregate-${{ github.run_id }}
          path: aggregate/
          retention-days: 30
          if-no-files-found: error
# Critic-specific invalidation: C6 remains preserved because iteration 7 changes transforms only, not mesh/material/batch/physics/population.
