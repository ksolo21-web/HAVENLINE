name: Havenline Task 8 visible inventory candidate

on:
  push:
    branches: ['havenline/T08-visible-inventory', 'codex/havenline-sequential-task-01']
    paths:
      - 'HavenlineGodot/scripts/carry_stack.gd'
      - 'HavenlineGodot/scripts/storage_stockpile.gd'
      - 'HavenlineGodot/scripts/transfer_feedback.gd'
      - 'HavenlineGodot/scripts/main.gd'
      - 'HavenlineGodot/tests/test_task08_*.gd'
      - 'HavenlineGodot/tests/capture_task08_inventory.gd'
      - 'Docs/Production/T08/**'
      - 'tools/havenline/task08/**'
      - '.github/workflows/havenline-task08-*.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: havenline-task08-inventory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-capture:
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name != 'codex/havenline-sequential-task-01' || !contains(github.event.head_commit.message, '[governance-only]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prepare pinned Godot and evidence dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb mesa-vulkan-drivers ffmpeg
          python3 -m pip install --disable-pip-version-check pillow
          mkdir -p "$RUNNER_TEMP/engine" task08-evidence/tests task08-evidence/matrices task08-evidence/captures task08-evidence/native4k task08-evidence/video
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o "$RUNNER_TEMP/engine/engine.zip"
          (cd "$RUNNER_TEMP/engine"; echo '9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65  engine.zip' | sha512sum -c -; unzip -q engine.zip; chmod +x Godot_v4.7.2-stable_linux.x86_64)
          echo "$RUNNER_TEMP/engine" >> "$GITHUB_PATH"

      - name: Verify ownership and source contracts
        env:
          CANDIDATE: ${{ github.sha }}
        run: |
          set -euo pipefail
          integration=$(git rev-parse origin/codex/havenline-sequential-task-01)
          if [ "$GITHUB_REF_NAME" != 'codex/havenline-sequential-task-01' ]; then
            python3 tools/havenline/production/workstream.py validate-candidate T08 --base c4e4e73108406d951c1635df20e10ac9208526af --head "$CANDIDATE" --integration-head "$integration" | tee task08-evidence/candidate-scope.json
          fi
          python3 tools/havenline/task08/validate_inventory.py --candidate "$CANDIDATE" --output task08-evidence/source-contract.json
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          manifest={'task_id':'T08','candidate_commit':os.environ['CANDIDATE'],'resource_actor_contract':{
            'introduced_resource_ids':[],'resource_ids_covered':['wood','stone','metal','fuel'],
            'actor_keys_covered':['player_lead','core_human_companion','rescued_survivor_helper'],
            'animation_profiles_covered':[],'animation_delta':False}}
          Path('task08-evidence/candidate-manifest.json').write_text(json.dumps(manifest,indent=2))
          matrix=json.loads(Path('Docs/Production/CRITIC_MATRIX.json').read_text())
          required=matrix['task_applicability']['T08']; assert required==['C2','C3','C4','C6'],required
          Path('task08-evidence/critic-requirements.json').write_text(json.dumps({'task':'T08','required':required},indent=2))
          PY
          python3 tools/havenline/production/resource_actor_contract.py --task T08 --manifest task08-evidence/candidate-manifest.json --output task08-evidence/resource-actor-contract.json

      - name: Import and run T01 through T08 regression
        run: |
          set -euo pipefail
          python3 tools/havenline/bake_outpost_audio.py > task08-evidence/tests/audio-fixture.json
          timeout 240 Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path HavenlineGodot --import --quit > task08-evidence/tests/import.log 2>&1
          timeout 120 Godot_v4.7.2-stable_linux.x86_64 --headless --path HavenlineGodot --script res://tools/bake_crew_motion.gd > task08-evidence/tests/motion-fixture.log 2>&1
          for suite in test_simulation test_crew_and_persistence test_motion_and_performance test_population test_outpost test_outpost_runtime test_environment test_render_budget test_adaptive_devices test_reference_forest test_reference_forest_acceptance test_task02_terrain test_task02_surface_stress test_lake_east_west test_task02_river test_task03_boundary test_task04_camera test_task05_station_kit test_task06_character1 test_task07_context_director test_task07_integration test_task08_inventory test_task08_integration; do
            timeout 300 Godot_v4.7.2-stable_linux.x86_64 --headless --audio-driver Dummy --path HavenlineGodot --script "res://tests/$suite.gd" > "task08-evidence/tests/$suite.log" 2>&1
          done
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:|ObjectDB instances were leaked' task08-evidence/tests/*.log; then exit 1; fi
          python3 - <<'PY'
          from pathlib import Path
          import json,os
          rows=[]
          for path in sorted(Path('task08-evidence/tests').glob('test_*.log')):
              reports=[json.loads(line) for line in path.read_text().splitlines() if line.startswith('{')]
              assert reports,path
              report=reports[-1]; assert report.get('passed') is True and not report.get('failures'),(path,report.get('failures'))
              checks=report.get('checks',[])
              rows.append({'suite':path.stem,'checks':len(checks) if isinstance(checks,list) else int(checks),'passed':True})
          total=sum(row['checks'] for row in rows)
          assert len(rows)==23 and total>=1510,(len(rows),total)
          out={'task':'T08-visible-inventory-v1','source':os.environ['GITHUB_SHA'],'suite_count':len(rows),'total_checks':total,'suites':rows,'all_passed':True,'task_approved':False}
          Path('task08-evidence/tests.json').write_text(json.dumps(out,indent=2)); print(json.dumps(out))
          PY
          python3 tools/havenline/task08/performance_gate.py --log task08-evidence/tests/test_task08_inventory.log --candidate "$GITHUB_SHA" --output task08-evidence/performance.json

      - name: Run save and adaptive-device matrices
        env:
          GODOT_BIN: Godot_v4.7.2-stable_linux.x86_64
        run: |
          set -euo pipefail
          HAVENLINE_T08_MATRIX_MODE=save python3 tools/havenline/production/save_state_matrix.py --candidate "$GITHUB_SHA" --task T08 --adapter 'bash tools/havenline/task08/run_matrix_case.sh' --out task08-evidence/matrices/save
          HAVENLINE_T08_MATRIX_MODE=device python3 tools/havenline/production/device_matrix.py --candidate "$GITHUB_SHA" --task T08 --adapter 'bash tools/havenline/task08/run_matrix_case.sh' --out task08-evidence/matrices/device

      - name: Capture physical inventory and transfer evidence
        env:
          CANDIDATE: ${{ github.sha }}
        run: |
          set -euo pipefail
          export VK_ICD_FILENAMES=$(find /usr/share/vulkan/icd.d -name '*lvp*json' | head -1); test -n "$VK_ICD_FILENAMES"
          extra=(); if [ "$GITHUB_REF_NAME" = 'codex/havenline-sequential-task-01' ]; then extra+=(--integrated); fi
          mkdir -p task08-evidence/captures/sequence
          xvfb-run -a -s '-screen 0 1280x720x24' timeout 900 Godot_v4.7.2-stable_linux.x86_64 --path HavenlineGodot --rendering-method mobile --rendering-driver vulkan --audio-driver Dummy --resolution 1280x720 --script res://tests/capture_task08_inventory.gd -- --candidate="$CANDIDATE" --state=sequence --device=review_16_9 --view=front --out="$(pwd)/task08-evidence/captures/sequence" "${extra[@]}" > task08-evidence/captures/sequence.log 2>&1
          for view in front side left rear three-quarter overhead; do
            mkdir -p "task08-evidence/captures/view-$view"
            xvfb-run -a -s '-screen 0 1280x720x24' timeout 600 Godot_v4.7.2-stable_linux.x86_64 --path HavenlineGodot --rendering-method mobile --rendering-driver vulkan --audio-driver Dummy --resolution 1280x720 --script res://tests/capture_task08_inventory.gd -- --candidate="$CANDIDATE" --state=carrying --device=review_16_9 --view="$view" --out="$(pwd)/task08-evidence/captures/view-$view" "${extra[@]}" > "task08-evidence/captures/view-$view.log" 2>&1
          done
          mkdir -p task08-evidence/captures/detail
          xvfb-run -a -s '-screen 0 1280x720x24' timeout 600 Godot_v4.7.2-stable_linux.x86_64 --path HavenlineGodot --rendering-method mobile --rendering-driver vulkan --audio-driver Dummy --resolution 1280x720 --script res://tests/capture_task08_inventory.gd -- --candidate="$CANDIDATE" --state=transfer --device=review_16_9 --view=three-quarter --scenario=furnace-detail --out="$(pwd)/task08-evidence/captures/detail" "${extra[@]}" > task08-evidence/captures/detail.log 2>&1
          while read -r id width height; do
            mkdir -p "task08-evidence/captures/device-$id"
            xvfb-run -a -s "-screen 0 ${width}x${height}x24" timeout 600 Godot_v4.7.2-stable_linux.x86_64 --path HavenlineGodot --rendering-method mobile --rendering-driver vulkan --audio-driver Dummy --resolution "${width}x${height}" --script res://tests/capture_task08_inventory.gd -- --candidate="$CANDIDATE" --state=carrying --device="$id" --view=front --out="$(pwd)/task08-evidence/captures/device-$id" "${extra[@]}" > "task08-evidence/captures/device-$id.log" 2>&1
          done <<'EOF'
          phone_16_9 2400 1080
          phone_20_9 2400 1080
          tablet_16_10 2560 1600
          tablet_4_3 2732 2048
          foldable_outer 2520 1080
          foldable_inner 2208 1768
          EOF
          xvfb-run -a -s '-screen 0 3840x2160x24' timeout 900 Godot_v4.7.2-stable_linux.x86_64 --path HavenlineGodot --rendering-method mobile --rendering-driver vulkan --audio-driver Dummy --resolution 3840x2160 --script res://tests/capture_task08_inventory.gd -- --candidate="$CANDIDATE" --state=carrying --device=native4k --view=front --native-4k --out="$(pwd)/task08-evidence/native4k" "${extra[@]}" > task08-evidence/native4k.log 2>&1
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:' task08-evidence/captures/*.log task08-evidence/native4k.log; then exit 1; fi
          ffmpeg -hide_banner -loglevel error -framerate 20 -i task08-evidence/captures/sequence/frames/frame-%05d.jpg -c:v libx264 -preset veryfast -crf 20 -pix_fmt yuv420p -movflags +faststart task08-evidence/video/resource-loop.mp4

      - name: Enforce capture provenance, conservation and content
        env:
          CANDIDATE: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageStat
          import hashlib,json,os
          root=Path('task08-evidence'); manifests=list((root/'captures').glob('*/capture.json'))+[root/'native4k/capture.json']
          assert len(manifests)==15,len(manifests)
          hashes=set(); images=[]
          for path in manifests:
              report=json.loads(path.read_text()); assert report['task']=='T08-visible-inventory-v1'
              assert report['candidate_commit']==os.environ['CANDIDATE'] and report['shipping_main_scene_rendered'] is True
              assert report['conservation_held'] is True and report['permanent_action_buttons']==0
              assert report['movement_control']=='one_primary_joystick' and report['qa_evidence_banner_present'] is False
              assert report['player_stack']['logical_total']==sum(report['trace'][-1]['inventory'].values()) and report['player_stack']['visible_instances']<=48
              assert report['helper_stack']['visible_instances']<=48 and report['stockpile']['visible_instances']<=48
              assert report['transfers']['active_flights']<=48 and report['physical_device_native_4k60_certified'] is False
              w,h=report['window']; assert report['game_rect']==[0.0,0.0,w,h]
              for rect in report['layout_rects'].values():
                  x,y,rw,rh=rect; assert x>=0 and y>=0 and x+rw<=w+0.01 and y+rh<=h+0.01,(path,rect)
              if path.parent.name=='native4k': assert report['native_3840x2160_scale1'] is True
              for image_path in path.parent.glob('*.png'):
                  image=Image.open(image_path).convert('RGB'); assert image.size==tuple(report['window'])
                  assert max(ImageStat.Stat(image).stddev)>=10.0
                  digest=hashlib.sha256(image_path.read_bytes()).hexdigest(); assert digest not in hashes,image_path
                  hashes.add(digest); images.append(str(image_path))
          sequence=json.loads((root/'captures/sequence/capture.json').read_text())
          assert len(sequence['trace'])==180 and len(list((root/'captures/sequence/frames').glob('*.jpg')))==60
          final=sequence['transfers']; assert final['accepted_receipts']==4 and final['completed_receipts']==4 and final['rejected_receipts']==0,final
          directions={flight['direction'] for row in sequence['trace'] for flight in row['transfers']['flights']}
          assert directions=={'source_to_actor','actor_to_destination'},directions
          assert (root/'video/resource-loop.mp4').stat().st_size>10000 and len(images)>=20,len(images)
          result={'task':'T08','candidate_commit':os.environ['CANDIDATE'],'manifest_count':len(manifests),'png_count':len(images),'unique_png_hashes':len(hashes),'sequence_frames':60,'transfer_directions':sorted(directions),'conservation_held':True,'passed':True}
          (root/'capture-gate.json').write_text(json.dumps(result,indent=2)); print(json.dumps(result))
          PY

      - name: Enforce integrated scene performance bounds
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,os,statistics
          rows=json.loads(Path('task08-evidence/captures/sequence/capture.json').read_text())['trace']
          baseline=rows[:12]; active=[row for row in rows if row['transfers']['active_flights']>0]
          assert baseline and active
          def mean(rows,key): return statistics.fmean(float(row[key]) for row in rows)
          before={k:mean(baseline,k) for k in ('frame_usec','draw_calls','primitives')}
          during={k:mean(active,k) for k in before}; delta={k:during[k]-before[k] for k in before}
          budgets={'absolute_frame_usec_delta':8000.0,'absolute_draw_call_delta':16.0,'absolute_primitive_delta':400000.0}
          failures=[]
          if abs(delta['frame_usec'])>budgets['absolute_frame_usec_delta']: failures.append('frame delta')
          if abs(delta['draw_calls'])>budgets['absolute_draw_call_delta']: failures.append('draw-call delta')
          if abs(delta['primitives'])>budgets['absolute_primitive_delta']: failures.append('primitive delta')
          out={'task':'T08','candidate_commit':os.environ['GITHUB_SHA'],'baseline':before,'active_transfer':during,'delta':delta,'budgets':budgets,'passed':not failures,'failures':failures,'physical_device_native_4k60_certified':False}
          Path('task08-evidence/integrated-performance.json').write_text(json.dumps(out,indent=2)); print(json.dumps(out)); assert not failures,failures
          PY

      - name: Build evidence index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          root=Path('task08-evidence'); files=[]
          for path in sorted(root.rglob('*')):
              if path.is_file(): files.append({'path':str(path.relative_to(root)),'bytes':path.stat().st_size,'sha256':hashlib.sha256(path.read_bytes()).hexdigest()})
          (root/'evidence-index.json').write_text(json.dumps({'task':'T08','candidate_commit':os.environ['GITHUB_SHA'],'artifact_file_count':len(files),'files':files,'candidate_passed':True,'critic_approval_pending':True,'task_approved':False},indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: havenline-task08-inventory-${{ github.sha }}
          path: task08-evidence
          retention-days: 30
