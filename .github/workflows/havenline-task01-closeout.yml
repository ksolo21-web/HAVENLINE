name: Havenline T01 source-bound closeout verification
on:
  push:
    branches: ['codex/havenline-sequential-task-01']
    paths: ['.github/workflows/havenline-task01-closeout.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Preserve the latest repaired runtime and verify reference bytes
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin ae1b487748510f4a9d83706e51f30ff7174bc879
          git diff --exit-code ae1b487748510f4a9d83706e51f30ff7174bc879 HEAD -- HavenlineGodot/scripts HavenlineGodot/shaders HavenlineGodot/assets HavenlineGodot/project.godot
          mkdir -p task01-evidence
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,json,subprocess
          e=Path('task01-evidence')
          originals={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in Path('HavenlineGodot/assets').rglob('*.glb') if 'reference_forest' not in p.parts}
          assert len(originals)==30
          (e/'protected-before.json').write_text(json.dumps(originals,indent=2))
          ref=base64.b64decode(Path('Docs/Production/T01/reference-detail.webp.b64').read_text())
          assert hashlib.sha256(ref).hexdigest()=='25b0e78c93f13ddadb8b815e7e19daf68485471d2be3fed0dd99bde8d00c48af'
          (e/'reference-detail.webp').write_bytes(ref)
          source=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          (e/'SOURCE.txt').write_text(source+'\n')
          (e/'runtime-preservation.json').write_text(json.dumps({'source':source,'art_runtime_baseline':'ae1b487748510f4a9d83706e51f30ff7174bc879','runtime_shaders_models_unchanged':True,'change':'restored-resource evidence camera and independently calibrated review; no game-content change'},indent=2))
          PY
      - name: Install the checksum-pinned engine and actual Mobile software renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb mesa-vulkan-drivers
          python3 -m pip install numpy scipy pillow
          mkdir -p "$RUNNER_TEMP/engine"
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o "$RUNNER_TEMP/engine/engine.zip"
          (cd "$RUNNER_TEMP/engine"; echo '9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65  engine.zip' | sha512sum -c -; unzip -q engine.zip; chmod +x Godot_v4.7.2-stable_linux.x86_64)
          echo "$RUNNER_TEMP/engine" >> "$GITHUB_PATH"
      - name: Run all existing engine and geometry checks without changing thresholds
        run: |
          set -euo pipefail
          python3 -m py_compile tools/havenline/review_task01_closeout.py
          python3 tools/havenline/audit_task01_geometry.py > task01-evidence/geometry-audit.json
          python3 tools/havenline/bake_outpost_audio.py > task01-evidence/audio-fixtures.json
          timeout 180 Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path HavenlineGodot --import --quit > task01-evidence/import.log 2>&1
          timeout 120 Godot_v4.7.2-stable_linux.x86_64 --headless --path HavenlineGodot --script res://tools/bake_crew_motion.gd > task01-evidence/motion-fixtures.log 2>&1
          for suite in test_simulation test_crew_and_persistence test_motion_and_performance test_population test_outpost test_outpost_runtime test_environment test_render_budget test_adaptive_devices test_reference_forest test_reference_forest_acceptance; do
            timeout 90 Godot_v4.7.2-stable_linux.x86_64 --headless --audio-driver Dummy --path HavenlineGodot --script "res://tests/$suite.gd" > "task01-evidence/$suite.log" 2>&1
          done
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:|ObjectDB instances were leaked' task01-evidence/*.log; then exit 1; fi
      - name: Capture actual variants, orbit, forest, visibility, restoration and native 4K
        run: |
          set -euo pipefail
          export VK_ICD_FILENAMES=$(find /usr/share/vulkan/icd.d -name '*lvp*json' | head -1)
          test -n "$VK_ICD_FILENAMES"
          mkdir -p task01-evidence/gallery task01-evidence/clearance task01-evidence/native4k
          xvfb-run -a -s '-screen 0 1280x720x24' timeout 400 Godot_v4.7.2-stable_linux.x86_64 --path HavenlineGodot --rendering-method mobile --rendering-driver vulkan --audio-driver Dummy --resolution 1280x720 --script res://tests/capture_task01.gd -- --out="$(pwd)/task01-evidence/gallery" > task01-evidence/mobile-gallery.log 2>&1
          xvfb-run -a -s '-screen 0 3840x2160x24' timeout 240 Godot_v4.7.2-stable_linux.x86_64 --path HavenlineGodot --rendering-method mobile --rendering-driver vulkan --audio-driver Dummy --resolution 3840x2160 --script res://tests/capture_task01_clearance.gd -- --native-4k --out="$(pwd)/task01-evidence/clearance" > task01-evidence/clearance.log 2>&1
          xvfb-run -a -s '-screen 0 3840x2160x24' timeout 200 Godot_v4.7.2-stable_linux.x86_64 --path HavenlineGodot --rendering-method mobile --rendering-driver vulkan --audio-driver Dummy --resolution 3840x2160 --fixed-fps 60 -- --capture="$(pwd)/task01-evidence/native4k" > task01-evidence/native4k.log 2>&1
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:' task01-evidence/*.log; then exit 1; fi
          python3 tools/havenline/verify_task01_evidence.py task01-evidence
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib
          from PIL import Image
          e=Path('task01-evidence');g=json.loads((e/'gallery/capture.json').read_text());n=json.loads((e/'native4k/render-evidence.json').read_text());c=json.loads((e/'clearance/clearance.json').read_text())
          m=json.loads((e/'mechanical-review.json').read_text());assert m['passed'] and m['engine_checks']==676 and len(m['mechanical_checks'])==52
          extra=[{'name':'Restored real resource is visible through actual controller','passed':c['restored_tree_visible'] is True},{'name':'Restored real resource has completed cutaway reset','passed':type(c['restored_cutaway']) in (int,float) and abs(c['restored_cutaway'])<0.001}]
          m['mechanical_checks']+=extra;m['passed']=all(row['passed'] for row in m['mechanical_checks'])
          (e/'mechanical-review.json').write_text(json.dumps(m,indent=2)+'\n');assert m['passed'],extra
          captures={str(p.relative_to(e)):hashlib.sha256(p.read_bytes()).hexdigest() for p in e.rglob('*.png')}
          assert len(captures)==63 and g['renderer']=='mobile' and n['render_scale']==1 and n['internal_render'][0]>=3840 and n['internal_render'][1]>=2160
          for name in captures:
              with Image.open(e/name) as image:image.verify()
          assets={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in Path('HavenlineGodot/assets/reference_forest').glob('*.glb')}
          r={'task':'T01','evidence_revision':10,'art_revision':9,'source':(e/'SOURCE.txt').read_text().strip(),'captures':captures,'assets':assets,'runtime_shader_sha256':hashlib.sha256(Path('HavenlineGodot/shaders/evergreen.gdshader').read_bytes()).hexdigest(),'renderer':'mobile','device':g['device'],'capture_count':len(captures),'native_dimensions':n['internal_render'],'render_scale':n['render_scale'],'fixed_step_capture_is_not_fps_evidence':True,'task_approved':False,'physical_4k60_verified':False}
          (e/'provenance.json').write_text(json.dumps(r,indent=2)+'\n')
          print(json.dumps({'source':r['source'],'engine_checks':676,'geometry_checks':9,'mechanical_checks':len(m['mechanical_checks']),'frames':len(captures),'passed':m['passed'],'not_art_approval':True}))
          PY
          mkdir -p task01-source
          git archive --format=tar.gz -o task01-source/source.tar.gz HEAD HavenlineGodot tools/havenline Docs AGENTS.md .github
          git rev-parse HEAD > task01-source/SOURCE.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: havenline-T01-closeout-evidence-${{ github.run_id }}
          path: task01-evidence/
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: havenline-T01-closeout-source-${{ github.run_id }}
          path: task01-source/
          retention-days: 30
          if-no-files-found: error
  independent-review:
    needs: build-and-capture
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        role: [reference-fidelity, visual-integrity]
        group: [variant-1, variant-2, variant-3, forest, clearance, camera-motion]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      REVIEW_ROLE: ${{ matrix.role }}
      REVIEW_GROUP: ${{ matrix.group }}
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: havenline-T01-closeout-evidence-${{ github.run_id }}
          path: task01-evidence/
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/havenline-t01-qwen35
          key: havenline-t01-qwen35-9b-q5-20260908-v1
          fail-on-cache-miss: true
      - run: python3 -m pip install pillow
      - name: Pass blind comparison controls before independent actual-pixel scoring
        run: python3 -u tools/havenline/review_task01_closeout.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: havenline-T01-closeout-${{ matrix.role }}-${{ matrix.group }}-${{ github.run_id }}
          path: critic-results/
          retention-days: 30
          if-no-files-found: error
# No artwork replacement, next task, APK delivery or physical-device FPS claim.
# Final task closure separately requires complete raw reports and actual-pixel signoff.
