name: Havenline V3.2 merged branch cleanup

on:
  push:
    branches:
      - codex/havenline-sequential-task-01
    paths:
      - .github/workflows/havenline-v32-merged-branch-cleanup.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CANONICAL_BRANCH: codex/havenline-sequential-task-01
      INVENTORY_PATH: Docs/Production/Archive/V32_MERGED_BRANCH_CLEANUP_20260921.json
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Revalidate exact merged refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$CANONICAL_BRANCH"
          git show "HEAD:$INVENTORY_PATH" > /tmp/inventory.json
          gh api "/repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" > /tmp/open-pulls.json
          python3 - <<'PY'
          import json,os,pathlib,subprocess
          inv=json.load(open('/tmp/inventory.json'))
          pulls=json.load(open('/tmp/open-pulls.json'))
          refs=set()
          for pr in pulls:
              for side in ('head','base'):
                  name=(pr.get(side) or {}).get('ref')
                  if name: refs.add(name)
          planned=[]
          for row in inv['branches']:
              b=row['branch'];expected=row['head_sha']
              assert b not in refs,(b,'referenced by open PR')
              current=subprocess.check_output(['git','ls-remote','--heads','origin',b],text=True).strip()
              if not current:
                  continue
              sha=current.split()[0]
              assert sha==expected,(b,'moved',sha,expected)
              cp=subprocess.run(['git','merge-base','--is-ancestor',sha,'origin/'+os.environ['CANONICAL_BRANCH']])
              assert cp.returncode==0,(b,'not ancestor of canonical')
              planned.append(b)
          pathlib.Path('/tmp/delete.txt').write_text('\n'.join(planned)+'\n')
          print(json.dumps({'planned_delete':planned},indent=2))
          PY

      - name: Delete revalidated V3.2 refs
        run: |
          set -euo pipefail
          while IFS= read -r branch; do
            [ -n "$branch" ] || continue
            git push origin --delete "$branch"
          done < /tmp/delete.txt

      - name: Verify deletion
        run: |
          set -euo pipefail
          while IFS= read -r branch; do
            [ -n "$branch" ] || continue
            ! git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1
          done < /tmp/delete.txt
