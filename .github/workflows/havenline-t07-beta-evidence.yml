name: Havenline T07 beta evidence

on:
  push:
    branches: [review/beta-t07-context-2026-11-28]
    paths: [.github/workflows/havenline-t07-beta-evidence.yml]

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Set up the pinned engine
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb ffmpeg mesa-vulkan-drivers
          cd "$RUNNER_TEMP"
          curl -fsSLo engine.zip --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo '9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65  engine.zip' | sha512sum -c -
          unzip -q engine.zip
          mv Godot_v4.7.2-stable_linux.x86_64 godot
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Verify the exact project and make the review build
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(git rev-parse HEAD^)"
          git diff --exit-code "$candidate" HEAD -- HavenlineLevel1
          mkdir -p t07-evidence
          printf '%s\n' "$candidate" > t07-evidence/Candidate.txt
          git ls-tree -r "$candidate" HavenlineLevel1 > t07-evidence/Project-tree.txt
          sha256sum HavenlineLevel1/project.godot > t07-evidence/Project.sha256
          godot --headless --path HavenlineLevel1 --editor --import > t07-evidence/Import.log 2>&1
          godot --headless --path HavenlineLevel1 --export-pack "Linux World Review" "$PWD/t07-evidence/Havenline.pck" > t07-evidence/Export.log 2>&1
          test -s t07-evidence/Havenline.pck
          sha256sum t07-evidence/Havenline.pck > t07-evidence/Pack.sha256
      - name: Run the offsite camp check
        shell: bash
        run: |
          set -euo pipefail
          profile="$(mktemp -d /tmp/havenline-l1-v3-t07-offsite-XXXXXXXX)"
          printf 'HAVENLINE-ALFRED-V3-DISPOSABLE\n' > "$profile/L1-DISPOSABLE"
          XDG_DATA_HOME="$profile/data" godot --headless --fixed-fps 60 --path HavenlineLevel1 --script res://tests/qa_offsite_camp.gd -- "--l1-disposable-profile=$profile" > t07-evidence/Offsite-camp.log 2>&1
      - name: Record the actual gameplay approach and purchase
        shell: bash
        run: |
          set -euo pipefail
          profile="$(mktemp -d /tmp/havenline-l1-v3-t07-film-XXXXXXXX)"
          printf 'HAVENLINE-ALFRED-V3-DISPOSABLE\n' > "$profile/L1-DISPOSABLE"
          export XDG_DATA_HOME="$profile/data" LIBGL_ALWAYS_SOFTWARE=1 LP_NUM_THREADS=4
          export T07_GAMEPLAY_RUN="$PWD/t07-evidence" T07_GAMEPLAY_MODE=context T07_FRAME_STEP=1 T07_FRAME_PORT=46578
          ffmpeg -y -nostdin -hide_banner -loglevel error -f image2pipe -framerate 60 -c:v mjpeg -i 'tcp://127.0.0.1:46578?listen=1' -c:v libx264 -threads 3 -preset veryfast -crf 25 -pix_fmt yuv420p -movflags +faststart t07-evidence/Gameplay.mp4 &
          encoder=$!
          trap 'kill "$encoder" 2>/dev/null || true' EXIT
          xvfb-run -a --server-args="-screen 0 3840x2160x24" godot --path HavenlineLevel1 --rendering-method gl_compatibility --windowed --resolution 3840x2160 --disable-render-loop --audio-driver Dummy --fixed-fps 60 --script "$PWD/Docs/QA/Beta-T07-Release-Art-2026-11-28/Replay.gd" -- "--l1-disposable-profile=$profile" > t07-evidence/Playback.log 2>&1
          wait "$encoder"
          ffprobe -v error -show_entries stream=width,height,r_frame_rate,duration,nb_frames -of json t07-evidence/Gameplay.mp4 > t07-evidence/Video.json
      - name: Retain build and replay evidence
        uses: actions/upload-artifact@v4
        with:
          name: Havenline-T07-exact-build-and-replay
          path: t07-evidence/
          if-no-files-found: error
