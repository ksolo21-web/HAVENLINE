name: Havenline production governance validation
on:
  push:
    branches: ['codex/havenline-sequential-task-01','havenline/QA-integration']
    paths:
      - 'AGENTS.md'
      - 'Docs/Production/**'
      - 'tools/havenline/production/**'
      - 'HavenlineGodot/tests/production_capture_harness.gd'
      - 'HavenlineGodot/tests/production_motion_capture.gd'
      - '.github/workflows/havenline-production-governance.yml'
      - '.github/workflows/havenline-candidate-guard.yml'
      - '.github/workflows/havenline-specialist-critic.yml'
      - '.github/workflows/havenline-specialist-model-cache.yml'
      - '.github/workflows/havenline-critic-safeguards.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compile production accelerator and specialist critic tooling
        run: python3 -m compileall -q tools/havenline/production
      - name: Run governance and safeguard unit tests
        run: python3 -m unittest discover -s tools/havenline/production/tests -p 'test_*.py' -v
      - name: Validate workstream registry and ownership collisions
        run: python3 tools/havenline/production/workstream.py validate-registry
      - name: Validate complete V2 state
        run: python3 tools/havenline/production/validate_migration.py
      - name: Require C1-C11 execution readiness
        run: python3 tools/havenline/production/validate_critic_readiness.py
      - name: Regenerate frozen T03 task packet as a smoke test
        run: |
          python3 tools/havenline/production/task_packet.py T03
          test -s Docs/Production/Evidence/T03/TASK_PACKET.md
      - name: Classify governance-only or causally governed T03 repair impact
        run: |
          set -euo pipefail
          base=$(git rev-parse HEAD^)
          python3 tools/havenline/production/change_impact.py --base "$base" --head HEAD > /tmp/impact.json
          if jq -e '.governance_only == true' /tmp/impact.json >/dev/null; then
            jq -e '.unknown_production_fallback == false' /tmp/impact.json >/dev/null
          else
            python3 - <<'PY'
          from pathlib import Path
          import fnmatch,json,subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only','HEAD^','HEAD'],text=True).splitlines())
          ownership=json.loads(Path('Docs/Production/PATH_OWNERSHIP.json').read_text())
          allowed=ownership['aliases']['@ownership:T03']+ownership['aliases']['@ownership:QA-GOV']
          def matches(path,patterns):
            return any(fnmatch.fnmatch(path,g) or (g.endswith('/**') and path.startswith(g[:-3])) for g in patterns)
          assert changed and all(matches(path,allowed) for path in changed),(sorted(changed),allowed)
          print(json.dumps({'classification':'CAUSALLY_GOVERNED_T03_REPAIR','changed_files':sorted(changed)},indent=2))
          PY
            python3 tools/havenline/production/validate_repair_cycle.py \
              --ledger Docs/Production/T03/DEFECT_LEDGER.json \
              --base e89818070603399cce27b595ff1116e40b8b3b2a \
              --head HEAD
          fi
          cat /tmp/impact.json
# Full V2 state is validated every run; diff-scope checks are commit-local so prior legitimate gameplay history cannot create false governance failures.
# Governance/QA only. This workflow cannot award a task critic score, approve T03, or start T04+ runtime work.
