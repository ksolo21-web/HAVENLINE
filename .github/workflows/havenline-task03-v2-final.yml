name: Havenline T03 V2 final integration gate
on:
  push:
    branches: ['codex/havenline-sequential-task-01']
    paths:
      - '.github/workflows/havenline-task03-v2-final.yml'
      - 'HavenlineGodot/scripts/camp_boundary.gd'
      - 'HavenlineGodot/scripts/camp_boundary_view.gd'
      - 'HavenlineGodot/shaders/outpost_snow.gdshader'
      - 'HavenlineGodot/tests/capture_task03_boundary.gd'
      - 'HavenlineGodot/tests/test_task03_boundary.gd'
      - 'Docs/Production/T03/**'
      - 'Docs/Production/ANTI_LOOP_ROOT_CAUSE_STANDARD.md'
      - 'Docs/Production/PATH_OWNERSHIP.json'
      - 'tools/havenline/**task03**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build-capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      source: ${{ steps.prov.outputs.source }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: G1 G2 G3 and protected authority
        run: |
          set -euo pipefail
          python3 tools/havenline/production/workstream.py validate-registry
          python3 - <<'PY'
          from pathlib import Path
          import fnmatch,json,subprocess
          repair_base='f92d90894cfa3c2a3eabe79cfe74d1c61301fc70'
          repair_commit='8bf55c45cdc6fe02e17d404a13bc168ebffb4dca'
          expected={
            'HavenlineGodot/scripts/camp_boundary.gd',
            'HavenlineGodot/shaders/outpost_snow.gdshader',
            'HavenlineGodot/tests/capture_task03_boundary.gd',
            'HavenlineGodot/tests/test_task03_boundary.gd'
          }
          repair_changed=set(subprocess.check_output(['git','diff','--name-only',repair_base,repair_commit,'--','HavenlineGodot'],text=True).splitlines())
          assert repair_changed==expected,(sorted(repair_changed),sorted(expected))
          ownership=json.loads(Path('Docs/Production/PATH_OWNERSHIP.json').read_text())
          allowed=ownership['aliases']['@ownership:T03']+ownership['aliases']['@ownership:QA-GOV']
          protected=ownership['aliases']['@protected:T01']+ownership['aliases']['@protected:T02']
          def matches(path,patterns):
            return any(fnmatch.fnmatch(path,g) or (g.endswith('/**') and path.startswith(g[:-3])) for g in patterns)
          post_repair=set(subprocess.check_output(['git','diff','--name-only',repair_commit,'HEAD'],text=True).splitlines())
          assert all(matches(p,allowed) for p in post_repair),(sorted(post_repair),allowed)
          assert not any(matches(p,protected) for p in post_repair),sorted(post_repair)
          print(json.dumps({'passed':True,'task':'T03','repair_base':repair_base,'repair_commit':repair_commit,'repair_changed_files':sorted(repair_changed),'post_repair_owned_files':sorted(post_repair),'owned_aliases':['@ownership:T03','@ownership:QA-GOV'],'protected_authority_untouched':True},indent=2))
          PY
          git diff --exit-code 1f0ba3bede3d160a34751c2fcdbfa78c1b6785ff HEAD -- HavenlineGodot/scripts/river_geometry.gd HavenlineGodot/scripts/reference_forest.gd HavenlineGodot/assets/reference_forest
      - name: Prepare pinned Godot and fixtures
        run: |
          set -euo pipefail
          sudo apt-get update -qq; sudo apt-get install -y xvfb mesa-vulkan-drivers
          python3 -m pip install pillow numpy
          mkdir -p "$RUNNER_TEMP/engine" task03-evidence/tests task03-evidence/gallery task03-evidence/native4k task03-evidence/tree-clearance source-snapshot
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o "$RUNNER_TEMP/engine/engine.zip"
          (cd "$RUNNER_TEMP/engine"; echo '9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65  engine.zip' | sha512sum -c -; unzip -q engine.zip; chmod +x Godot_v4.7.2-stable_linux.x86_64)
          export PATH="$RUNNER_TEMP/engine:$PATH"
          echo "$RUNNER_TEMP/engine" >> "$GITHUB_PATH"
          python3 tools/havenline/bake_outpost_audio.py > task03-evidence/audio-fixture.json
          timeout 180 Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path HavenlineGodot --import --quit > task03-evidence/tests/import.log 2>&1
          timeout 120 Godot_v4.7.2-stable_linux.x86_64 --headless --path HavenlineGodot --script res://tools/bake_crew_motion.gd > task03-evidence/tests/motion-fixture.log 2>&1
      - name: G4 G5 G6 full inherited regression
        run: |
          set -euo pipefail
          for suite in test_simulation test_crew_and_persistence test_motion_and_performance test_population test_outpost test_outpost_runtime test_environment test_render_budget test_adaptive_devices test_reference_forest test_reference_forest_acceptance test_task02_terrain test_task02_surface_stress test_lake_east_west test_task02_river test_task03_boundary; do
            timeout 180 Godot_v4.7.2-stable_linux.x86_64 --headless --audio-driver Dummy --path HavenlineGodot --script "res://tests/$suite.gd" > "task03-evidence/tests/$suite.log" 2>&1
          done
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:|ObjectDB instances were leaked' task03-evidence/tests/*.log; then exit 1; fi
          python3 tools/havenline/audit_task01_geometry.py > task03-evidence/tree-geometry.json
          python3 - <<'PY'
          from pathlib import Path
          import json
          rows=[]
          for p in sorted(Path('task03-evidence/tests').glob('test_*.log')):
            j=[json.loads(x) for x in p.read_text().splitlines() if x.startswith('{')][-1];assert j.get('passed') is True and not j.get('failures'),(p,j.get('failures'))
            c=j.get('checks',[]);rows.append({'suite':p.stem,'checks':len(c) if isinstance(c,list) else int(c)})
          total=sum(x['checks'] for x in rows);assert len(rows)==16 and total==807,(len(rows),total)
          g=json.loads(Path('task03-evidence/tree-geometry.json').read_text());assert g['passed'] and g['geometry_checks']==9
          Path('task03-evidence/tests.json').write_text(json.dumps({'source':'${{ github.sha }}','suite_count':16,'total_checks':807,'tree_geometry_checks':9,'suites':rows,'all_passed':True},indent=2))
          PY
      - name: G7 deterministic fresh evidence
        run: |
          set -euo pipefail
          export VK_ICD_FILENAMES=$(find /usr/share/vulkan/icd.d -name '*lvp*json' | head -1); test -n "$VK_ICD_FILENAMES"
          xvfb-run -a -s '-screen 0 1280x720x24' timeout 720 Godot_v4.7.2-stable_linux.x86_64 --path HavenlineGodot --rendering-method mobile --rendering-driver vulkan --audio-driver Dummy --resolution 1280x720 --script res://tests/capture_task03_boundary.gd -- --out="$(pwd)/task03-evidence/gallery" > task03-evidence/gallery.log 2>&1
          xvfb-run -a -s '-screen 0 3840x2160x24' timeout 600 Godot_v4.7.2-stable_linux.x86_64 --path HavenlineGodot --rendering-method mobile --rendering-driver vulkan --audio-driver Dummy --resolution 3840x2160 --script res://tests/capture_task03_boundary.gd -- --native-4k --out="$(pwd)/task03-evidence/native4k" > task03-evidence/native4k.log 2>&1
          xvfb-run -a -s '-screen 0 1280x720x24' timeout 300 Godot_v4.7.2-stable_linux.x86_64 --path HavenlineGodot --rendering-method mobile --rendering-driver vulkan --audio-driver Dummy --resolution 1280x720 --script res://tests/capture_task01_clearance.gd -- --out="$(pwd)/task03-evidence/tree-clearance" > task03-evidence/tree-clearance.log 2>&1
          cp Docs/Production/T02/reference-ground.webp task03-evidence/reference-ground.webp
      - name: G7A formal river-gate and cheap performance preflight
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json,os
          root=Path('task03-evidence');source=os.environ['GITHUB_SHA'];errors=[]
          gallery=json.loads((root/'gallery/capture.json').read_text());native=json.loads((root/'native4k/capture.json').read_text())
          reference_contract=json.loads(Path('HavenlineGodot/data/reference-contract.json').read_text())
          shipping_camera_full_height=float(reference_contract['camera']['size'])*2.0
          boundary=gallery['boundary'];contracts=boundary.get('river_gate_contracts',[])
          kinds={'river-side-approach','threshold-three-quarter','camp-side-outward','gameplay-scale'}
          by_eid={}
          for row in gallery['captures']:
            eid=row.get('evidence_id')
            if eid:
              if eid in by_eid:errors.append('duplicate evidence id '+eid)
              by_eid[eid]=row
          contract_rows=[]
          if len(contracts)!=3:errors.append('expected three river gate contracts')
          if boundary.get('gate_authority_id')!='T03-gate-geometry-v3':errors.append('wrong gate authority')
          if boundary.get('all_river_visual_clearance_pass') is not True:errors.append('visual clearance flag failed')
          for c in contracts:
            ids=c.get('evidence_ids',{})
            if set(ids)!=kinds:errors.append('evidence kinds '+str(c.get('id')))
            clear=float(c.get('visual_clear_width',0));minimum=float(c.get('visual_clearance_min',0))
            if clear+1e-6<max(3.20,minimum):errors.append('visual clearance '+str(c.get('id'))+' '+str(clear))
            route=c.get('route_points',[]);center=c.get('center',[])
            if len(route)!=3 or len(center)!=2 or any(abs(float(route[1][i])-float(center[i]))>.002 for i in range(2)):errors.append('route threshold authority '+str(c.get('id')))
            for kind,eid in ids.items():
              row=by_eid.get(eid)
              if not row:errors.append('missing evidence '+eid);continue
              if row.get('river_gate_id')!=c.get('id') or row.get('evidence_kind')!=kind or row.get('gate_authority_id')!='T03-gate-geometry-v3':errors.append('metadata mismatch '+eid)
              if kind=='gameplay-scale':
                if row.get('gameplay_camera_position_and_scale_preserved') is not True:errors.append('gameplay camera preservation flag '+eid)
                if row.get('qa_camera_reaimed_to_authoritative_threshold') is not True:errors.append('gameplay threshold re-aim disclosure '+eid)
                if abs(float(row.get('camera_size',-1))-shipping_camera_full_height)>.0001:errors.append('gameplay camera size '+eid)
                if abs(float(row.get('shipping_camera_full_height',-1))-shipping_camera_full_height)>.0001:errors.append('shipping camera contract '+eid)
              image=root/'gallery'/(row['name']+'.png')
              if not image.exists():errors.append('missing image '+str(image));continue
              with Image.open(image) as im:
                if im.size!=(1280,720):errors.append('bad evidence dimensions '+eid)
            contract_rows.append({'id':c.get('id'),'slug':c.get('slug'),'visual_clear_width':clear,'visual_clearance_min':minimum,'evidence_ids':ids})
          if len(by_eid)!=12:errors.append('expected exactly 12 required evidence ids, got '+str(len(by_eid)))
          gate_report={'task':'T03','source':source,'passed':not errors,'authority_id':boundary.get('gate_authority_id'),'required_evidence_count':12,'observed_evidence_count':len(by_eid),'required_kinds':sorted(kinds),'visual_clearance_pass':not any(x.startswith('visual clearance') or x=='visual clearance flag failed' for x in errors),'contracts':contract_rows,'caption_independent_readability_required':True,'semantic_readability_deferred_to_fresh_C1_C2':True,'errors':errors}
          (root/'gate-preflight.json').write_text(json.dumps(gate_report,indent=2))
          budgets=json.loads(Path('Docs/Production/PERFORMANCE_BUDGETS.json').read_text())['global_soft_budgets']
          draw_budget=int(budgets['draw_calls']);primitive_budget=int(budgets['visible_triangles'])
          frames=gallery['captures']+native['captures'];draw=[];prims=[];perf_errors=[]
          for row in frames:
            dc=row.get('draw_calls');pc=row.get('submitted_primitives')
            if not isinstance(dc,int) or not isinstance(pc,int):perf_errors.append('missing counters '+str(row.get('name')));continue
            draw.append(dc);prims.append(pc)
            if dc>draw_budget:perf_errors.append('draw budget '+str(row.get('name'))+' '+str(dc))
            if pc>primitive_budget:perf_errors.append('primitive budget '+str(row.get('name'))+' '+str(pc))
          perf={'task':'T03','source':source,'passed':not perf_errors,'measurement_method':'Godot visible viewport capture counters; cheap pre-critic budget only','draw_call_budget':draw_budget,'submitted_primitive_proxy_budget':primitive_budget,'max_draw_calls':max(draw) if draw else None,'max_submitted_primitives':max(prims) if prims else None,'frames_checked':len(frames),'known_unmeasured_fields':['physical_fps','thermal','gpu_frame_ms','cpu_frame_ms','materials_visible','texture_gpu_memory_mb'],'physical_device_certification':False,'errors':perf_errors}
          (root/'performance-preflight.json').write_text(json.dumps(perf,indent=2))
          print(json.dumps({'gate_preflight':gate_report,'performance_preflight':perf},indent=2))
          if errors or perf_errors:raise SystemExit(1)
          PY
      - name: Bind pixels and source
        id: prov
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib,json
          o=Path('task03-evidence');caps={str(p.relative_to(o)):hashlib.sha256(p.read_bytes()).hexdigest() for p in o.rglob('*.png')}
          assert len(list((o/'gallery').glob('*.png')))==47
          assert len(list((o/'native4k').glob('*.png')))==11
          assert len(list((o/'tree-clearance').glob('*.png')))==11
          assert len(caps)==69,len(caps)
          for n in caps:
            with Image.open(o/n) as im: assert im.size==((3840,2160) if n.startswith('native4k/') else (1280,720)); im.verify()
          for folder,count in [('gallery',47),('native4k',11)]:
            r=json.loads((o/folder/'capture.json').read_text());b=r['boundary'];assert r['task']=='T03-boundary-v2' and r['renderer']=='mobile' and r['forest']['instances']==586 and len(r['captures'])==count and all(x['render_scale']==1.0 for x in r['captures'])
            assert r['river']['river_layout_version']=='river_v1_mapspan' and b['gate_count']==6 and b['collision_panel_instances']==32 and b['primitive_fence_meshes_created'] is False
            assert abs(b['river_gate_leaf_length']-1.85)<.0001 and abs(b['river_gate_open_angle']-1.53)<.0001 and abs(b['river_lane_half_width']-1.55)<.0001
            assert abs(b['visual_corner_join_overlap']-.28)<.0001 and abs(b['gate_leaf_root_sink']-.30)<.0001
            assert b['terrain_seat_samples']==7 and b['terrain_crown_applied_to_gate_leaves_only'] is True and abs(b['river_gate_post_scale']-1.18)<.0001
            assert b['gate_authority_id']=='T03-gate-geometry-v3' and b['all_river_visual_clearance_pass'] is True and len(b['required_river_gate_evidence_ids'])==12
          g=json.loads((o/'gallery/capture.json').read_text());conditions=[x for x in g['captures'] if x['name'].startswith('boundary-condition-')];assert len(conditions)==6 and len({(tuple(x['camera_position']),x['camera_basis'],x['camera_size']) for x in conditions})==1
          assert caps['gallery/boundary-condition-day.png']==caps['gallery/boundary-condition-day-return.png']
          gate=json.loads((o/'gate-preflight.json').read_text());perf=json.loads((o/'performance-preflight.json').read_text());assert gate['passed'] and perf['passed']
          report={'task':'T03-boundary-v2','source':'${{ github.sha }}','captures':caps,'all_required_images_verified':True,'capture_image_count':69,'gallery_images':47,'native3840x2160_scale1_frames':11,'tree_clearance_frames':11,'required_river_gate_evidence_count':12,'gate_preflight_sha256':hashlib.sha256((o/'gate-preflight.json').read_bytes()).hexdigest(),'performance_preflight_sha256':hashlib.sha256((o/'performance-preflight.json').read_bytes()).hexdigest(),'river_layout_version':'river_v1_mapspan','physical_phone_tablet4k60_verified':False,'task_approved':False}
          (o/'provenance.json').write_text(json.dumps(report,indent=2))
          PY
          echo "source=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "$GITHUB_SHA" > source-snapshot/SOURCE.txt
          git archive --format=tar.gz --output=source-snapshot/source.tar.gz "$GITHUB_SHA" HavenlineGodot tools/havenline Docs AGENTS.md .github
          sha256sum source-snapshot/source.tar.gz > source-snapshot/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with: {name: 'havenline-t03-v2-evidence-${{ github.run_id }}', path: 'task03-evidence/', retention-days: 30}
      - uses: actions/upload-artifact@v4
        with: {name: 'havenline-t03-v2-source-${{ github.run_id }}', path: 'source-snapshot/', retention-days: 30}

  repair-validation:
    needs: build-capture
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env: {EXPECTED_SOURCE: '${{ needs.build-capture.outputs.source }}'}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, ref: '${{ needs.build-capture.outputs.source }}'}
      - uses: actions/download-artifact@v4
        with: {name: 'havenline-t03-v2-evidence-${{ github.run_id }}', path: 'task03-evidence/'}
      - name: Block evidence-only repair loops before critics
        run: |
          python3 tools/havenline/production/validate_repair_cycle.py \
            --ledger Docs/Production/T03/DEFECT_LEDGER.json \
            --base 092d50131ea39f42439d0081d68e354aa839e83f \
            --head "$EXPECTED_SOURCE" \
            --evidence-root task03-evidence \
            --output repair-validation/repair-validation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'havenline-t03-v2-repair-validation-${{ github.run_id }}', path: 'repair-validation/', retention-days: 30, if-no-files-found: error}

  visual-review:
    needs: [build-capture, repair-validation]
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: {role: [reference-fidelity, visual-integrity], shard: [0,1,2,3]}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env: {EXPECTED_SOURCE: '${{ needs.build-capture.outputs.source }}', REVIEW_ROLE: '${{ matrix.role }}', REVIEW_SHARD: '${{ matrix.shard }}', OMP_NUM_THREADS: '4'}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ needs.build-capture.outputs.source }}'}
      - uses: actions/download-artifact@v4
        with: {name: 'havenline-t03-v2-evidence-${{ github.run_id }}', path: 'task03-evidence/'}
      - uses: actions/cache/restore@v4
        with: {path: '~/.cache/havenline-t01-qwen35', key: 'havenline-t01-qwen35-9b-q5-20260908-v1', fail-on-cache-miss: true}
      - run: python3 -m pip install pillow
      - run: python3 -u tools/havenline/production/review_task03_strict_v2_wrapper.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'havenline-t03-v2-${{ matrix.role }}-${{ matrix.shard }}-${{ github.run_id }}', path: 'task03-local-review/', retention-days: 30, if-no-files-found: error}

  visual-acceptance:
    needs: [build-capture, visual-review]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env: {SOURCE: '${{ needs.build-capture.outputs.source }}'}
    steps:
      - uses: actions/download-artifact@v4
        with: {pattern: 'havenline-t03-v2-*-*-${{ github.run_id }}', path: 'reviews/'}
      - name: Strict fresh C1 C2 visual gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,math,os
          source=os.environ['SOURCE'];errors=[];rows=[]
          roles={'reference-fidelity','visual-integrity'};groups={'perimeter','north-gate','side-gates','river-gates','south-fence','central-lane','cross-shelter-lanes','bank-lane','detail-contact','gameplay','conditions'}
          dims={'reference_fidelity','boundary_finish','gate_readability','lane_legibility','river_preservation','view_consistency'}
          for role in roles:
            rr=[];shards=[]
            for p in Path('reviews').glob('*'+role+'*/shard-review.json'):
              s=json.loads(p.read_text());shards.append(s.get('shard'))
              if s.get('source')!=source or s.get('role')!=role or s.get('competency_passed') is not True or s.get('error') is not None:errors.append('bad shard '+str(p))
              for r in s.get('reviews',[]):
                rr.append(r);v=r.get('review',{});scores=v.get('scores',{});label=role+'/'+r.get('group','?')
                if set(scores)!=dims or any(isinstance(x,bool) or not isinstance(x,(int,float)) or not math.isfinite(x) or not x>9.0 for x in scores.values()):errors.append('strict >9 failed '+label)
                if r.get('passed') is not True or v.get('defects')!=[] or v.get('coverage_complete') is not True or v.get('confidence') not in ('medium','high'):errors.append('defect/incomplete '+label)
                if not v.get('observations'):errors.append('missing raw observations '+label)
              rows+=s.get('reviews',[])
            if set(shards)!={0,1,2,3} or len(rr)!=11 or {r.get('group') for r in rr}!=groups:errors.append('coverage '+role)
          out=Path('visual-gate');out.mkdir();report={'task':'T03','source':source,'passed':not errors,'strict_rule':'>9.0 unrounded','visual_judgments':len(rows),'fresh_roles':sorted(roles),'raw_observations_required':True,'errors':errors}
          (out/'visual-gate.json').write_text(json.dumps(report,indent=2));print(json.dumps(report,indent=2));raise SystemExit(0 if not errors else 1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'havenline-t03-v2-visual-gate-${{ github.run_id }}', path: 'visual-gate/', retention-days: 30, if-no-files-found: error}

  performance-review:
    needs: [build-capture, visual-acceptance]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env: {EXPECTED_SOURCE: '${{ needs.build-capture.outputs.source }}', OMP_NUM_THREADS: '4'}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ needs.build-capture.outputs.source }}'}
      - uses: actions/download-artifact@v4
        with: {name: 'havenline-t03-v2-evidence-${{ github.run_id }}', path: 'task03-evidence/'}
      - uses: actions/cache/restore@v4
        with: {path: '~/.cache/havenline-t01-qwen35', key: 'havenline-t01-qwen35-9b-q5-20260908-v1', fail-on-cache-miss: true}
      - run: python3 -u tools/havenline/production/review_t03_performance_local.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'havenline-t03-v2-C6-${{ github.run_id }}', path: 'task03-performance-review/', retention-days: 30, if-no-files-found: error}

  final-gate:
    needs: [build-capture, visual-acceptance, performance-review]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env: {SOURCE: '${{ needs.build-capture.outputs.source }}'}
    steps:
      - uses: actions/download-artifact@v4
        with: {name: 'havenline-t03-v2-evidence-${{ github.run_id }}', path: 'evidence/'}
      - uses: actions/download-artifact@v4
        with: {name: 'havenline-t03-v2-visual-gate-${{ github.run_id }}', path: 'visual-gate/'}
      - uses: actions/download-artifact@v4
        with: {name: 'havenline-t03-v2-C6-${{ github.run_id }}', path: 'performance/'}
      - name: G8 G12 G13 G14 integrated machine gate before final pixel signoff
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,math,os
          source=os.environ.get('SOURCE','');errors=[]
          pro=json.loads(Path('evidence/provenance.json').read_text());tests=json.loads(Path('evidence/tests.json').read_text())
          gate=json.loads(Path('evidence/gate-preflight.json').read_text());cheap=json.loads(Path('evidence/performance-preflight.json').read_text())
          visual=json.loads(next(Path('visual-gate').rglob('visual-gate.json')).read_text())
