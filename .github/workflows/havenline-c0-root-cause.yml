name: Havenline C0 root-cause advisor

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: 'Task id, e.g. T09'
        required: true
        type: string
      failed_run_id:
        description: 'Failed/cancelled GitHub Actions run id'
        required: true
        type: string
      failed_candidate:
        description: 'Exact 40-char candidate SHA reviewed by that run'
        required: true
        type: string
      integration_head:
        description: 'Optional exact integration SHA; blank resolves current integration branch head'
        required: false
        type: string
      task_branch:
        description: 'Optional task branch; blank resolves from registry'
        required: false
        type: string
  workflow_call:
    inputs:
      task_id: {required: true, type: string}
      failed_run_id: {required: true, type: string}
      failed_candidate: {required: true, type: string}
      integration_head: {required: false, type: string, default: ''}
      task_branch: {required: false, type: string, default: ''}

permissions:
  contents: read
  actions: read

concurrency:
  group: havenline-c0-${{ inputs.task_id }}-${{ inputs.failed_candidate }}
  cancel-in-progress: false

jobs:
  diagnose:
    name: C0 non-voting root-cause diagnosis
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    env:
      TASK_ID: ${{ inputs.task_id }}
      FAILED_RUN_ID: ${{ inputs.failed_run_id }}
      FAILED_CANDIDATE: ${{ inputs.failed_candidate }}
      INPUT_INTEGRATION_HEAD: ${{ inputs.integration_head }}
      INPUT_TASK_BRANCH: ${{ inputs.task_branch }}
      GH_TOKEN: ${{ github.token }}
      HAVENLINE_C0_INDEPENDENT_JOB: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.failed_candidate }}
          fetch-depth: 0

      - name: Validate exact C0 request identity
        run: |
          set -euo pipefail
          [[ "$TASK_ID" =~ ^T[0-9]{2}$ ]]
          [[ "$FAILED_CANDIDATE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$FAILED_RUN_ID" =~ ^[0-9]+$ ]]
          test "$(git rev-parse HEAD)" = "$FAILED_CANDIDATE"

      - name: Collect complete immutable failure packet
        run: |
          set -euo pipefail
          mkdir -p c0-input c0-output
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${FAILED_RUN_ID}" > c0-input/run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${FAILED_RUN_ID}/jobs?per_page=100" > c0-input/jobs.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${FAILED_RUN_ID}/artifacts?per_page=100" > c0-input/artifacts.json
          gh run view "$FAILED_RUN_ID" --log-failed > c0-input/failed.log 2>&1 || gh run view "$FAILED_RUN_ID" --log > c0-input/failed.log 2>&1 || true
          gh run download "$FAILED_RUN_ID" -D c0-input/artifacts >/dev/null 2>&1 || true
          python3 - <<'PY'
          import json,os,pathlib,subprocess
          root=pathlib.Path('.')
          task=os.environ['TASK_ID'];candidate=os.environ['FAILED_CANDIDATE'];run_id=int(os.environ['FAILED_RUN_ID'])
          registry=json.loads((root/'Docs/Production/WORKSTREAM_REGISTRY.json').read_text())
          ws=next((x for x in registry['workstreams'] if x.get('task_id')==task),{})
          integration_branch=registry['integration_branch']
          task_branch=os.environ.get('INPUT_TASK_BRANCH') or ws.get('branch','')
          def remote_head(branch):
              if not branch:return ''
              out=subprocess.check_output(['git','ls-remote','origin','refs/heads/'+branch],text=True).split()
              return out[0] if out else ''
          integration=os.environ.get('INPUT_INTEGRATION_HEAD') or remote_head(integration_branch)
          if len(integration)!=40:raise SystemExit('unable to resolve integration head')
          current=remote_head(task_branch)
          run=json.loads((root/'c0-input/run.json').read_text());jobs=json.loads((root/'c0-input/jobs.json').read_text()).get('jobs',[])
          steps=[];unexecuted=[]
          for job in jobs:
              for step in job.get('steps',[]):
                  row={'job':job.get('name'),'name':step.get('name'),'status':step.get('status'),'conclusion':step.get('conclusion')}
                  steps.append(row)
                  if step.get('conclusion') in (None,'skipped','cancelled'):unexecuted.append(f"{job.get('name')}: {step.get('name')}")
          try:
              merge=subprocess.check_output(['git','merge-base',candidate,integration],text=True).strip()
              changed=subprocess.check_output(['git','diff','--name-only',merge,candidate],text=True).splitlines()
          except Exception:changed=[]
          scope=root/'Docs/Production'/task/'FROZEN_SCOPE.md';ledger_candidates=[root/'Docs/Production'/task/'defect-ledger.json',root/'Docs/Production'/task/'DEFECT_LEDGER.json']
          ledger=next((p for p in ledger_candidates if p.exists()),None)
          log=(root/'c0-input/failed.log').read_text(errors='replace') if (root/'c0-input/failed.log').exists() else ''
          packet={
            'schema_version':1,'task_id':task,'failed_run_id':run_id,'failed_candidate':candidate,'integration_head':integration,
            'integration_branch':integration_branch,'task_branch':task_branch,'current_branch_head':current,'run_conclusion':run.get('conclusion'),
            'run_status':run.get('status'),'workflow_name':run.get('name'),'event':run.get('event'),'steps':steps,'unexecuted_checks':unexecuted,
            'changed_files':changed,'failed_logs':log[-60000:],'task_scope':scope.read_text(errors='replace')[:30000] if scope.exists() else '',
            'defect_ledger':ledger.read_text(errors='replace')[:30000] if ledger else '',
            'protected_files':[],
          }
          (root/'c0-input/failure-packet.json').write_text(json.dumps(packet,indent=2)+'\n')
          PY

      - name: Record V3.1 factory observation when candidate supports it
        run: |
          set -euo pipefail
          if [ -f tools/havenline/production/factory_observer.py ]; then
            python3 tools/havenline/production/factory_observer.py \
              --run c0-input/run.json \
              --jobs c0-input/jobs.json \
              --artifacts c0-input/artifacts.json \
              --task "$TASK_ID" \
              --artifact-root c0-input/artifacts \
              --c0-cycles 1 \
              --output-dir c0-output/factory-observation
          else
            mkdir -p c0-output/factory-observation
            printf '%s\n' '{"schema_version":1,"availability":"candidate_predates_v3_1","bundle_is_observation_not_authority":true,"quality_thresholds_unchanged":true}' > c0-output/factory-observation/factory-observation.json
          fi

      - name: Attach V3 historical failure intelligence when candidate supports it
        run: |
          set -euo pipefail
          if [ -f tools/havenline/production/failure_intelligence.py ] && [ -f Docs/Production/FAILURE_INTELLIGENCE.json ]; then
            python3 tools/havenline/production/failure_intelligence.py packet c0-input/failure-packet.json > c0-input/failure-intelligence.json
          else
            printf '%s\n' '{"matches":[],"historical_match_is_advisory_only":true,"availability":"candidate_predates_v3"}' > c0-input/failure-intelligence.json
          fi
          python3 - <<'PY'
          import json,pathlib
          packet_path=pathlib.Path('c0-input/failure-packet.json')
          packet=json.loads(packet_path.read_text())
          prior=json.loads(pathlib.Path('c0-input/failure-intelligence.json').read_text())
          packet['historical_failure_intelligence']=prior
          packet['historical_failure_intelligence_rule']='ADVISORY_ONLY; current evidence must independently confirm or reject every historical match; history never authorizes a repair.'
          packet_path.write_text(json.dumps(packet,indent=2)+'\n')
          PY

      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        id: reviewer-cache
        with:
          path: ~/.cache/havenline-t01-qwen35
          key: havenline-t01-qwen35-9b-q5-20260908-v1

      - name: Self-heal checksum-pinned local advisor runtime
        run: |
          set -euo pipefail
          if [ ! -s "$HOME/.cache/havenline-t01-qwen35/manifest.json" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y aria2
          fi
          python3 tools/havenline/production/prepare_specialist_runtime.py > c0-output/runtime-preparation.json

      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        if: steps.reviewer-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/havenline-t01-qwen35
          key: havenline-t01-qwen35-9b-q5-20260908-v1

      - name: Run C0 full-blocker-set diagnosis
        run: |
          python3 tools/havenline/production/c0_root_cause_advisor.py \
            --packet c0-input/failure-packet.json \
            --out c0-output

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: havenline-C0-${{ inputs.task_id }}-${{ inputs.failed_candidate }}-${{ github.run_id }}
          path: |
            c0-input/failure-packet.json
            c0-input/failure-intelligence.json
            c0-input/artifacts.json
            c0-output/
          retention-days: 30
          if-no-files-found: error

# C0 is diagnostic-only. It cannot approve a task, score gameplay, lower C1-C11 thresholds,
# mutate a candidate, or treat a cancelled/superseded run as a product failure. Historical
# failure intelligence is advisory only and must be confirmed against the current run evidence.
