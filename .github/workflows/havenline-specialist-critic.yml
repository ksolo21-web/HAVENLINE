name: Havenline reusable specialist critic
on:
  workflow_call:
    inputs:
      critic_id:
        required: true
        type: string
      candidate:
        required: true
        type: string
      evidence_artifact:
        required: true
        type: string
      manifest_name:
        required: false
        default: critic-manifest.json
        type: string
      output_artifact:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  independent-specialist-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    env:
      HAVENLINE_INDEPENDENT_REVIEW_JOB: '1'
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.evidence_artifact }}
          path: critic-input/
      - uses: actions/cache/restore@v4
        id: reviewer-cache
        with:
          path: ~/.cache/havenline-t01-qwen35
          key: havenline-t01-qwen35-9b-q5-20260908-v1
      - name: Self-heal reviewer runtime if this branch has no usable cache
        run: |
          set -euo pipefail
          if [ ! -s "$HOME/.cache/havenline-t01-qwen35/manifest.json" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y aria2
          fi
          python3 tools/havenline/production/prepare_specialist_runtime.py > specialist-runtime-preparation.json
      - uses: actions/cache/save@v4
        if: steps.reviewer-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/havenline-t01-qwen35
          key: havenline-t01-qwen35-9b-q5-20260908-v1
      - run: python3 -m pip install pillow
      - name: Validate exact source-bound evidence manifest
        run: python3 tools/havenline/production/specialist_evidence_manifest.py validate "critic-input/${{ inputs.manifest_name }}"
      - name: Execute independent specialist critic
        run: |
          python3 -u tools/havenline/production/specialist_critic_runner.py \
            --critic "${{ inputs.critic_id }}" \
            --candidate "${{ inputs.candidate }}" \
            --manifest "critic-input/${{ inputs.manifest_name }}" \
            --out specialist-review
          cp specialist-runtime-preparation.json specialist-review/runtime-preparation.json
      - name: Enforce strict >9 raw critic gate
        if: always()
        run: |
          test -f specialist-review/critic-record.json
          python3 tools/havenline/production/critic_harness.py validate-raw \
            --critic "${{ inputs.critic_id }}" \
            --candidate "${{ inputs.candidate }}" \
            --raw specialist-review/critic-record.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.output_artifact }}
          path: |
            specialist-review/
            specialist-runtime-preparation.json
          retention-days: 30
          if-no-files-found: error
# C3/C4/C5/C7/C8/C10/C11 use this workflow. It is branch-independent: a missing cache causes exact pinned runtime preparation, never a silent reviewer downgrade.
# C1/C2 keep their reference-specific visual review; C6/C9 are deterministic specialist gates.
