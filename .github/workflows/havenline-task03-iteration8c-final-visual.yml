name: Havenline T03 iteration-8C final C1 C2
on:
  push:
    branches: ['codex/havenline-sequential-task-01']
    paths:
      - '.github/workflows/havenline-task03-iteration8c-final-visual.yml'
      - 'tools/havenline/production/review_t03_iteration8c_final.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  CANDIDATE: '578a7ee17f0cd9d8420b78bd18781f3a93a42f6c'
  EVIDENCE_RUN: '35884182902'
  EVIDENCE_ARTIFACT: 'havenline-t03-reference-repair-35884182902'

jobs:
  critic:
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        critic: [C1, C2]
        group: [fence, north-work-gates, river-gates, lanes, conditions]
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove reviewer tooling did not change frozen candidate runtime
        run: git diff --exit-code "$CANDIDATE" HEAD -- HavenlineGodot
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.EVIDENCE_RUN }}
          name: ${{ env.EVIDENCE_ARTIFACT }}
          path: task03-evidence
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/havenline-t01-qwen35
          key: havenline-t01-qwen35-9b-q5-20260908-v1
          fail-on-cache-miss: true
      - run: python3 -m pip install pillow
      - name: Run independent T03 domain critic
        env:
          EXPECTED_SOURCE: ${{ env.CANDIDATE }}
          CRITIC_ID: ${{ matrix.critic }}
          GROUP_ID: ${{ matrix.group }}
          EVIDENCE_ROOT: task03-evidence
          OUT_DIR: task03-${{ matrix.critic }}-${{ matrix.group }}
        run: python3 -u tools/havenline/production/review_t03_iteration8c_final.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: havenline-t03-final-${{ matrix.critic }}-${{ matrix.group }}-${{ github.run_id }}
          path: task03-${{ matrix.critic }}-${{ matrix.group }}/
          retention-days: 30
          if-no-files-found: error

  aggregate:
    needs: critic
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: havenline-t03-final-*-${{ github.run_id }}
          path: shards
      - name: Enforce exact C1 and strict C2 with no averaging
        env:
          CANDIDATE: ${{ env.CANDIDATE }}
        run: |
          python3 - <<'PY'
          import json,math,os,pathlib
          root=pathlib.Path('shards');out=pathlib.Path('aggregate');out.mkdir()
          candidate=os.environ['CANDIDATE'];expected={'fence','north-work-gates','river-gates','lanes','conditions'}
          final={};all_errors=[]
          dims_by={'C1':['reference_fidelity','visual_language','cross_view_consistency'],'C2':['geometry_contact','clipping_seams','intentional_gap_integrity','cross_view_integrity']}
          for cid,dims in dims_by.items():
              records=[]
              for p in root.rglob('critic-record.json'):
                  d=json.loads(p.read_text())
                  if d.get('critic_id')==cid:records.append(d)
              errors=[];groups={d.get('group') for d in records}
              if len(records)!=5:errors.append(f'{cid} expected 5 group records, got {len(records)}')
              if groups!=expected:errors.append(f'{cid} group coverage {sorted(x for x in groups if x)}')
              for d in records:
                  if d.get('candidate_hash')!=candidate:errors.append(cid+' candidate mismatch '+str(d.get('group')))
                  if d.get('passed') is not True:errors.append(cid+' failed '+str(d.get('group')))
                  if d.get('defects')!=[]:errors.append(cid+' defects '+str(d.get('group')))
                  if d.get('coverage_complete') is not True:errors.append(cid+' incomplete '+str(d.get('group')))
                  if d.get('confidence') not in ('medium','high'):errors.append(cid+' confidence '+str(d.get('group')))
              scores={k:min((d.get('scores',{}).get(k,0) for d in records),default=0) for k in dims}
              if cid=='C1':
                  if scores.get('reference_fidelity')!=10.0:errors.append('C1 reference_fidelity != 10')
                  if scores.get('visual_language')!=10.0:errors.append('C1 visual_language != 10')
                  if scores.get('cross_view_consistency',0)<=9.0:errors.append('C1 cross_view_consistency <= 9')
              else:
                  if any(not isinstance(v,(int,float)) or isinstance(v,bool) or not math.isfinite(v) or v<=9.0 for v in scores.values()):errors.append('C2 dimension <= 9')
              record={'task_id':'T03','critic_id':cid,'candidate_hash':candidate,'scores':scores,'defects':[x for d in records for x in d.get('defects',[])],'groups':[{'group':d.get('group'),'scores':d.get('scores'),'defects':d.get('defects'),'passed':d.get('passed')} for d in records],'coverage_complete':len(records)==5 and all(d.get('coverage_complete') is True for d in records),'no_score_averaging':True,'passed':not errors,'errors':errors}
              (out/(cid+'-aggregate.json')).write_text(json.dumps(record,indent=2)+'\n')
              final[cid]=record;all_errors.extend(errors)
          summary={'task_id':'T03','candidate':candidate,'passed':not all_errors,'errors':all_errors,'critics':{k:{'scores':v['scores'],'defects':v['defects'],'passed':v['passed']} for k,v in final.items()},'c6_preserved':{'status':'PASS_PRESERVED_MONOTONIC_REDUCTION','prior_pass_run':'35848567867','reason':'8C removes 28 fence triangles and adds no material/shader/batch/physics/animation/population load'},'user_visual_signoff_required':True,'task_approved':False}
          (out/'summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          print(json.dumps(summary,indent=2))
          raise SystemExit(0 if summary['passed'] else 1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: havenline-t03-iteration8c-final-aggregate-${{ github.run_id }}
          path: aggregate/
          retention-days: 30
          if-no-files-found: error
# Review-only commit. Frozen runtime candidate remains 578a7ee17f0cd9d8420b78bd18781f3a93a42f6c.
