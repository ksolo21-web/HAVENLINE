name: Havenline T10 final runner source review
on:
  push:
    branches: ['havenline/review-T10-runner-dependency-controller']
permissions:
  contents: read
concurrency:
  group: havenline-t10-final-runner-source-review
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: false
      - name: Prepare exact reviewed source
        run: |
          set -euo pipefail
          git fetch --no-tags origin havenline/review-T10-runner-dependency-source-v2
          git worktree add --detach "$RUNNER_TEMP/t10-runner-v2" 5484a8c3d47ffb0d895b379aeb267f190f3ff577
      - name: Reproduce source with separate authority overlay
        run: |
          set -euo pipefail
          python3 tools/havenline/task10/review_runner_dependency_source_v2.py --mode preflight --repo "$RUNNER_TEMP/t10-runner-v2" --out runner-v2-preflight
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: t10-final-runner-source-preflight-${{ github.sha }}
          path: runner-v2-preflight/
          if-no-files-found: warn
          retention-days: 30

  independent-review:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 42
    env:
      HAVENLINE_INDEPENDENT_REVIEW_JOB: '1'
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: false
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ~/.cache/havenline-t01-qwen35
          key: havenline-t01-qwen35-9b-q5-20260908-v1
      - name: Prepare pinned reviewer runtime and source
        run: |
          set -euo pipefail
          if [ ! -s "$HOME/.cache/havenline-t01-qwen35/manifest.json" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y aria2
          fi
          python3 tools/havenline/production/prepare_specialist_runtime.py > reviewer-runtime.json
          git fetch --no-tags origin havenline/review-T10-runner-dependency-source-v2
          git worktree add --detach "$RUNNER_TEMP/t10-runner-v2" 5484a8c3d47ffb0d895b379aeb267f190f3ff577
      - name: Independently review exact source and authority separation
        run: |
          set -euo pipefail
          python3 tools/havenline/task10/review_runner_dependency_source_v2.py --mode review --repo "$RUNNER_TEMP/t10-runner-v2" --out runner-v2-review
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: t10-final-runner-source-review-${{ github.sha }}
          path: |
            runner-v2-review/
            reviewer-runtime.json
          if-no-files-found: error
          retention-days: 30
