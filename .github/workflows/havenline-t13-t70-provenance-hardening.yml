name: Havenline T13-T70 Provenance Hardening

on:
  workflow_dispatch:
  push:
    branches:
      - havenline/t13-t70-provenance-hardening
      - havenline/t13-t70-metadata-hardening
    paths:
      - 'Docs/Production/T1[3-9]/**'
      - 'Docs/Production/T[2-6][0-9]/**'
      - 'Docs/Production/T70/**'
      - 'tools/havenline/prepared_stack/normalize_provenance.py'
      - 'tools/havenline/prepared_stack/test_provenance_normalizer.py'
      - '.github/workflows/havenline-t13-t70-provenance-hardening.yml'
  pull_request:
    paths:
      - 'Docs/Production/T1[3-9]/**'
      - 'Docs/Production/T[2-6][0-9]/**'
      - 'Docs/Production/T70/**'
      - 'tools/havenline/prepared_stack/normalize_provenance.py'
      - 'tools/havenline/prepared_stack/test_provenance_normalizer.py'
      - '.github/workflows/havenline-t13-t70-provenance-hardening.yml'

permissions:
  contents: write

jobs:
  provenance-hardening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Snapshot pre-existing checkout dirt
        run: |
          python - <<'PY'
          import os, pathlib, subprocess
          changed = subprocess.check_output(['git','diff','--name-only'], text=True).splitlines()
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'havenline-preexisting-diff.txt'
          target.write_text('\n'.join(changed) + ('\n' if changed else ''), encoding='utf-8')
          print({'preexisting_checkout_dirt': changed})
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile provenance tools
        run: |
          python -m py_compile tools/havenline/prepared_stack/normalize_provenance.py
          python -m py_compile tools/havenline/prepared_stack/test_provenance_normalizer.py
      - name: Run focused regression tests
        run: python tools/havenline/prepared_stack/test_provenance_normalizer.py
      - name: Normalize T13-T70 packet provenance locally
        run: python tools/havenline/prepared_stack/normalize_provenance.py --apply
      - name: Verify exact normalized packet set
        run: python tools/havenline/prepared_stack/normalize_provenance.py --check
      - name: Refuse any out-of-scope generated diff
        run: |
          python - <<'PY'
          import os, pathlib, subprocess, sys
          allowed = set()
          for i in range(13, 71):
              task = f'T{i:02d}'
              for name in ('FROZEN_SCOPE.md','ACTIVATION_CHECKLIST.json','PREBUILD_CONTRACT.json'):
                  allowed.add(f'Docs/Production/{task}/{name}')
          baseline_path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'havenline-preexisting-diff.txt'
          preexisting = set(filter(None, baseline_path.read_text(encoding='utf-8').splitlines()))
          changed = set(filter(None, subprocess.check_output(['git','diff','--name-only'], text=True).splitlines()))
          generated = changed - preexisting
          unexpected = sorted(generated - allowed)
          if unexpected:
              print({'passed': False, 'preexisting_paths': sorted(preexisting), 'unexpected_generated_paths': unexpected})
              sys.exit(1)
          print({'passed': True, 'preexisting_paths': sorted(preexisting), 'generated_diff_count': len(generated), 'generated_paths': sorted(generated)})
          PY
      - name: Commit normalized provenance on repair branch
        if: github.event_name == 'push' && (github.ref_name == 'havenline/t13-t70-provenance-hardening' || github.ref_name == 'havenline/t13-t70-metadata-hardening')
        run: |
          if git diff --quiet -- Docs/Production; then
            echo 'No packet provenance normalization commit needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for i in $(seq 13 70); do
            task=$(printf 'T%02d' "$i")
            git add -- \
              "Docs/Production/${task}/FROZEN_SCOPE.md" \
              "Docs/Production/${task}/ACTIVATION_CHECKLIST.json" \
              "Docs/Production/${task}/PREBUILD_CONTRACT.json"
          done
          python - <<'PY'
          import subprocess, sys
          allowed = set()
          for i in range(13, 71):
              task = f'T{i:02d}'
              for name in ('FROZEN_SCOPE.md','ACTIVATION_CHECKLIST.json','PREBUILD_CONTRACT.json'):
                  allowed.add(f'Docs/Production/{task}/{name}')
          staged = set(filter(None, subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines()))
          unexpected = sorted(staged - allowed)
          if unexpected or not staged:
              print({'passed': False, 'unexpected_staged_paths': unexpected, 'staged_count': len(staged)})
              sys.exit(1)
          print({'passed': True, 'staged_count': len(staged), 'staged_paths': sorted(staged)})
          PY
          git commit -m 'T13-T70: normalize forward preparation metadata'
          git push origin HEAD:${GITHUB_REF_NAME}
