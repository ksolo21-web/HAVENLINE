name: T05 R22 reference-first cooker geometry review (unapproved)
on:
  push:
    branches: ['havenline/T05-r18-visual-corrections-20261025']
    paths:
      - 'tools/havenline/blender/t05_cooker_reference_first_r22.py'
      - '.github/workflows/havenline-t05-r22-reference-first.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: t05-r22-reference-first-${{ github.sha }}
  cancel-in-progress: false
jobs:
  reference-first-geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          lfs: false
          fetch-depth: 1
      - name: Install Blender/visual validation tools with bounded mirrors
        timeout-minutes: 10
        run: |
          set -euo pipefail
          # The default Azure mirror stalled on Blender's 35.9 MB data package
          # twice; switch THIS disposable runner to Ubuntu's official mirror.
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/apt-mirrors.txt
          if test -f /etc/apt/sources.list.d/ubuntu.sources; then
            sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/sources.list.d/ubuntu.sources
          fi
          if ! sudo timeout 150 apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=35 update -qq; then
            echo "::warning::APT metadata refresh stalled; using cached indices"
          fi
          sudo timeout 390 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=40 install -y --no-install-recommends blender python3-venv python3-numpy
          python3 -m venv "$RUNNER_TEMP/t05-r22-visual-venv"
          "$RUNNER_TEMP/t05-r22-visual-venv/bin/pip" install --disable-pip-version-check numpy trimesh pillow
          python3 -m py_compile tools/havenline/blender/t05_cooker_reference_first_r22.py
          blender --version | head -n 2
      - name: Actually build R22 improved reference-first geometry and render original four studio cameras
        timeout-minutes: 16
        run: |
          set -euo pipefail
          mkdir -p t05-r22-evidence
          timeout 840 blender -b -t 2 --factory-startup \
            --python tools/havenline/blender/t05_cooker_reference_first_r22.py -- \
            --out "$PWD/t05-r22-evidence" > t05-r22-evidence/blender-build.log 2>&1 || {
              tail -160 t05-r22-evidence/blender-build.log; exit 1; }
          test -s t05-r22-evidence/T05_cooker_EDITABLE.blend
          test -s t05-r22-evidence/T05_cooker_BLENDER_CANDIDATE.glb
          test -s t05-r22-evidence/benchmark.json
          test -s t05-r22-evidence/T05_cooker_reverse-quarter-diagnostic.png
      - name: Strict R07-frozen technical gate and source authority metadata audit
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/t05-r22-visual-venv/bin/python" \
             tools/havenline/blender/validate_cooker_benchmark.py \
             --out t05-r22-evidence \
             --catalog HavenlineGodot/assets/stations_v2/catalog.json \
             | tee t05-r22-evidence/technical-gate.log
          python3 - <<'PY'
          import json,pathlib
          root=pathlib.Path('t05-r22-evidence')
          report=json.loads((root/'benchmark.json').read_text())
          assert report['status']=='R22_GEOMETRY_CANDIDATE_NOT_VISUALLY_APPROVED'
          assert report['reference_sha256']=='729393f7980d8bd70906a7e4de04c3c6b21de5dfe4deb3d98ca7005b54d61635'
          assert len(report['materials'])==9
          assert report['reference_pixel_comparison_in_ci'] is False
          assert report['independent_critic_approved'] is False
          assert report['source_smoke_vfx_included'] is False
          tech=json.loads((root/'technical_validation.json').read_text())
          assert tech['technical_gate']=='PASS'
          assert tech['production_approval'] is False
          report2={'status':'R22_GEOMETRY_ONLY_NOT_VISUAL_APPROVAL',
                   'source_ref':'18567.png','source_sha256':report['reference_sha256'],
                   'candidate_glb_sha256':tech['candidate_glb_sha256'],
                   'technical_checks':len(tech['checks']),
                   'geometry_sections':report['corrected_geometry'],
                   'real_owner_reference_pixels_compared':False,
                   'independent_critic_approved':False,'shipping_asset_modified':False}
          (root/'R22-source-locked-technical-audit.json').write_text(json.dumps(report2,indent=2)+'\n')
          print(json.dumps(report2,indent=2))
          PY
          git diff --exit-code -- HavenlineGodot/assets/stations_v2/ HavenlineGodot/scripts/
          test -z "$(git ls-files --others --exclude-standard HavenlineGodot/assets/stations_v2/)"
      - name: Collect four actual studio PNGs for independent owner-reference visual comparison
        run: |
          "$RUNNER_TEMP/t05-r22-visual-venv/bin/python" - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageDraw,ImageStat
          import hashlib,json
          p=Path("t05-r22-evidence")
          names=("front","three-quarter","right","rear")
          sheet=Image.new("RGB",(1280,1330),(20,33,48))
          frames=[]
          for i,name in enumerate(names):
              path=p/("T05_cooker_"+name+".png")
              with Image.open(path) as im:
                  assert im.format=="PNG" and im.size==(640,640)
                  rgb=im.convert("RGB")
                  assert max(ImageStat.Stat(rgb).stddev)>8
                  sheet.paste(rgb,((i%2)*640,(i//2)*640+40))
                  frames.append({"view":name,"sha256":hashlib.sha256(path.read_bytes()).hexdigest()})
          assert len({x["sha256"] for x in frames})==4
          ImageDraw.Draw(sheet).text((25,12),"R22 T05 REAL BLENDER FRAMES — GEOMETRY TRIAL NOT STYLE APPROVAL",fill=(248,249,251))
          sheet.save(p/"T05_R22_4VIEW_GEOMETRY_TRIAL.png")
          (p/"frame-hashes.json").write_text(json.dumps(frames,indent=2)+'\n')
          print('R22_STUDIO_FRAME_CHECK_PASS',json.dumps(frames))
          PY
      - name: Retain editable model, GLB, actual renders, independent evidence or failure logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: havenline-T05-R22-reference-first-geometry-${{ github.sha }}
          path: t05-r22-evidence/
          retention-days: 30
          if-no-files-found: warn
