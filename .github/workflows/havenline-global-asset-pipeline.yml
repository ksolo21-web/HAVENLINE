name: HAVENLINE global asset pipeline — source and release guards
on:
  push:
    branches: ['havenline/global-asset-pipeline-v1-20261026']
    paths:
      - 'tools/havenline/asset_pipeline/**'
      - 'Docs/Production/GLOBAL_ASSET_AUTHORING_POLICY.json'
      - '.github/workflows/havenline-global-asset-pipeline.yml'
  pull_request:
    paths:
      - 'tools/havenline/asset_pipeline/**'
      - 'Docs/Production/GLOBAL_ASSET_AUTHORING_POLICY.json'
      - '.github/workflows/havenline-global-asset-pipeline.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: global-asset-pipeline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          lfs: false
      - name: Compile globally shared tooling
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/havenline/asset_pipeline/asset_gate.py \
            tools/havenline/asset_pipeline/compare_reference.py \
            tools/havenline/asset_pipeline/blender_build.py \
            tools/havenline/asset_pipeline/tests/test_asset_gate.py
      - name: Run fail-closed cross-task security and acceptance tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/havenline/asset_pipeline/tests -p 'test_*.py' -v
      - name: Check cooker example metadata without pretending asset approval
        run: |
          set -euo pipefail
          python3 tools/havenline/asset_pipeline/asset_gate.py lint \
            --manifest tools/havenline/asset_pipeline/examples/T05-cooker-asset.json \
            --policy Docs/Production/GLOBAL_ASSET_AUTHORING_POLICY.json \
            --report global-asset-lint.json
          grep -q SOURCE_LINT_PASS_NOT_ASSET_APPROVAL global-asset-lint.json
          if grep -q '"asset_released": true' global-asset-lint.json; then
            echo 'Invalid auto-approval'; exit 1
          fi
      - name: Verify production assets unaffected
        run: |
          git diff --exit-code -- HavenlineGodot/assets/ HavenlineGodot/scripts/
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: havenline-global-asset-source-gates-${{ github.sha }}
          path: global-asset-lint.json
          if-no-files-found: warn
          retention-days: 30
