name: Havenline T13-T70 Activation Frontier

on:
  workflow_dispatch:
  push:
    branches:
      - havenline/QA-integration
    paths:
      - 'Docs/Production/T1[3-9]/**'
      - 'Docs/Production/T[2-6][0-9]/**'
      - 'Docs/Production/T70/**'
      - 'Docs/Production/DEPENDENCY_GRAPH.json'
      - 'Docs/Production/WORKSTREAM_REGISTRY.json'
      - 'Docs/Production/task-gates.json'
      - 'Docs/Production/PATH_OWNERSHIP.json'
      - 'tools/havenline/prepared_stack/activation_frontier.py'
      - 'tools/havenline/prepared_stack/test_activation_frontier.py'
      - '.github/workflows/havenline-t13-t70-activation-frontier.yml'
  pull_request:
    paths:
      - 'Docs/Production/T1[3-9]/**'
      - 'Docs/Production/T[2-6][0-9]/**'
      - 'Docs/Production/T70/**'
      - 'Docs/Production/DEPENDENCY_GRAPH.json'
      - 'Docs/Production/WORKSTREAM_REGISTRY.json'
      - 'Docs/Production/task-gates.json'
      - 'Docs/Production/PATH_OWNERSHIP.json'
      - 'tools/havenline/prepared_stack/activation_frontier.py'
      - 'tools/havenline/prepared_stack/test_activation_frontier.py'
      - '.github/workflows/havenline-t13-t70-activation-frontier.yml'

jobs:
  activation-frontier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile frontier tools
        run: |
          python -m py_compile tools/havenline/prepared_stack/activation_frontier.py
          python -m py_compile tools/havenline/prepared_stack/test_activation_frontier.py
      - name: Run frontier regression tests
        run: python tools/havenline/prepared_stack/test_activation_frontier.py
      - name: Report T13-T70 activation frontier
        run: python tools/havenline/prepared_stack/activation_frontier.py
