name: Havenline T10 exact integrated regression
on:
  push:
    branches: ['havenline/review-T10-approval-closeout']
    paths:
      - '.github/t10-integrated-regression.trigger'

permissions:
  contents: read
  actions: read

jobs:
  exact-integrated-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CANDIDATE: 'eba0107def258824549fb10d81785290d0c81d97'
      T10_BASE: '62f5a13753968c77a0feb47a18d93c82d8c5b581'
      CANONICAL_BRANCH: 'codex/havenline-sequential-task-01'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.CANDIDATE }}
          fetch-depth: 0
          lfs: false

      - name: Bind exact integrated source
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$CANONICAL_BRANCH"
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          test "$(git rev-parse "origin/$CANONICAL_BRANCH")" = "$CANDIDATE"
          mkdir -p task10-regression/tests
          python3 tools/havenline/task10/validate_post_t09_adapter.py --require-bound
          python3 tools/havenline/task10/validate_world_transform.py --candidate "$CANDIDATE" --output task10-regression/source-contract.json
          python3 tools/havenline/production/validate_migration.py > task10-regression/governance.json
          python3 -m pip install --disable-pip-version-check --no-input numpy==2.3.5 pillow==12.3.0
          python3 -m unittest discover -s tools/havenline/production/tests -p 'test_*.py' > task10-regression/tests/production-tools.log 2>&1
          python3 -m unittest discover -s tools/havenline/task10/tests -p 'test_*.py' > task10-regression/tests/task10-tooling.log 2>&1

      - name: Prepare pinned Godot
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/engine"
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o "$RUNNER_TEMP/engine/engine.zip"
          (cd "$RUNNER_TEMP/engine"; echo '9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65  engine.zip' | sha512sum -c -; unzip -q engine.zip; chmod +x Godot_v4.7.2-stable_linux.x86_64)
          echo "$RUNNER_TEMP/engine" >> "$GITHUB_PATH"

      - name: Run exact T10 and impacted approved-task regression
        run: |
          set -euo pipefail
          python3 tools/havenline/bake_outpost_audio.py > task10-regression/tests/audio-fixture.json
          timeout 240 Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path HavenlineGodot --import --quit > task10-regression/tests/import.log 2>&1
          timeout 120 Godot_v4.7.2-stable_linux.x86_64 --headless --path HavenlineGodot --script res://tools/bake_crew_motion.gd > task10-regression/tests/motion-fixture.log 2>&1

          python3 tools/havenline/task10/validate_progression.py --candidate "$CANDIDATE" --output task10-regression/progression.json
          python3 tools/havenline/production/save_state_matrix.py --candidate "$CANDIDATE" --task T10 --adapter "python3 tools/havenline/task10/save_matrix_adapter.py" --out task10-regression/save-matrix > task10-regression/save-matrix-summary.json
          python3 tools/havenline/production/regression_runner.py --base "$T10_BASE" --head "$CANDIDATE" --godot "$(command -v Godot_v4.7.2-stable_linux.x86_64)" --out task10-regression/impact-regression.json

          suites=(
            test_motion_and_performance
            test_task08_inventory
            test_task08_integration
            test_task09_harvesting
            test_task09_integration
            test_task10_world_transform
            test_task10_integration
          )
          printf '%s\n' "${suites[@]}" > task10-regression/tests/required-suites.txt
          for suite in "${suites[@]}"; do
            test -s "HavenlineGodot/tests/$suite.gd"
            timeout 300 Godot_v4.7.2-stable_linux.x86_64 --headless --audio-driver Dummy --path HavenlineGodot --script "res://tests/$suite.gd" > "task10-regression/tests/$suite.log" 2>&1
          done
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:|ObjectDB instances were leaked' task10-regression/tests/*.log; then exit 1; fi

          python3 - <<'PY'
          from pathlib import Path
          import json,os
          rows=[]
          required=Path('task10-regression/tests/required-suites.txt').read_text().splitlines()
          for suite in required:
              path=Path('task10-regression/tests')/(suite+'.log')
              reports=[json.loads(line) for line in path.read_text().splitlines() if line.startswith('{')]
              assert reports,path
              report=reports[-1]
              assert report.get('passed') is True and not report.get('failures'),(path,report.get('failures'))
              checks=report.get('checks',[])
              rows.append({'suite':suite,'checks':len(checks) if isinstance(checks,list) else int(checks),'passed':True})
          impact=json.loads(Path('task10-regression/impact-regression.json').read_text())
          assert impact.get('passed') is True, impact
          output={
              'task':'T10-integrated-regression',
              'source':os.environ['CANDIDATE'],
              'candidate_commit':os.environ['CANDIDATE'],
              'suite_count':len(rows),
              'total_checks':sum(row['checks'] for row in rows),
              'suites':rows,
              'all_passed':True,
              'impact_regression_passed':True,
              'task_approved':False
          }
          Path('task10-regression/tests.json').write_text(json.dumps(output,indent=2)+'\n')
          print(json.dumps(output))
          PY

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: havenline-task10-integrated-regression-${{ env.CANDIDATE }}
          path: task10-regression/
          if-no-files-found: error
          retention-days: 90
