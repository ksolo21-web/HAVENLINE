name: T05 R23 real Godot 4K isolated visual evidence — no Blender reinstall
on:
  push:
    branches: ['havenline/T05-r18-visual-corrections-20261025']
    paths:
      - '.github/workflows/havenline-t05-r23-godot-4k.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: t05-r23-reference-godot-${{ github.sha }}
  cancel-in-progress: false
jobs:
  five-angle-native-4k:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          lfs: false
      - name: Reuse exact R23 visually unapproved Blender evidence without rebaking
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          run-id: 40514923294
          name: havenline-T05-R23-reference-first-geometry-7be6f3cd92d3126f7b56a3cb973eba05690aa6db
          path: input-R23
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Stage exact immutable R23 candidate and unchanged T05 viewer in disposable Godot project
        run: |
          set -euo pipefail
          mkdir -p r23-4k-review/project/assets r23-4k-review/screenshots "$RUNNER_TEMP/hl-godot"
          glb=input-R23/T05_cooker_BLENDER_CANDIDATE.glb
          echo "b3e2c695295429a7233664a4199c03b363b5458f3583014fd2663a902fe9983a  $glb" | sha256sum -c -
          cp "$glb" r23-4k-review/project/assets/T05_cooker_BLENDER_CANDIDATE.glb
          cp tools/havenline/blender/capture_isolated_godot_cooker.gd r23-4k-review/project/capture.gd
          python3 - <<'PY'
          import pathlib
          p=pathlib.Path("r23-4k-review/project/capture.gd")
          s=p.read_text()
          replacements=(
              ("viewport.size = Vector2i(1280, 720)","viewport.size = Vector2i(3840, 2160)"),
              ("viewport.msaa_3d = Viewport.MSAA_4X","viewport.msaa_3d = Viewport.MSAA_DISABLED"),
              ("== 1280 and img.get_height() == 720","== 3840 and img.get_height() == 2160"),
              ('"rear": Vector3(0, 3.1, 6.0)','"rear": Vector3(0, 3.1, 6.0),\n        "reverse-quarter": Vector3(-4.0, 3.25, -4.8)')
          )
          for old,new in replacements:
              assert old in s, f'Viewer source drift: {old}'
              s=s.replace(old,new)
          p.write_text(s)
          PY
          cat > r23-4k-review/project/project.godot <<'EOF'
          config_version=5
          [application]
          config/name="Havenline R23 Isolated 4K Visual Review"
          [rendering]
          renderer/rendering_method="gl_compatibility"
          EOF
      - name: Download official Godot 4.7.2 editor, no Blender APT install
        run: |
          set -euo pipefail
          base=https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable
          curl -fL --retry 2 --connect-timeout 20 --max-time 240 "$base/Godot_v4.7.2-stable_linux.x86_64.zip" -o "$RUNNER_TEMP/hl-godot/godot.zip"
          unzip -q "$RUNNER_TEMP/hl-godot/godot.zip" -d "$RUNNER_TEMP/hl-godot"
          chmod +x "$RUNNER_TEMP/hl-godot/Godot_v4.7.2-stable_linux.x86_64"
          "$RUNNER_TEMP/hl-godot/Godot_v4.7.2-stable_linux.x86_64" --version
      - name: Import actual R23 GLB and capture five true 3840x2160 Godot images
        timeout-minutes: 12
        run: |
          set -euo pipefail
          engine="$RUNNER_TEMP/hl-godot/Godot_v4.7.2-stable_linux.x86_64"
          project="$PWD/r23-4k-review/project"
          timeout 120 "$engine" --headless --editor --path "$project" --import --quit 2>&1 | tee r23-4k-review/import.log
          if ! command -v xvfb-run >/dev/null 2>&1; then
            echo "Missing Xvfb for actual software OpenGL capture"; exit 1
          fi
          timeout 540 xvfb-run -a "$engine" --path "$project" \
            --rendering-method gl_compatibility --audio-driver Dummy \
            --script res://capture.gd -- \
            --out="$PWD/r23-4k-review/screenshots" 2>&1 | tee r23-4k-review/capture.log
          grep -q T05_ISOLATED_GODOT_IMPORT_PROOF r23-4k-review/capture.log
      - name: Independently inspect native PNG bytes and strict evidence scope
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/hl-pillow"
          "$RUNNER_TEMP/hl-pillow/bin/pip" install --disable-pip-version-check pillow
          "$RUNNER_TEMP/hl-pillow/bin/python" - <<'PY'
          import hashlib,json,pathlib
          from PIL import Image
          r=pathlib.Path("r23-4k-review")
          p=json.loads((r/"screenshots/isolated-godot-report.json").read_text())
          assert p["shipping_main_loaded"] is False
          assert p["owner_visual_approved"] is False
          assert p["shipping_asset_modified"] is False
          assert p["status"]=="ISOLATED_GODOT_IMPORT_ONLY_NOT_SHIPPING_QA"
          assert len(p["captures"])==5
          frames=[]
          for item in p["captures"]:
              f=r/"screenshots"/item["file"]
              with Image.open(f) as im:
                  assert im.format=="PNG" and im.size==(3840,2160)
                  colors=len(set(im.convert("RGB").resize((160,90)).getdata()))
                  assert colors>=25, f"Blank or degenerate capture {item['view']}"
              frames.append({"view":item["view"],"sha256":hashlib.sha256(f.read_bytes()).hexdigest(),"sampled_rgb_colors":colors})
          assert len({x["view"] for x in frames})==5
          assert len({x["sha256"] for x in frames})==5
          report={"status":"R23_REAL_GODOT_4K_ISOLATED_RENDER_PASS_NOT_VISUAL_ACCEPTANCE",
                  "source_reference":"18567.png",
                  "source_reference_sha256":"729393f7980d8bd70906a7e4de04c3c6b21de5dfe4deb3d98ca7005b54d61635",
                  "candidate_glb_sha256":"b3e2c695295429a7233664a4199c03b363b5458f3583014fd2663a902fe9983a",
                  "resolution":[3840,2160],"frames":frames,
                  "actual_shipping_scene_tested":False,"physical_android_tested":False,
                  "reference_pixel_alignment_done":False,"independent_critic_passed":False,"owner_approved":False}
          (r/"native-4k-byte-audit.json").write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PY
      - name: Preserve real five-angle Godot PNGs and source hashes
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: havenline-T05-R23-isolated-real-Godot-4k-${{ github.sha }}
          path: |
            r23-4k-review/screenshots/
            r23-4k-review/native-4k-byte-audit.json
            r23-4k-review/import.log
            r23-4k-review/capture.log
          retention-days: 30
          if-no-files-found: warn
