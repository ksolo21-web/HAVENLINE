name: Havenline environment refinement 045
on:
  push:
    branches: ['codex/havenline-environment-review']
    paths: ['.github/workflows/havenline-refinement-045.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Decode reviewed patch and verify exact prior files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,zlib,json,pathlib,hashlib,subprocess
          encoded=''''''
          # Correct a transport duplication explicitly; the decompression checksum
          # and per-file hashes below still reject any damaged patch.
          encoded=encoded.replace('n+utbLSLSNlG1','n+utbLSNlG1')
          d=json.loads(zlib.decompress(base64.b64decode(encoded,validate=True)))
          for name,expected in d['before'].items():
              p=pathlib.Path(name)
              assert not p.is_absolute() and '..' not in p.parts
              actual=hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else None
              assert actual==expected, ('Source drift',name,actual,expected)
          for name,expected in d['protected'].items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==expected,name
          pathlib.Path('/tmp/refinement.json').write_text(json.dumps(d))
          pathlib.Path('/tmp/refinement.patch').write_text(d['patch'])
          subprocess.run(['git','apply','--check','/tmp/refinement.patch'],check=True)
          subprocess.run(['git','apply','/tmp/refinement.patch'],check=True)
          print('Applied verified text changes:',len(d['before']))
          PY
      - name: Reproduce exact locally inspected assets
        run: |
          set -euo pipefail
          python3 -m pip install -r tools/havenline/requirements-environment.txt
          python3 tools/havenline/bake_environment.py
          python3 tools/havenline/asset_audit.py
          python3 tools/havenline/environment_asset_audit.py
          python3 - <<'PY'
          import json,pathlib,hashlib
          d=json.loads(pathlib.Path('/tmp/refinement.json').read_text())
          for name,expected in d['protected'].items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==expected,name
          manifest=pathlib.Path('HavenlineGodot/assets/environment_v2/manifest.json')
          assert hashlib.sha256(manifest.read_bytes()).hexdigest()==d['expected_environment_manifest'],'Baked assets differ from inspected candidate'
          print('All 16 original GLBs preserved; generated environment manifest matches locally tested candidate.')
          PY
      - name: Commit candidate without merging or claiming approval
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,subprocess
          d=json.loads(pathlib.Path('/tmp/refinement.json').read_text())
          names=list(d['before'])
          names += [str(p) for p in pathlib.Path('HavenlineGodot/assets/environment_v2').glob('*.glb')]
          names += ['HavenlineGodot/assets/environment_v2/manifest.json']
          subprocess.run(['git','add','--',*names],check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refine environment surfaces and conifers; preserve LODs and instrument native frame timing'
          git push origin HEAD:codex/havenline-environment-review
          mkdir -p refinement-evidence
          git rev-parse HEAD > refinement-evidence/commit.txt
          cp /tmp/refinement.patch refinement-evidence/
          cp HavenlineGodot/assets/environment_v2/manifest.json refinement-evidence/
          printf '%s\n' 'Development candidate. 10/10 and physical Android 4K/60 NOT certified.' > refinement-evidence/STATUS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: havenline-refinement-045-application
          path: refinement-evidence/
          retention-days: 30
          if-no-files-found: warn
