name: Havenline deterministic visual-repair asset materializer
on:
  push:
    branches: ['havenline/T05-visual-repair-20260926']
    paths:
      - 'tools/havenline/task05/generate_station_kit.py'
      - 'tools/havenline/task05/test_station_kit.py'
      - '.github/workflows/havenline-task05-station-kit-candidate.yml'
      - '.github/workflows/havenline-visual-repair-asset-materializer.yml'

permissions:
  contents: write

concurrency:
  group: havenline-t05-materialize-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize-t05:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    # Compare committed raw bytes in this disposable job only. Legacy native-Git
    # PNG/OBJ files match LFS patterns but are not pointers; running LFS clean
    # during git diff falsely reports unchanged files as generated changes.
    # No tracked attributes, global configuration, path gate or file is waived.
    env:
      GIT_CONFIG_COUNT: '4'
      GIT_CONFIG_KEY_0: filter.lfs.process
      GIT_CONFIG_VALUE_0: ''
      GIT_CONFIG_KEY_1: filter.lfs.clean
      GIT_CONFIG_VALUE_1: cat
      GIT_CONFIG_KEY_2: filter.lfs.smudge
      GIT_CONFIG_VALUE_2: cat
      GIT_CONFIG_KEY_3: filter.lfs.required
      GIT_CONFIG_VALUE_3: 'false'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact integration-owned visual repair authorization
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin codex/havenline-sequential-task-01
          integration=$(git rev-parse origin/codex/havenline-sequential-task-01)
          git merge-base --is-ancestor "$integration" "$GITHUB_SHA"
          remote_head=$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)
          test "$remote_head" = "$GITHUB_SHA"
          python3 - "$integration" <<'PY'
          import json,os,subprocess,sys
          integration=sys.argv[1]
          record=json.loads(subprocess.check_output(
              ['git','show',f'{integration}:Docs/Production/APPROVAL_INVALIDATIONS.json'],text=True
          ))
          task='T05';branch=os.environ['GITHUB_REF_NAME']
          inv=next((row for row in record.get('records',[]) if row.get('task_id')==task and row.get('status')=='ACTIVE'),None)
          assert inv is not None
          assert inv.get('repair_candidate_allowed') is True
          assert inv.get('repair_scope')=='VISUAL_ONLY'
          assert inv.get('repair_branch')==branch
          assert inv.get('historical_accepted_source')=='fa6fa70f154f3757d22303522ca3f6de2c3d391f'
          assert inv.get('repair_status')=='POST_COMPLETION_VISUAL_REPAIR_AUTHORIZED'
          PY

      - name: Deterministically regenerate and verify T05 station assets
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          python3 -m pip install --disable-pip-version-check numpy
          python3 tools/havenline/task05/generate_station_kit.py
          python3 tools/havenline/task05/test_station_kit.py
          test -z "$(git ls-files --others --exclude-standard)"
          mapfile -t changed < <(git diff --name-only)
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "No generated asset changes to materialize."
            echo "MATERIALIZE=false" >> "$GITHUB_ENV"
            exit 0
          fi
          for path in "${changed[@]}"; do
            case "$path" in
              HavenlineGodot/assets/stations_v2/*.glb|HavenlineGodot/assets/stations_v2/catalog.json) ;;
              *) echo "Materializer generated unauthorized path: $path" >&2; exit 1 ;;
            esac
          done
          echo "MATERIALIZE=true" >> "$GITHUB_ENV"
          printf '%s\n' "${changed[@]}"

      - name: Commit only deterministic generated asset outputs
        if: env.MATERIALIZE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          remote_head=$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)
          test "$remote_head" = "$GITHUB_SHA"
          git config user.name 'havenline-visual-materializer[bot]'
          git config user.email 'havenline-visual-materializer[bot]@users.noreply.github.com'
          git add HavenlineGodot/assets/stations_v2
          mapfile -t staged < <(git diff --cached --name-only)
          test "${#staged[@]}" -gt 0
          for path in "${staged[@]}"; do
            case "$path" in
              HavenlineGodot/assets/stations_v2/*.glb|HavenlineGodot/assets/stations_v2/catalog.json) ;;
              *) echo "Unauthorized staged path: $path" >&2; exit 1 ;;
            esac
          done
          git diff --exit-code
          git commit -m 'T05: materialize deterministic visual repair assets'
          python3 tools/havenline/task05/test_station_kit.py
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          remote_head=$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)
          test "$remote_head" = "$GITHUB_SHA"
          git push origin "HEAD:$GITHUB_REF_NAME"
          echo "Materialized exact source: $(git rev-parse HEAD)"
