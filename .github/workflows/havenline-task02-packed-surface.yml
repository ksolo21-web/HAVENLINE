name: Havenline T02 packed-surface verification and independent review
on:
  push:
    branches: ['codex/havenline-sequential-task-01']
    paths: ['.github/workflows/havenline-task02-packed-surface.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build-capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    outputs:
      source: ${{ steps.build.outputs.source }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - run: python3 -m pip install pyyaml
      - name: Run the existing complete regressions and actual Mobile capture set on the new material
        id: build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import yaml,subprocess,json,hashlib
          workflow=yaml.safe_load(Path('.github/workflows/havenline-task02.yml').read_text())
          runs=[s['run'] for s in workflow['jobs']['terrain-build']['steps'] if 'run' in s]
          assert len(runs)==5
          runs[0]+='\nexport PATH="$RUNNER_TEMP/engine:$PATH"\n'
          runs[2]=runs[2].replace('test_task02_terrain;','test_task02_terrain test_task02_surface_stress;').replace('len(rows)==12','len(rows)==13').replace('705','723')
          # The legacy test adaptation is already committed. No worker write,
          # new gameplay, model changes or workflow-permission escalation.
          runs[3]='set -euo pipefail\ngit diff --exit-code -- HavenlineGodot/tests/test_outpost.gd\nsource=$(git rev-parse HEAD)\necho "source=$source" >> "$GITHUB_OUTPUT"\necho "$source" > task02-evidence/SOURCE.txt\n'
          runs[4]=runs[4].replace("(3 if name=='native4k' else 24)","(6 if name=='native4k' else 24)").replace("'tests':705","'tests':723")
          material=Path('HavenlineGodot/shaders/outpost_snow.gdshader')
          assert hashlib.sha256(material.read_bytes()).hexdigest()=='3fb4f4bca2bc834eeac45f4ff4f96d508f8e5fc3f25fd5b17cbe65f48659c66d'
          script='\n'.join(runs)
          e=Path('task02-evidence');e.mkdir(exist_ok=True);(e/'executed-build.sh').write_text(script)
          subprocess.run(['bash','-euo','pipefail','-c',script],check=True)
          for name in ('reference-ground.webp','reference-ground-provenance.json'):
              (e/name).write_bytes((Path('Docs/Production/T02')/name).read_bytes())
          (e/'revision.json').write_text(json.dumps({'task':'T02','revision':'packed-snow-contact-and-restrained-material-variation','prior_source':'586604eb8ab6404fc8084b6853fd03cfa842d3af','changed_shader_sha256':hashlib.sha256(material.read_bytes()).hexdigest(),'changes':['Derivative-filtered world-stable subtle snow and clay variation','Narrow softly packed snow/earth contact transition','Restrained roughness and normal highlight variation without mesh displacement'],'original_geometry_and_tree_assets_unchanged':True,'engine_checks':723,'task_approved':False,'physical_4k60_verified':False},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: havenline-T02-packed-evidence-${{ github.run_id }}
          path: task02-evidence/
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: havenline-T02-packed-source-${{ github.run_id }}
          path: source-snapshot/
          retention-days: 30
          if-no-files-found: error
  critic:
    needs: build-capture
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        role: [reference-fidelity, visual-integrity]
        group: [workfloor, shoreline, snow-contact, tree-visibility, camera-route-early, camera-route-late, water-sequence, night-overview]
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    env:
      REVIEW_ROLE: ${{ matrix.role }}
      REVIEW_GROUP: ${{ matrix.group }}
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build-capture.outputs.source }}
      - uses: actions/download-artifact@v4
        with:
          name: havenline-T02-packed-evidence-${{ github.run_id }}
          path: task02-evidence/
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: ~/.cache/havenline-t01-qwen35
          key: havenline-t01-qwen35-9b-q5-20260908-v1
          fail-on-cache-miss: false
      - name: Recover the exact previously pinned reviewer on a cache miss
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y aria2
          python3 tools/havenline/ensure_task01_reviewer.py
      - run: python3 -m pip install pillow
      - name: Independently inspect fresh source-bound output using the established rubric
        run: python3 -u tools/havenline/review_task02_fullsize.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: T02-packed-${{ matrix.role }}-${{ matrix.group }}-${{ github.run_id }}
          path: task02-review/
          retention-days: 30
          if-no-files-found: error
  task-gate:
    needs: [build-capture,critic]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      EXPECTED_SOURCE: ${{ needs.build-capture.outputs.source }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: T02-packed-*-${{ github.run_id }}
          path: gate-report/reviews/
      - uses: actions/download-artifact@v4
        with:
          name: havenline-T02-packed-evidence-${{ github.run_id }}
          path: evidence/
      - run: python3 -m pip install pyyaml
      - name: Enforce unchanged raw-score and complete-coverage checks for the exact new source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import yaml,subprocess,os
          w=yaml.safe_load(Path('.github/workflows/havenline-task02-fullsize-review.yml').read_text())
          scripts=[s['run'] for s in w['jobs']['task-gate']['steps'] if 'run' in s]
          assert len(scripts)==1 and len(os.environ['EXPECTED_SOURCE'])==40
          script=scripts[0].replace('3b3e0af44ec638b0671a02e4bd7b5909d89ea2cd',os.environ['EXPECTED_SOURCE']).replace('720','723')
          Path('gate-report/executed-gate.sh').write_text(script)
          subprocess.run(['bash','-euo','pipefail','-c',script],check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: havenline-T02-packed-independent-evidence-${{ github.run_id }}
          path: gate-report/
          retention-days: 30
          if-no-files-found: error
# Actual material repair; previous failed reports stay preserved. No score changes.
# No APK, physical-performance approval, automatic task advancement or Task 3 work.
