name: Havenline fully merged stale branch cleanup

on:
  push:
    branches:
      - codex/havenline-sequential-task-01
    paths:
      - .github/workflows/havenline-merged-stale-branch-cleanup.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CANONICAL_BRANCH: codex/havenline-sequential-task-01
      INVENTORY_PATH: Docs/Production/Archive/MERGED_STALE_BRANCH_INVENTORY_20260921.json
      RESULT_PATH: Docs/Production/Archive/MERGED_STALE_BRANCH_CLEANUP_RESULT_20260921.json
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Revalidate deletion candidates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git show "HEAD:$INVENTORY_PATH" > /tmp/inventory.json
          gh api "/repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" > /tmp/open-pulls.json
          python3 - <<'PY'
          import json,pathlib,subprocess,os
          inv=json.load(open('/tmp/inventory.json'))
          pulls=json.load(open('/tmp/open-pulls.json'))
          referenced=set()
          for pr in pulls:
              for side in ('head','base'):
                  name=(pr.get(side) or {}).get('ref')
                  if name: referenced.add(name)
          planned=[]
          for row in inv['safe_to_delete']:
              b=row['branch']
              assert b not in referenced,(b,'now referenced by open PR')
              assert not b.startswith('havenline/T'),(b,'task branch forbidden')
              cp=subprocess.run(['git','merge-base','--is-ancestor',row['head_sha'],f"origin/{os.environ['CANONICAL_BRANCH']}"])
              assert cp.returncode==0,(b,'head no longer contained in canonical')
              current=subprocess.check_output(['git','ls-remote','--heads','origin',b],text=True).strip()
              if current:
                  sha=current.split()[0]
                  assert sha==row['head_sha'],(b,'branch moved',sha,row['head_sha'])
              planned.append(b)
          pathlib.Path('/tmp/delete.txt').write_text('\n'.join(planned)+'\n')
          print(json.dumps({'planned_delete':planned},indent=2))
          PY

      - name: Delete fully merged stale refs
        run: |
          set -euo pipefail
          : > /tmp/deleted.txt
          while IFS= read -r branch; do
            [ -n "$branch" ] || continue
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
              echo "$branch|deleted" >> /tmp/deleted.txt
            else
              echo "$branch|already_absent" >> /tmp/deleted.txt
            fi
          done < /tmp/delete.txt

      - name: Verify no candidate refs remain
        run: |
          set -euo pipefail
          while IFS= read -r branch; do
            [ -n "$branch" ] || continue
            ! git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1
          done < /tmp/delete.txt
          git ls-remote --heads origin > /tmp/heads.txt

      - name: Publish cleanup audit
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$CANONICAL_BRANCH"
          git worktree add --detach "$RUNNER_TEMP/canonical-cleanup" "origin/$CANONICAL_BRANCH"
          python3 - <<'PY'
          import json,os,pathlib
          inv=json.load(open('/tmp/inventory.json'))
          deleted=[]
          for line in open('/tmp/deleted.txt'):
              if not line.strip(): continue
              branch,status=line.rstrip().split('|',1)
              deleted.append({'branch':branch,'status':status})
          result={
            'schema_version':1,
            'cleanup_date':'2026-09-21',
            'policy':inv['deletion_rule'],
            'deleted_or_already_absent':deleted,
            'preserved_unique_branches':inv['preserved_unique_branches'],
            'task_branch_policy':inv['task_branch_policy'],
            'open_pr_policy':inv['open_pr_policy'],
            'game_compile_effect':'none; every deleted branch head was already an ancestor of canonical and no task/open-PR branch was removed'
          }
          target=pathlib.Path(os.environ['RUNNER_TEMP'])/'canonical-cleanup'/os.environ['RESULT_PATH']
          target.parent.mkdir(parents=True,exist_ok=True)
          target.write_text(json.dumps(result,indent=2)+'\n')
          PY
          cd "$RUNNER_TEMP/canonical-cleanup"
          git config user.name "Havenline Branch Cleanup"
          git config user.email "branch-cleanup@example.invalid"
          git add "$RESULT_PATH"
          git commit -m "Archive: record fully merged stale-branch cleanup"
          git fetch --no-tags origin "$CANONICAL_BRANCH"
          test "$(git rev-parse HEAD^)" = "$(git rev-parse "origin/$CANONICAL_BRANCH")"
          git push origin HEAD:refs/heads/$CANONICAL_BRANCH
