name: T05 Artisan saw: actual source-traced independent Blender geometry
on:
  push:
    branches: [havenline/T05-r18-visual-corrections-20261025]
    paths:
      - .github/workflows/havenline-t05-artisan-saw.yml
      - tools/havenline/blender/t05_artisan_saw_reference_traced.py
      - Docs/Art/SourceReferences/T05/saw_mechanical_trace_v1.json
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: t05-artisan-saw-${{ github.ref }}
  cancel-in-progress: true
jobs:
  physically-model-owner-traced-saw:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out the full authoritative art and Blender script
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install free open-source Blender and its embedded NumPy
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends blender python3-numpy
          blender -b --python-expr 'import numpy; print("BLENDER_NUMPY_IMPORT_OK",numpy.__version__)'
      - name: Verify all exact original render bytes and literal hand-trace anchors
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          p=Path('Docs/Art/SourceReferences/T05')
          t=json.loads((p/'saw_mechanical_trace_v1.json').read_text())
          originals={
            '32451.jpg':'70e9e04c329797490b19aaa383865a5a2e20129bd1e0250a6997b170fb0510e4',
            '32450.jpg':'5b1831d03575e705f1baf5af5d4ac4b4ecd62e364b4287c7f841965625d4d719',
            '32441.png':'0ff99199e1eb4bedeffe4d9953f5253a97e49366a2118d5976132c9137d93510'}
          for n,sha in originals.items():
            assert hashlib.sha256((p/n).read_bytes()).hexdigest()==sha
          assert len(t['outer_steel_arch_pixels'])==len(t['inner_opening_pixels'])==15
          assert t['sha256']==originals['32451.jpg']
          print('PASS three byte-identical owner sources and 15 matched arch vertices')
          PY
      - name: Build physically separate saw objects directly in Blender with source pixels
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/t05-artisan-saw"
          blender -b -t 2 --factory-startup \
            --python tools/havenline/blender/t05_artisan_saw_reference_traced.py \
            -- Docs/Art/SourceReferences/T05 \
               Docs/Art/SourceReferences/T05/saw_mechanical_trace_v1.json \
               "$RUNNER_TEMP/t05-artisan-saw" \
            > "$RUNNER_TEMP/t05-artisan-saw/blender.log" 2>&1 || {
              tail -100 "$RUNNER_TEMP/t05-artisan-saw/blender.log"
              exit 1
            }
          grep -q 'T05_SOURCE_TRACED_PHYSICAL_SAW_EXPORT_PASS' "$RUNNER_TEMP/t05-artisan-saw/blender.log"
      - name: Check real editable blend, distinct geometry, and FOUR render PNGs
        run: |
          python - <<'PY'
          import json,os,struct,hashlib
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'t05-artisan-saw'
          a=json.loads((root/'STATUS.json').read_text())
          assert a['original_sources_verified']==3
          assert a['physical_saw_teeth']==19
          assert a['separate_mesh_objects']>=15
          assert not a['borrowed_R38_geometry'] and not a['whole_cooker_complete']
          assert not a['visual_critic_pass'] and not a['owner_approved']
          blend=(root/'T05_SAW_ARTISAN_MASTER.blend').read_bytes()
          model=(root/'T05_SAW_ARTISAN_MODULE.glb').read_bytes()
          assert blend[:7]==b'BLENDER-' and len(blend)>200000
          assert model[:4]==b'glTF' and len(model)>20000
          captures={}
          for v in ['FRONT_TRACE','RIGHT_HYPOTHESIS','REAR_HYPOTHESIS','ORBIT_CRITIQUE']:
            name=f'T05_SAW_{v}.png';raw=(root/name).read_bytes()
            assert raw[:8]==b'\x89PNG\r\n\x1a\n'
            assert struct.unpack('>II',raw[16:24])==(960,960)
            captures[v]=hashlib.sha256(raw).hexdigest()
          (root/'checks.json').write_text(json.dumps({
            'status':'ACTUAL_BLENDER_SAW_ART_GEOMETRY_AND_4_FRAMES_TECHNICAL_PASS',
            'renders':captures,'blender_sha256':hashlib.sha256(blend).hexdigest(),
            'glb_sha256':hashlib.sha256(model).hexdigest(),
            'owner_visual_approval':False,'whole_cooker_complete':False},indent=2)+'\n')
          print('PASS: real Blender source, distinct physical saw parts, four screenshot signatures — NOT full cooker art')
          PY
      - name: Archive component art WIP for source-bound critique
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: T05-artisan-owner-traced-saw-WIP-${{ github.run_id }}
          path: ${{ runner.temp }}/t05-artisan-saw/
          retention-days: 30
          if-no-files-found: warn
