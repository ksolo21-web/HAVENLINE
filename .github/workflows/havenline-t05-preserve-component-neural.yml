name: T05 preserve neural component reconstructions as rejected-candidate Git sources
on:
  push:
    branches: [havenline/T05-r18-visual-corrections-20261025]
    paths: [.github/workflows/havenline-t05-preserve-component-neural.yml]
permissions:
  contents: write
  actions: read
jobs:
  preserve-actual-component-meshes:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      DEST: Docs/Production/T05/NeuralTrials/R37_components
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Retrieve exact verified 3-piece neural generation output
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/t05-parts"
          gh run download 40776105618 -R "$GITHUB_REPOSITORY" \
            -n havenline-T05-original-physical-component-neural-40776105618 \
            -D "$RUNNER_TEMP/t05-parts"
      - name: Fail closed on source hash, triangle audit, absent mesh or claimed visual pass
        run: |
          python - <<'PY'
          import json,hashlib,os
          from pathlib import Path
          r=Path(os.environ['RUNNER_TEMP'])/'t05-parts'
          original=Path('Docs/Art/SourceReferences/T05')
          source=json.loads((r/'source/receipt.json').read_text())
          report=json.loads((r/'candidate_audit.json').read_text())
          assert len(source['components'])==len(report['parts'])==3
          assert not report['source_style_approved'] and not report['combined_assembly_created']
          for i,(a,b) in enumerate(zip(source['components'],report['parts'])):
            assert a['component']==b['part']
            assert hashlib.sha256((original/a['source']).read_bytes()).hexdigest()==a['source_sha256']
            assert (r/f'meshes/{i}/mesh.glb').is_file()
            assert (r/f'meshes/{i}/GODOT_YUP.glb').is_file()
            assert hashlib.sha256((r/f'meshes/{i}/mesh.glb').read_bytes()).hexdigest()==b['glb_sha256']
            assert 500<b['triangles']<1000000 and not b['visual_critic_pass']
          print('Exact original references and 3 generated GLB hashes verified')
          PY
      - name: Commit actual source pixels, meshes, and evidence as unapproved Git files
        run: |
          set -euo pipefail
          mkdir -p "$DEST"
          cp -a "$RUNNER_TEMP/t05-parts/source" "$DEST/"
          cp -a "$RUNNER_TEMP/t05-parts/meshes" "$DEST/"
          cp "$RUNNER_TEMP/t05-parts/candidate_audit.json" "$DEST/"
          cat > "$DEST/README.md" <<'EOF'
          # T05 R37: true neural reconstructions of three source-visible components

          The original owner images are tracked in Docs/Art/SourceReferences/T05/.
          These GLBs are generated individually from crops of those originals.

          Raw meat crate, finished-food tray, and silver saw/handle are
          **not positioned or connected into a real cooker**, do not include
          verified hidden geometry, and **do not pass the source visual critic**.
          This is persistent Git-tracked experimental source, not a shipping asset.
          Outputs are not proof of independent art review or phone performance.
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DEST"
          git diff --cached --check
          git commit -m 'T05 R37: preserve three original-image-derived neural cooker components (visual unapproved)'
          git push origin HEAD:"$GITHUB_REF_NAME"
