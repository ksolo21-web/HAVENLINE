name: HAVENLINE Native Android Review
on:
  push:
    branches: ['codex/havenline-godot-android', 'main']
    paths:
      - 'HavenlineGodot/**'
      - 'tools/havenline/**'
      - '!tools/havenline/production/**'
      - '.github/workflows/havenline-godot-android.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - 'HavenlineGodot/**'
      - 'tools/havenline/**'
      - '!tools/havenline/production/**'
      - '.github/workflows/havenline-godot-android.yml'
permissions:
  contents: read
concurrency:
  group: havenline-godot-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  native-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Archive exact native source
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/havenline-source"
          git archive --format=zip HEAD HavenlineGodot tools/havenline Docs/AI Docs/Art/EnvironmentReview AGENTS.md README.md .github/skills/environment-review .github/workflows/havenline-godot-android.yml > "$RUNNER_TEMP/havenline-source/HAVENLINE-native-source.zip"
          git rev-parse HEAD > "$RUNNER_TEMP/havenline-source/COMMIT.txt"
          cd "$RUNNER_TEMP/havenline-source"
          sha256sum HAVENLINE-native-source.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: HAVENLINE-native-source-${{ github.sha }}
          path: ${{ runner.temp }}/havenline-source/
          retention-days: 30
          if-no-files-found: error
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install checksum-pinned engine and Android templates
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot" "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          cd "$RUNNER_TEMP/godot"
          base='https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable'
          curl -fL --retry 3 "$base/Godot_v4.7.2-stable_linux.x86_64.zip" -o editor.zip
          echo '9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65  editor.zip' | sha512sum -c -
          unzip -q editor.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
          curl -fL --retry 3 "$base/Godot_v4.7.2-stable_export_templates.tpz" -o templates.tpz
          echo 'ca4d71c4d7b81dfc15d1a98baa07534aa95b03fdda78a0075b06672e1648d2e5f40980c9adc28d23e1b92e732ee7bf3461997aa804af74ec2fcd7a93ccb84079  templates.tpz' | sha512sum -c -
          unzip -j -q templates.tpz templates/android_debug.apk templates/android_release.apk templates/version.txt -d "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          sdkmanager 'platform-tools' 'build-tools;35.0.1'
      - name: Verify assets and run all engine regression suites
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 tools/havenline/asset_audit.py --output artifacts/assets.json
          python3 -m pip install -r tools/havenline/requirements-environment.txt
          python3 tools/havenline/bake_environment.py | tee artifacts/environment-bake.json
          python3 tools/havenline/environment_asset_audit.py --output artifacts/environment-assets.json
          python3 tools/havenline/bake_outpost_audio.py | tee artifacts/audio-bake.json
          timeout 180 Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path HavenlineGodot --import --quit 2>&1 | tee artifacts/import.log
          timeout 120 Godot_v4.7.2-stable_linux.x86_64 --headless --path HavenlineGodot --script res://tools/bake_crew_motion.gd 2>&1 | tee artifacts/motion-bake.log
          for suite in test_simulation test_crew_and_persistence test_motion_and_performance test_population test_outpost test_outpost_runtime test_environment test_render_budget test_adaptive_devices; do
            timeout 90 Godot_v4.7.2-stable_linux.x86_64 --headless --audio-driver Dummy --path HavenlineGodot --script "res://tests/$suite.gd" 2>&1 | tee "artifacts/$suite.log"
          done
          timeout 60 Godot_v4.7.2-stable_linux.x86_64 --headless --audio-driver Dummy --path HavenlineGodot --script res://tests/smoke_launch.gd 2>&1 | tee artifacts/launch.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:|ObjectDB instances were leaked' artifacts/*.log; then exit 1; fi
          python3 tools/havenline/summarize_evidence.py --artifacts artifacts
      - name: Render actual Mobile Vulkan views, scenarios, close-ups and native 4K
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-vulkan-drivers
          capture() {
            name="$1"; view="$2"; scenario="$3"
            mkdir -p "artifacts/$name"
            timeout 180 xvfb-run -a Godot_v4.7.2-stable_linux.x86_64 --path HavenlineGodot --rendering-method mobile --audio-driver Dummy --fixed-fps 60 -- --render-review --scenario="$scenario" --view="$view" --capture="$PWD/artifacts/$name" 2>&1 | tee "artifacts/$name.log"
          }
          capture mobile-render front opening
          for view in rear side left three-quarter; do capture "mobile-$view" "$view" opening; done
          for pair in night:three-quarter blizzard:front warmth4:overhead gather:side shelter-detail:front shelter-detail-rear:rear furnace-detail:front tree-detail:front; do
            scenario="${pair%%:*}"; view="${pair##*:}"
            capture "outpost-$scenario" "$view" "$scenario"
          done
          mkdir -p artifacts/outpost-native-4k
          timeout 240 xvfb-run -a Godot_v4.7.2-stable_linux.x86_64 --path HavenlineGodot --rendering-method mobile --audio-driver Dummy --fixed-fps 60 -- --view=front --capture="$PWD/artifacts/outpost-native-4k" 2>&1 | tee artifacts/outpost-native-4k.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:|ObjectDB instances were leaked' artifacts/mobile-*.log artifacts/outpost-*.log; then exit 1; fi
          python3 - <<'PY'
          import json,pathlib,struct
          reports=list(pathlib.Path('artifacts').glob('*/render-evidence.json'))
          assert len(reports)==14
          for p in reports:
              r=json.loads(p.read_text())
              assert r['renderer']=='mobile' and r['render_scale']==1.0
              assert not r['performance_certified'] and len(r['characters'])==4
              assert r['custom_c2_c4_rig_review_deferred']
              assert len(r['npc_population']['missing_templates'])==13
              assert r['outpost']['snow_instances']==640
              assert all(len(clips)>=3 for clips in r['source_clips'].values())
          p=pathlib.Path('artifacts/outpost-native-4k')
          r=json.loads((p/'render-evidence.json').read_text())
          w,h=struct.unpack('>II',(p/'native-scene.png').read_bytes()[16:24])
          assert w>=3840 and h>=2160 and r['internal_render']==[w,h]
          assert not r['render_review'] and not r['outpost']['native_4k60_certified']
          assert json.loads(pathlib.Path('artifacts/outpost-gather/render-evidence.json').read_text())['action_readout']['kind']=='gather'
          PY
      - name: Measure actual wall-clock native rendering separately from screenshots
        run: |
          set -euo pipefail
          mkdir -p artifacts/environment-benchmark
          timeout 360 xvfb-run -a Godot_v4.7.2-stable_linux.x86_64 --path HavenlineGodot --rendering-method mobile --audio-driver Dummy --script res://tests/benchmark_environment.gd -- --benchmark-seconds=60 --benchmark-warmup=10 --benchmark-output="$PWD/artifacts/environment-benchmark" 2>&1 | tee artifacts/environment-benchmark.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:|ObjectDB instances were leaked' artifacts/environment-benchmark.log; then exit 1; fi
          python3 - <<'PY'
          import json,pathlib
          r=json.loads(pathlib.Path('artifacts/environment-benchmark/benchmark.json').read_text())
          assert r['samples']>0 and r['retained_seconds']>=60
          assert r['renderer']=='mobile' and r['native_dimensions_and_scale_maintained']
          assert not r['fixed_timestep_used'] and not r['player_save_accessed']
          assert not r['sustained_4k60_certified'] and not r['physical_device_validated']
          print('Measured engine submission intervals. Software rendering is NOT Android performance certification.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: HAVENLINE-environment-renders-${{ github.sha }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: error
      - name: Export and verify isolated ARM64 review APK
        run: |
          set -euo pipefail
          python3 tools/havenline/configure_android.py --sdk "$ANDROID_HOME" --java "$JAVA_HOME" --godot "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          mkdir -p HavenlineGodot/build
          timeout 240 Godot_v4.7.2-stable_linux.x86_64 --headless --path HavenlineGodot --export-debug 'Android Review' 2>&1 | tee artifacts/export.log
          cp HavenlineGodot/build/HAVENLINE-native-review-arm64.apk artifacts/
          sha256sum artifacts/*.apk > artifacts/SHA256SUMS.txt
          cp HavenlineGodot/data/release-status.json artifacts/
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:' artifacts/export.log; then exit 1; fi
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose --print-certs artifacts/HAVENLINE-native-review-arm64.apk > artifacts/apk-signature.txt
          python3 tools/havenline/verify_apk.py artifacts/HAVENLINE-native-review-arm64.apk --output artifacts/apk-inspection.json
          python3 tools/havenline/verify_environment_apk.py artifacts/HAVENLINE-native-review-arm64.apk --output artifacts/environment-apk-inspection.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HAVENLINE-native-review-${{ github.sha }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: error
  publish-environment-evidence:
    needs: native-review
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'codex/havenline-environment-review' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: HAVENLINE-environment-renders-${{ github.sha }}
          path: ${{ runner.temp }}/environment-render-evidence
      - name: Publish unaltered actual renders for independent review
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          BUILD_SHA: ${{ github.sha }}
          BUILD_RUN: ${{ github.run_id }}
          EVIDENCE_ROOT: ${{ runner.temp }}/environment-render-evidence
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/codex/havenline-environment-review | cut -f1)" = "$SOURCE_SHA"
          python3 - <<'PY'
          import pathlib,shutil,json,hashlib,os
          root=pathlib.Path('Docs/Art/EnvironmentReview/captures');root.mkdir(parents=True,exist_ok=True)
          (root/'.gitattributes').write_text('*.png -filter -diff -merge\n*.json text eol=lf\n')
          records=[];text=['# Actual environment render evidence','',f"Source {os.environ['SOURCE_SHA']}; tested merge {os.environ['BUILD_SHA']}; Actions run {os.environ['BUILD_RUN']}.",'','These are unaltered Godot Mobile/software-Vulkan frames, not a physical-device FPS benchmark or a visual approval.','']
          for p in sorted(pathlib.Path(os.environ['EVIDENCE_ROOT']).glob('*/native-scene.png')):
              dest=root/p.parent.name;dest.mkdir(exist_ok=True)
              for name in ('native-scene.png','render-evidence.json'):shutil.copy2(p.parent/name,dest/name)
              records.append({'view':p.parent.name,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
              text += ['## '+p.parent.name,'',f'![{p.parent.name}](captures/{p.parent.name}/native-scene.png)','']
          assert len(records)==14
          (root/'provenance.json').write_text(json.dumps({'source':os.environ['SOURCE_SHA'],'build':os.environ['BUILD_SHA'],'run':os.environ['BUILD_RUN'],'captures':records,'independent_review_completed':False,'visual_score':None},indent=2)+'\n')
          pathlib.Path('Docs/Art/EnvironmentReview/CURRENT_RENDER_REVIEW.md').write_text('\n'.join(text))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Docs/Art/EnvironmentReview/captures Docs/Art/EnvironmentReview/CURRENT_RENDER_REVIEW.md
          git commit -m 'Preserve actual multi-angle environment renders for independent critique'
          git push origin HEAD:codex/havenline-environment-review
