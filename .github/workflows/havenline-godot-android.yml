name: HAVENLINE Native Android Review

on:
  push:
    branches: ['codex/havenline-godot-android', 'codex/havenline-native-completion-20260907', 'main']
    paths: ['HavenlineGodot/**', 'tools/havenline/**', '.github/workflows/havenline-godot-android.yml']
  workflow_dispatch:
  pull_request:
    paths: ['HavenlineGodot/**', 'tools/havenline/**', '.github/workflows/havenline-godot-android.yml']

permissions:
  contents: read

concurrency:
  group: havenline-godot-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  native-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Archive exact native source for reproducible continuation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/havenline-source"
          git archive --format=zip HEAD HavenlineGodot tools/havenline Docs/AI AGENTS.md README.md .github/workflows/havenline-godot-android.yml > "$RUNNER_TEMP/havenline-source/HAVENLINE-native-source.zip"
          git rev-parse HEAD > "$RUNNER_TEMP/havenline-source/COMMIT.txt"
          cd "$RUNNER_TEMP/havenline-source"
          sha256sum HAVENLINE-native-source.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: HAVENLINE-native-source-${{ github.sha }}
          path: ${{ runner.temp }}/havenline-source/
          retention-days: 30
          if-no-files-found: error
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install pinned Godot and Android templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot" "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          cd "$RUNNER_TEMP/godot"
          base='https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable'
          curl -fL --retry 3 "$base/Godot_v4.7.2-stable_linux.x86_64.zip" -o editor.zip
          echo '9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65  editor.zip' | sha512sum -c -
          unzip -q editor.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
          curl -fL --retry 3 "$base/Godot_v4.7.2-stable_export_templates.tpz" -o templates.tpz
          echo 'ca4d71c4d7b81dfc15d1a98baa07534aa95b03fdda78a0075b06672e1648d2e5f40980c9adc28d23e1b92e732ee7bf3461997aa804af74ec2fcd7a93ccb84079  templates.tpz' | sha512sum -c -
          unzip -j -q templates.tpz templates/android_debug.apk templates/android_release.apk templates/version.txt -d "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          rm editor.zip templates.tpz
          sdkmanager 'platform-tools' 'build-tools;35.0.1' 'platforms;android-35'
      - uses: actions/upload-artifact@v4
        with:
          name: HAVENLINE-pinned-Godot-4.7.2-${{ github.run_id }}
          path: ${{ runner.temp }}/godot/Godot_v4.7.2-stable_linux.x86_64
          retention-days: 7
          if-no-files-found: error
      - name: Verify supplied assets and run real Godot tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 tools/havenline/asset_audit.py --output artifacts/assets.json
          timeout 180 Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path HavenlineGodot --import --quit 2>&1 | tee artifacts/import.log
          timeout 90 Godot_v4.7.2-stable_linux.x86_64 --headless --path HavenlineGodot --script res://tools/build_locomotion.gd 2>&1 | tee artifacts/locomotion.log
          timeout 180 Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path HavenlineGodot --import --quit 2>&1 | tee artifacts/derived-import.log
          for suite in test_simulation test_native_regression test_native_runtime test_native_scene; do
            timeout 120 Godot_v4.7.2-stable_linux.x86_64 --headless --path HavenlineGodot --script "res://tests/$suite.gd" 2>&1 | tee "artifacts/$suite.log"
          done
          timeout 60 Godot_v4.7.2-stable_linux.x86_64 --headless --path HavenlineGodot --quit-after 5 2>&1 | tee artifacts/launch.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:' artifacts/*.log; then exit 1; fi
      - name: Render actual Mobile-engine evidence, not performance certification
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb xauth libvulkan1 mesa-vulkan-drivers
          mkdir -p artifacts/render
          for fixture in 'idle 0 1.8 front-idle' 'walk 0 .6 front-walk' 'run 0 .3 front-run' 'run 90 .3 side-run' 'run 180 .8 back-run' 'run 270 .8 other-side-run'; do
            read -r clip angle phase name <<< "$fixture"
            folder="$GITHUB_WORKSPACE/artifacts/render/$name"
            mkdir -p "$folder"
            timeout 180 xvfb-run -a -s '-screen 0 1280x720x24' Godot_v4.7.2-stable_linux.x86_64 --path HavenlineGodot --rendering-method mobile --audio-driver Dummy --resolution 1280x720 -- --render-review "--qa-animation=$clip" "--qa-angle=$angle" "--qa-time=$phase" "--capture=$folder" 2>&1 | tee "artifacts/render-$name.log"
          done
          folder="$GITHUB_WORKSPACE/artifacts/render/native-4k"
          mkdir -p "$folder"
          timeout 240 xvfb-run -a -s '-screen 0 1280x720x24' Godot_v4.7.2-stable_linux.x86_64 --path HavenlineGodot --rendering-method mobile --audio-driver Dummy --resolution 1280x720 -- --qa-animation=idle --qa-time=1.8 "--capture=$folder" 2>&1 | tee artifacts/render-native-4k.log
          python3 - <<'PYRENDER'
          import json, struct
          from pathlib import Path
          reports = list(Path('artifacts/render').glob('*/render-evidence.json'))
          assert len(reports) == 7, 'Missing rendered evidence'
          for path in reports:
              data = json.loads(path.read_text())
              assert data['renderer'] == 'mobile', 'Renderer fallback is not native Mobile evidence'
              assert data['active_script'] == 'res://scripts/main_native.gd'
              assert data['source_character1_sha256'] == '95e4fed3a2778656cdf8b73affd2eb3feda8a32f82f4a0c3f76d90c82633c099'
              assert data['performance_certified'] is False
              if path.parent.name == 'native-4k':
                  assert data['internal_render'] == [3840, 2160]
                  assert data['render_scale'] == 1 and not data['render_review']
                  png = (path.parent / 'native-scene.png').read_bytes()
                  assert png[:8] == b'\x89PNG\r\n\x1a\n'
                  assert struct.unpack('>II', png[16:24]) == (3840, 2160)
          print('Seven native-renderer fixtures captured; physical Android 4K/60 remains untested.')
          PYRENDER
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:' artifacts/render-*.log; then exit 1; fi
      - name: Stamp exact build identity
        shell: bash
        run: |
          python3 - <<'PYIDENTITY'
          import json, os
          from pathlib import Path
          data = {'schema': 1, 'source_revision': os.environ['GITHUB_SHA'], 'source_head_branch': os.environ.get('GITHUB_HEAD_REF') or os.environ['GITHUB_REF_NAME'], 'workflow_run_id': os.environ['GITHUB_RUN_ID'], 'engine': 'Godot 4.7.2', 'status': 'development_only', 'physical_performance_certified': False}
          Path('HavenlineGodot/data/build-identity.json').write_text(json.dumps(data, indent=2) + '\n')
          PYIDENTITY
      - name: Export isolated ARM64 review APK
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/havenline/configure_android.py --sdk "$ANDROID_HOME" --java "$JAVA_HOME" --godot "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          mkdir -p HavenlineGodot/build
          Godot_v4.7.2-stable_linux.x86_64 --headless --path HavenlineGodot --export-debug 'Android Review' 2>&1 | tee artifacts/export.log
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose HavenlineGodot/build/HAVENLINE-native-review-arm64.apk > artifacts/apk-signature.txt
          cp HavenlineGodot/build/HAVENLINE-native-review-arm64.apk artifacts/
          sha256sum artifacts/*.apk > artifacts/SHA256SUMS.txt
          cp HavenlineGodot/data/release-status.json artifacts/
          cp HavenlineGodot/data/build-identity.json artifacts/
          cp HavenlineGodot/assets/animations/provenance.json artifacts/locomotion-provenance.json
          python3 - <<'PYSOURCE'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          with ZipFile('artifacts/HAVENLINE-native-buildable-source.zip','w',ZIP_DEFLATED) as z:
              for directory in ['HavenlineGodot','tools/havenline','Docs/AI']:
                  for p in Path(directory).rglob('*'):
                      if p.is_file() and not any(x in p.parts for x in ['.godot','build','__pycache__']):
                          z.write(p,p.as_posix())
              for name in ['AGENTS.md','README.md','.github/workflows/havenline-godot-android.yml']:
                  z.write(name,name)
          PYSOURCE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HAVENLINE-native-review-${{ github.sha }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: error
