name: Havenline phone/tablet delivery gate
on:
  push:
    branches: ['codex/havenline-environment-review', 'codex/havenline-godot-android', 'main']
    paths: ['HavenlineGodot/**', 'tools/havenline/**', 'Docs/QA/**', '.github/workflows/havenline-device-release-gate.yml']
  pull_request:
    paths: ['HavenlineGodot/**', 'tools/havenline/**', 'Docs/QA/**', '.github/workflows/havenline-device-release-gate.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: havenline-device-release-gate-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  validator-tests:
    name: Validator regression tests (not game approval)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools/havenline/tests -p 'test_release_gate.py' -v
  production-readiness:
    name: Full game + independent 10/10 + physical phone/tablet 4K60
    needs: validator-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ENFORCE_RELEASE_GATE: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'pull_request' && (github.base_ref == 'main' || startsWith(github.base_ref, 'release/'))) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Classify release-gate applicability
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          mkdir -p delivery-gate
          if [ "$ENFORCE_RELEASE_GATE" = "true" ]; then
            printf '%s\n' '{"enforced":true,"reason":"explicit release context; full release evidence is mandatory"}' > delivery-gate/scope.json
            echo "::notice::Full phone/tablet delivery gate is ENFORCED for this release context."
          else
            python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('delivery-gate/scope.json').write_text(json.dumps({
              'enforced': False,
              'reason': 'development-stage change; full-game release certification is not applicable',
              'event': os.environ.get('EVENT_NAME',''),
              'ref': os.environ.get('REF_NAME',''),
              'base_ref': os.environ.get('BASE_REF',''),
              'policy': 'validator regression tests remain mandatory; final release evidence remains fail-closed in release contexts'
          }, indent=2) + '\n')
          PY
            echo "::notice::Development-stage change: full-game phone/tablet release certification is NOT APPLICABLE. Validator regression tests remain mandatory."
          fi
      - name: Enforce the exact-source gate before any player delivery
        if: env.ENFORCE_RELEASE_GATE == 'true'
        env:
          SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 tools/havenline/release_gate.py \
            --evidence Docs/QA/ReleaseEvidence \
            --source "$SOURCE" \
            --status HavenlineGodot/data/release-status.json \
            --output delivery-gate/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: havenline-player-delivery-gate-${{ github.run_id }}
          path: delivery-gate/
          if-no-files-found: error
          retention-days: 30
# Full release evidence remains intentionally fail-closed whenever ENFORCE_RELEASE_GATE is true.
# Development PRs still run the validator regression suite but do not falsely claim or require final release readiness.
# Branch-protection settings are not changed by this workflow.
