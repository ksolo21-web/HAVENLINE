name: Havenline T05 R01 actual-scene context evidence
on:
  push:
    branches: ['havenline/T05-visual-repair-20260926']
    paths:
      - 'Docs/Production/T05/R01_V4_MATERIALIZED.json'
      - 'tools/havenline/task05/capture_r01_shipping_context.py'
      - '.github/workflows/havenline-task05-r01-shipping-context.yml'
permissions:
  contents: read
concurrency:
  group: havenline-t05-r01-context-${{ github.ref }}
  cancel-in-progress: false
jobs:
  shipping-context:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify committed R01 identity and bounded source boundary
        run: |
          set -euo pipefail
          mkdir -p task05-r01-context
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git lfs fetch origin "$GITHUB_SHA" --include='HavenlineGodot/**,Docs/Production/T02/reference-ground.webp' --exclude=''
          git lfs checkout 'HavenlineGodot/**' Docs/Production/T02/reference-ground.webp
          python3 - <<'PYBIND'
          import hashlib,json,os,re,subprocess
          from pathlib import Path
          source=os.environ['GITHUB_SHA']
          receipt={}
          paths=subprocess.check_output(['git','ls-tree','-r','--name-only',source,'HavenlineGodot'],text=True).splitlines()
          for name in paths:
              frozen=subprocess.check_output(['git','show',source+':'+name])
              actual=Path(name).read_bytes()
              if frozen.startswith(b'version https://git-lfs.github.com/spec/v1\n'):
                  match=re.fullmatch(rb'version https://git-lfs.github.com/spec/v1\noid sha256:([0-9a-f]{64})\nsize ([0-9]+)\n',frozen)
                  assert match, name
                  expected=match[1].decode();size=int(match[2])
                  assert len(actual)==size and hashlib.sha256(actual).hexdigest()==expected,name
                  receipt[name]={'sha256':expected,'size':size,'lfs_pointer_sha256':hashlib.sha256(frozen).hexdigest()}
              else:
                  assert actual==frozen,name
                  receipt[name]={'sha256':hashlib.sha256(actual).hexdigest(),'size':len(actual),'lfs_pointer_sha256':None}
          Path('task05-r01-context/runtime-source-binding.json').write_text(json.dumps({'application_source':source,'runtime_paths':receipt,'task_approved':False},indent=2)+'\n')
          PYBIND
          integration=$(git rev-parse origin/codex/havenline-sequential-task-01)
          echo "TRUSTED_INTEGRATION=$integration" >> "$GITHUB_ENV"
          python3 tools/havenline/task05/verify_r01_v4_scope.py --head "$GITHUB_SHA" --integration-head "$integration" | tee task05-r01-context/source-proof.json
          python3 -m py_compile tools/havenline/task05/capture_r01_shipping_context.py
      - name: Prepare checksum-pinned renderer and unchanged runtime fixtures
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb mesa-vulkan-drivers
          python3 -m pip install --disable-pip-version-check numpy pillow
          mkdir -p "$RUNNER_TEMP/engine"
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o "$RUNNER_TEMP/engine/engine.zip"
          (cd "$RUNNER_TEMP/engine"; echo '9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65  engine.zip' | sha512sum -c -; unzip -q engine.zip; chmod +x Godot_v4.7.2-stable_linux.x86_64)
          engine="$RUNNER_TEMP/engine/Godot_v4.7.2-stable_linux.x86_64"
          python3 tools/havenline/bake_outpost_audio.py > task05-r01-context/audio-fixture.json
          timeout 240 "$engine" --headless --editor --path HavenlineGodot --import --quit > task05-r01-context/import.log 2>&1
          timeout 120 "$engine" --headless --audio-driver Dummy --path HavenlineGodot --script res://tools/bake_crew_motion.gd > task05-r01-context/motion-fixture.log 2>&1
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:' task05-r01-context/import.log task05-r01-context/motion-fixture.log; then exit 1; fi
      - name: Capture phone tablet firebox night blizzard and upgraded states
        run: |
          set -euo pipefail
          export VK_ICD_FILENAMES=$(find /usr/share/vulkan/icd.d -name '*lvp*json' | head -1)
          test -n "$VK_ICD_FILENAMES"
          python3 tools/havenline/task05/capture_r01_shipping_context.py --engine "$RUNNER_TEMP/engine/Godot_v4.7.2-stable_linux.x86_64" --source "$GITHUB_SHA" --integration-head "$TRUSTED_INTEGRATION" --executor-source "$GITHUB_SHA" --repo-root "$PWD" --out task05-r01-context | tee task05-r01-context/execution.log
          python3 - <<'PYAFTER'
          import hashlib,json,os,subprocess
          from pathlib import Path
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==os.environ['GITHUB_SHA']
          p=Path('task05-r01-context/runtime-source-binding.json');proof=json.loads(p.read_text())
          for name,row in proof['runtime_paths'].items():
              actual=Path(name).read_bytes()
              assert len(actual)==row['size'] and hashlib.sha256(actual).hexdigest()==row['sha256'],name
          proof['runtime_source_unchanged_after_captures']=True
          p.write_text(json.dumps(proof,indent=2)+'\n')
          PYAFTER
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: t05-r01-shipping-context-${{ github.sha }}
          path: task05-r01-context
          if-no-files-found: error
          retention-days: 14
