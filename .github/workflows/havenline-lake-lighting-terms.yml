name: Havenline lake settled lighting-term diagnosis
on:
  push:
    branches: ['codex/havenline-sequential-task-01']
    paths: ['.github/workflows/havenline-lake-lighting-terms.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - run: python3 -m pip install pyyaml
      - name: Execute same-view settled lighting diagnosis
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import yaml,subprocess
          original=yaml.safe_load(Path('.github/workflows/havenline-lake-shading-diagnostic.yml').read_text())
          runs=[step['run'] for step in original['jobs']['diagnose']['steps'] if 'run' in step];assert len(runs)==1
          run=runs[0].replace("'-screen 0 1280x720x24' timeout 180","'-screen 0 3840x2160x24' timeout 420").replace('--resolution 1280x720','--resolution 3840x2160').replace('res://tests/probe_lake_shading.gd','res://tests/probe_lake_lighting_terms.gd')
          Path('diagnosis').mkdir(exist_ok=True)
          Path('diagnosis/executed.sh').write_text(run)
          subprocess.run(['bash','-euo','pipefail','-c',run],check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: havenline-lake-lighting-terms-${{ github.run_id }}
          path: diagnosis/
          retention-days: 30
          if-no-files-found: error
# Diagnostic-only shader/light comparisons; no art score or task approval.
