name: Havenline T01 single-board comparison control
on:
  push:
    branches: ['codex/havenline-sequential-task-01']
    paths: ['.github/workflows/havenline-task01-board-control.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  compare-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: havenline-T01-palette-evidence-34253307899
          run-id: 34253307899
          github-token: ${{ github.token }}
          path: actual-evidence/
      - run: python3 -m pip install pillow
      - name: Resolve actual checksum-bound reference and candidate bytes, not LFS pointers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib,shutil
          from PIL import Image
          e=Path('actual-evidence');target=Path('Docs/Production/T01/ActualReview/R9')
          p=json.loads((e/'provenance.json').read_text());assert p['source']=='ae1b487748510f4a9d83706e51f30ff7174bc879'
          assert len(p['captures'])==63
          for name,h in p['captures'].items():
              assert hashlib.sha256((e/name).read_bytes()).hexdigest()==h
          for name,h in {'reference-detail.webp':'25b0e78c93f13ddadb8b815e7e19daf68485471d2be3fed0dd99bde8d00c48af','clearance/clearance-baseline.png':p['captures']['clearance/clearance-baseline.png']}.items():
              source=e/name;assert hashlib.sha256(source.read_bytes()).hexdigest()==h
              with Image.open(source) as image:image.verify()
              destination=target/name;destination.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(source,destination)
          out=Path('comparison-control');out.mkdir(exist_ok=True)
          (out/'evidence-loading.json').write_text(json.dumps({'source':p['source'],'artifact_id':10067016119,'source_images_unchanged':True,'reference_sha256':'25b0e78c93f13ddadb8b815e7e19daf68485471d2be3fed0dd99bde8d00c48af','fix':'Use original artifact bytes instead of Git LFS pointer checkout','task_approved':False},indent=2))
          PY
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/havenline-t01-gemma
          key: havenline-t01-gemma3-12b-qat-b10809-v1
          fail-on-cache-miss: true
      - name: Verify factual same/different comparison; no art score requested
        run: python3 -u tools/havenline/check_single_board_comparison.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: havenline-T01-single-board-control-${{ github.run_id }}
          path: comparison-control/
          retention-days: 30
          if-no-files-found: error
# Original control rubric and answer key unchanged. No game changes, art score or task advance.
